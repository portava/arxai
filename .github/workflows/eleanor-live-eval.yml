# Eleanor live-model eval: the REAL model answers every fixture question
# through the production chatTurnLoop + runtime verifier, against recorded tool
# results (no database, broker or account is touched; the loop cannot place
# orders). Writes a measured report: claims made, claims verified, findings by
# kind, raw-model accuracy, per-fixture results. Docs: arxai/docs/ELEANOR_EVALS.md.
#
# Triggers: push to the base branch and manual dispatch ONLY. Never on
# pull_request, so a fork PR can never reach the secret (and a PR never spends
# model budget). The secret is read by this job only.
#
# Missing secret => "not run: no key" in the log and job summary, and the job
# FAILS. A lane that silently passes without measuring anything is not allowed.
#
# Owner setup: add the repository secret OPENAI_API_KEY (Settings > Secrets and
# variables > Actions). Optional repository variables: ELEANOR_EVAL_MODEL
# (default: the production chat model), ELEANOR_EVAL_MIN_ACCURACY (default 0.90).
name: Eleanor live eval

on:
  push:
    branches: [claude/replit-slice6-eleanor-20261105]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eleanor-live-eval-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: arxai

jobs:
  eleanor-live-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=4096
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ELEANOR_EVAL_MODEL: ${{ vars.ELEANOR_EVAL_MODEL }}
      ELEANOR_EVAL_MIN_ACCURACY: ${{ vars.ELEANOR_EVAL_MIN_ACCURACY || '0.9' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: arxai/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run the real model over the fixture corpus
        run: >-
          pnpm --filter @workspace/api-server run eval:eleanor-live -- --require-key --strict
          --out "$RUNNER_TEMP/eleanor-live-eval.json"
          --summary "$RUNNER_TEMP/eleanor-live-eval.md"
      - name: Upload the measured report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eleanor-live-eval-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/eleanor-live-eval.json
            ${{ runner.temp }}/eleanor-live-eval.md
          if-no-files-found: warn
          retention-days: 90
