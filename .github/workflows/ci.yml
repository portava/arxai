# ARX CI. The app lives under arxai/ (the Replit workspace layout).
#
#   ci           - `pnpm run ci`: typecheck, the guard suite and every wired
#                  test script. Some wired scripts reach a database, so the job
#                  gets a throwaway Postgres 16 (Replit's version) and the
#                  schema is pushed first (push-force: the DB is disposable).
#   integration  - `pnpm run ci:integration` on its own throwaway Postgres. The
#                  lane provisions the schema itself and fails hard on a
#                  missing DB because ARX_REQUIRE_INTEGRATION_DB is set.
#
# No secrets are used; pull requests run with a read-only token.
name: CI

on:
  push:
    branches: [main, master, "codex/**", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: arxai

env:
  NODE_OPTIONS: --max-old-space-size=6144
  # Production runs in UTC; timestamp-without-zone columns and bar bucketing
  # assume it (duplicate detection broke under a non-UTC runner clock).
  TZ: UTC
  # Disposable signing key for the throwaway CI database only. Command
  # integrity signatures derive from it; without one, signed-command tests
  # cannot settle. Not a secret: it protects nothing outside this job.
  SESSION_SECRET: ci-only-disposable-session-secret-not-used-anywhere-else

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: arx_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d arx_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/arx_ci
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: arxai/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Provision schema (disposable DB)
        run: pnpm --filter @workspace/db run push-force
      - name: Native history and renderer regressions
        env:
          ARX_REQUIRE_INTEGRATION_DB: "true"
        run: |
          pnpm --dir artifacts/api-server exec node --import tsx --test --test-force-exit src/lib/data/chart/__qa__/fullHistoryRepair.test.ts src/lib/data/chart/__qa__/fullHistoryRepair.postgres.test.ts
          pnpm --dir artifacts/trading-dashboard exec vitest run src/lib/useChartDeepHistory.test.ts src/lib/chart-engine/arxCanvas.test.ts src/lib/chart-engine/chartReplay.test.ts src/lib/chart-engine/lightweightChartsAdapter.renderFidelity.test.ts src/components/news/HighImpactEventBanner.dateOnly.test.tsx
          python3 -m unittest discover -s mt5-bridge/market/relay -p "test_*.py"
      - run: pnpm run ci

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: arx_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d arx_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/arx_ci
      ARX_REQUIRE_INTEGRATION_DB: "true"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: 10.26.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: arxai/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # auth-session-browser drives the real /login flow in Chromium.
      # Eight *-postgres tests start their own disposable cluster with
      # initdb/pg_ctl (ARX_TEST_PG_BIN). Those server tools are not on the
      # runner's PATH; point the tests at the image's PostgreSQL bin directory.
      - name: Locate PostgreSQL server binaries for disposable-cluster tests
        run: |
          bin=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)
          if [ -z "$bin" ] || [ ! -x "$bin/initdb" ]; then
            sudo apt-get update -q && sudo apt-get install -y -q postgresql
            bin=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          fi
          "$bin/initdb" --version
          echo "ARX_TEST_PG_BIN=$bin" >> "$GITHUB_ENV"
      - name: Install Chromium for the browser session test
        run: pnpm --filter @workspace/scripts exec playwright install --with-deps chromium
      - run: pnpm run ci:integration
