        Bucketed strings + a few numerics; carries no per-user data. Powers the
        similar-setup lookup via field-by-field comparison.
      required:
        [symbol, timeframe, direction, tradeType, regime, htfBias,
         trendStrengthBucket, levelType, levelPersonality, distanceBucket,
         candlePressure, candleIntent, wickBehavior, entryQuality, agentAgreement,
         riskStatus, stage, freshnessBucket, readinessBucket, qualityLabel,
         readinessScore, trendStrength, distancePct]
      properties:
        symbol: { type: string }
        timeframe: { type: string }
        direction: { type: string, enum: [BUY, SELL, NEUTRAL] }
        tradeType: { type: string }
        regime: { type: string }
        htfBias: { type: string }
        trendStrengthBucket: { type: string }
        levelType: { type: string }
        levelPersonality: { type: string }
        distanceBucket: { type: string }
        candlePressure: { type: string }
        candleIntent: { type: string }
        wickBehavior: { type: string }
        entryQuality: { type: string }
        agentAgreement: { type: string }
        riskStatus: { type: string }
        stage: { type: string }
        freshnessBucket: { type: string }
        readinessBucket: { type: string }
        qualityLabel: { type: string }
        readinessScore: { type: ["number", "null"] }
        trendStrength: { type: ["number", "null"] }
        distancePct: { type: ["number", "null"] }

    ChartDecisionReceiptView:
      type: object
      description: An immutable Decision Receipt as returned to the owning user.
      required:
        [receiptId, symbol, timeframe, source, vetoed, agentConflict,
         fingerprint, createdAt]
      properties:
        receiptId: { type: string }
        symbol: { type: string }
        displaySymbol: { type: ["string", "null"] }
        timeframe: { type: string }
        source: { type: string }
        intent: { type: ["string", "null"] }
        direction: { type: ["string", "null"] }
        tradeType: { type: ["string", "null"] }
        marketSentence: { type: ["string", "null"] }
        setupStage: { type: ["string", "null"] }
        setupFreshness: { type: ["string", "null"] }
        readinessScore: { type: ["integer", "null"] }
        qualityLabel: { type: ["string", "null"] }
        vetoed: { type: boolean }
        agentConsensusStance: { type: ["string", "null"] }
        agentConflict: { type: boolean }
        courtResult: { type: ["string", "null"] }
        riskWarning: { type: ["string", "null"] }
        rubyFinalRead: { type: ["string", "null"] }
        confidenceScore: { type: ["integer", "null"] }
        confidenceLabel: { type: ["string", "null"] }
        whatWouldChange: { type: ["string", "null"] }
        invalidation: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"] }
        keyLevels: {}
        agentVotes: {}
        confidenceBreakdown: {}
        fingerprint: { $ref: "#/components/schemas/ChartSetupFingerprint" }
        chartTruthSnapshot: { type: object, additionalProperties: true }
        intelligenceSnapshot: { type: object, additionalProperties: true }
        createdAt: { type: string }

    ChartDecisionOutcomeView:
      type: object
      description: An append-only OUTCOME or REVIEW record attached to a receipt.
      required: [id, receiptRef, kind, createdAt]
      properties:
        id: { type: integer }
        receiptRef: { type: string }
        kind: { type: string, enum: [OUTCOME, REVIEW] }
        outcome: { type: ["string", "null"] }
        plQuality: { type: ["string", "null"] }
        realizedPl: { type: ["number", "null"] }
        note: { type: ["string", "null"] }
        evidence: {}
        createdAt: { type: string }

    ChartDecisionReceiptCreateRequest:
      type: object
      required: [symbol, intent, source]
      properties:
        symbol: { type: string, minLength: 1, maxLength: 64 }
        timeframe:
          type: string
          enum: [M1, M5, M15, M30, H1, H4, D1]
          default: M5
        limit: { type: integer, minimum: 1, maximum: 5000, default: 300 }
        intent:
          type: string
          enum:
            [analyze, is-this-a-buy, is-this-a-scalp, why-not-now,
             what-changes-my-mind, what-invalidates, hold-or-close,
             agent-consensus]
        source:
          type: string
          enum: [ruby_draft_read, ruby_explain_signal, chart_read, chart_trade_plan]
        direction: { type: string, enum: [BUY, SELL, NEUTRAL] }

    ChartDecisionReceiptCreateResponse:
      type: object
      required: [created, receipt, safetyMode, liveLocked, readOnlyMode, allowOrderExecution]
      properties:
        created: { type: boolean }
        receipt:
          oneOf:
            - $ref: "#/components/schemas/ChartDecisionReceiptView"
            - type: "null"
        safetyMode: { type: string, enum: [paper_only] }
