openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: ARX AI — Analyze. Risk. eXecute. — API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Bot control and status
  - name: signals
    description: Market signals and scanner
  - name: trades
    description: Trade logs and execution
  - name: strategies
    description: Strategy management
  - name: risk
    description: Risk management settings
  - name: performance
    description: Performance analytics
  - name: backtest
    description: Backtesting operations
  - name: settings
    description: Bot and system settings
  - name: mt5
    description: MT5 EA bridge endpoints
  - name: broker-hub
    description: Feature-flagged, tenant-owned broker metadata (read-only)
  - name: learning
    description: AI learning and coaching
  - name: data
    description: Market data providers
  - name: tradeManagement
    description: Trade management and live actions
  - name: news
    description: Economic calendar and news risk
  - name: portfolioRisk
    description: Portfolio & exposure risk engine (Build O)
  - name: backtestRuns
    description: Backtesting & strategy validation (Build P)
  - name: paperTrading
    description: Paper trading sandbox (Build Q) — simulated only
  - name: propChallenges
    description: Prop firm challenge mode (Build R) — practice/training only
  - name: ruleContracts
    description: Personal rule contracts & accountability (Build S) — soft warnings only
  - name: tradingReadiness
    description: Pre-session readiness & trading-prep checks (Build T) — advisory only
  - name: postTradeDebriefs
    description: Post-trade debriefs & AI coaching feedback (Build U) — reflective only
  - name: tradingPlaybooks
    description: Personal trading playbooks & AI-suggested rules (Build V) — guidance only
  - name: edgeDiscovery
    description: AI Edge Discovery — historical probability summaries (Build W) — never predictive
  - name: traderSkill
    description: Trader skill benchmark & level (Build X) — process quality, not P&L
  - name: aiMentor
    description: AI Mentor — personalized behavior guidance (Build Y) — never profit promises, never bypass safety
  - name: alerts
    description: Notifications and alert system
  - name: watchlists
    description: Watchlists and favorites
  - name: portfolio
    description: Portfolio exposure and correlation
  - name: journal
    description: Trade journal entries with emotion and mistake tracking
  - name: intelligence
    description: Market intelligence — forex macro, indices analysis, synthetic analysis
  - name: system
    description: Phase 1 Safety Core — operational mode, kill switch, vault, state transitions
  - name: meMasterLive
    description: User-facing Master/Shared Live access gate
  - name: adminAllocations
    description: Admin — shared-bridge allocations and shared-live pause/resume
  - name: rubyQuality
    description: User — my Ruby signal outcomes and plain-language self-reviews (read-only)
  - name: adminRubyQuality
    description: Admin — Ruby signal-quality metrics, missed-opportunity replay, and audited tuning (ADMIN/OWNER)
  - name: selfTradeAi
    description: Self-Trade AI — autonomous agent fleet read surfaces (owner-isolated). Foundation phase — no autonomous execution
  - name: adminSelfTradeAi
    description: Admin — Self-Trade AI fleet control (create/fund/defund/configure/autonomy/status/kill-switch). ADMIN/OWNER, fail-closed audited
  - name: aaci
    description: ARX Adaptive Cohesion Intelligence — per-user, read-only advisory cohesion verdict. Never an execution gate; AACI can only ADD caution
  - name: adminAaci
    description: Admin — AACI full diagnostic detail (sub-scores, validity factors, handshakes, conflicts, snapshot). ADMIN/OWNER only
  - name: adminSecurity
    description: Admin — Security posture surfaces (security score + band, encryption/protection status, redacted security-event timeline). Read-only; ADMIN/OWNER only; never exposes secret values
  - name: adminIntelligence
    description: Admin — Ruby signal calibration roll-up (predicted confidence tier vs realized accuracy by timeframe). Read-only over existing resolved outcomes; ADMIN/OWNER only; never an execution gate
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /profit-missions:
    get:
      operationId: listProfitMissions
      tags: [profit-missions]
      summary: List the authenticated user's profit missions
      responses:
        "200":
          description: The user's missions (most recent first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfitMission"
    post:
      operationId: createProfitMission
      tags: [profit-missions]
      summary: Create a profit mission plan (planning + display only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfitMissionRequest"
      responses:
        "201":
          description: Created mission with computed assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitMission"
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/parse-intent:
    post:
      operationId: parseProfitMissionIntent
      tags: [profit-missions]
      summary: Parse a natural-language mission description (advisory / planning only)
      description: >
        Advisory / planning only. Pure deterministic text parsing — no LLM,
        no persistence, no execution gate, no draft created. Returns the
        parsed amounts and timeframe when the description is recognized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseMissionIntentRequest"
      responses:
        "200":
          description: Parsed intent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseMissionIntentResponse"
        "400":
          description: Could not parse the description
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}:
    get:
      operationId: getProfitMission
      tags: [profit-missions]
      summary: Get one of the authenticated user's profit missions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The mission with computed assessment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitMission"
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/pulse:
    get:
      operationId: getProfitMissionPulse
      tags: [profit-missions]
      summary: Recompute a mission's pace / feasibility / probability (display-only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Live recompute against the current account value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitMissionPulse"
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/pause:
    patch:
      operationId: pauseProfitMission
      tags: [profit-missions]
      summary: Pause a running mission (user lifecycle action; display-only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionLifecycleActionRequest"
      responses:
        "200":
          description: Updated mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitMission"
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "409":
          description: Illegal lifecycle transition for the mission's current state
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/resume:
    patch:
      operationId: resumeProfitMission
      tags: [profit-missions]
      summary: Resume a paused mission (user lifecycle action; display-only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionLifecycleActionRequest"
      responses:
        "200":
          description: Updated mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitMission"
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "409":
          description: Illegal lifecycle transition for the mission's current state
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/cancel:
    patch:
      operationId: cancelProfitMission
      tags: [profit-missions]
      summary: Cancel a mission (terminal user lifecycle action; display-only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionLifecycleActionRequest"
      responses:
        "200":
          description: Updated (cancelled) mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitMission"
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "409":
          description: Illegal lifecycle transition for the mission's current state
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/settings:
    patch:
      operationId: updateProfitMissionSettings
      tags: [profit-missions]
      summary: Update a mission's settings (records an override event; display-only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionSettingsUpdateRequest"
      responses:
        "200":
          description: Updated mission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfitMission"
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "409":
          description: Mission is in a terminal state and cannot be edited
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/events:
    get:
      operationId: listProfitMissionEvents
      tags: [profit-missions]
      summary: List a mission's append-only journal events (paginated, user-scoped)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: The mission's journal events (most recent first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionEvent"
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/agents:
    get:
      operationId: listMissionAgents
      tags: [profit-missions]
      summary: List a mission's specialist agent team (advisory; user-scoped)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The mission's agent team
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionAgent"
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/proposals:
    get:
      operationId: listMissionProposals
      tags: [profit-missions]
      summary: List a mission's structured agent proposals (advisory; user-scoped)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: The mission's proposals (most recent first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MissionProposal"
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/scan:
    post:
      operationId: runMissionScan
      tags: [profit-missions]
      summary: >
        Run the mission's specialist agents to produce structured proposals.
        Advisory artifacts only — no draft, no execution. Honest-empty when no
        live feed yields an edge.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The fresh scan result (team proposals + judge selection)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionScanResult"
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/trade-drafts:
    get:
      operationId: listMissionTradeDrafts
      tags: [profit-missions]
      summary: >
        List a mission's reviewable trade drafts (Phase 5; user-scoped). Approval
        artifacts only — never an order. Expiry is enforced on read.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
      responses:
        "200":
          description: The mission's trade drafts (most recent first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TradeDraft"
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/trade-drafts/{draftId}/manage-exit:
    post:
      operationId: manageMissionTradeExit
      tags: [profit-missions]
      summary: >
        Decide + route the next protective exit action for an OPEN (executed)
        mission trade (Phase 8). The decision comes from the pure Exit Manager Pro
        engine (partial close / break-even / trail / structure-news-target close /
        target adjust); the chosen action is mapped onto the EXISTING instant-trade
        actions and routed through executeInstant (source "mission") → live
        pipeline → 18-gate dispatch. NONE → nothing is dispatched. User/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: draftId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionExitActionRequest" }
      responses:
        "200":
          description: The exit decision + whether an action was routed to the executor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionExitActionResult" }
        "404":
          description: Mission or mission trade not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "409":
          description: Mission trade is not executed, or has no linked open position
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "422":
          description: The exit action was rejected by the gated instant-trade path
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  primaryReason: { type: string, nullable: true }
                  decision: { $ref: "#/components/schemas/MissionExitDecision" }

  /profit-missions/{id}/proposals/{proposalId}/approve:
    post:
      operationId: approveMissionProposalDraft
      tags: [profit-missions]
      summary: >
        Approve a proposal's trade draft (Phase 5). Creates the draft if needed,
        flips it to `approved`, and writes a journal event. APPROVAL IS AN
        APPROVED RECORD ONLY — IT NEVER PLACES A LIVE/DEMO ORDER.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: proposalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeDraftDecisionRequest" }
      responses:
        "200":
          description: The approved trade draft (approved record only — no order placed)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeDraft" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "409":
          description: Draft not approvable (expired, blocked edge, or illegal transition)
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/proposals/{proposalId}/reject:
    post:
      operationId: rejectMissionProposalDraft
      tags: [profit-missions]
      summary: >
        Reject a proposal's trade draft (Phase 5). Creates the draft if needed,
        flips it to `rejected`, and writes a journal event. No order is involved.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: proposalId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TradeDraftDecisionRequest" }
      responses:
        "200":
          description: The rejected trade draft
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TradeDraft" }
        "404":
          description: Not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "409":
          description: Draft not actionable (illegal transition)
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/emergency-stop:
    post:
      operationId: emergencyStopProfitMission
      tags: [profit-missions]
      summary: >
        User-triggered emergency stop (Phase 6). Persists a stricter-only emergency
        risk read (journaled) and best-effort pauses the mission via the SAME state
        machine as a manual pause. Never touches any execution path.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionLifecycleActionRequest" }
      responses:
        "200":
          description: The mission after the emergency stop, with the latest risk read.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ProfitMission"
                  - type: object
                    properties:
                      risk:
                        allOf: [{ $ref: "#/components/schemas/ProfitMissionRiskState" }]
                        nullable: true
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/proposals/{proposalId}/execute:
    post:
      operationId: executeMissionProposalDraft
      tags: [profit-missions]
      summary: >
        Execute an APPROVED mission draft (Phase 6). Dispatches into REAL execution
        EXCLUSIVELY via the instant-trade router (source "mission") → live pipeline
        → 18-gate dispatch. The additive, stricter-only mission gate runs first;
        demo/paper missions never contact the live broker. Per-draft Level-2
        approval remains required.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: proposalId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The draft was dispatched into execution.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionDispatchResult" }
        "404":
          description: Mission or approved draft not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "409":
          description: >
            Draft not executable — not approved, expired, no direction, blocked by
            the mission risk gate, or a non-live mission (no live order placed).
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  executionMode: { type: string, nullable: true }
                  decision: { type: string, nullable: true }
                  blockReasons: { type: array, nullable: true, items: { type: string } }

  /profit-missions/{id}/testing/backtest:
    post:
      operationId: runMissionBacktest
      tags: [profit-missions]
      summary: >
        Run a deterministic historical/simulated BACKTEST for the mission's
        strategy via the shared backtest engine and persist an honestly-labelled
        result (Phase 9). Advisory only — a backtest can NEVER grant live
        permission or bypass any live gate. Focus-Lock + user/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionBacktestRequest" }
      responses:
        "201":
          description: The persisted backtest result (historical/simulated label)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionTestResult" }
        "400":
          description: Missing fields or unknown strategy
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  allowed: { type: array, nullable: true, items: { type: string } }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "409":
          description: Symbol is outside the ARX focus market
          content:
            application/json:
              schema: { type: object, properties: { error: { type: string } }, additionalProperties: true }

  /profit-missions/{id}/testing/forward:
    post:
      operationId: aggregateMissionForward
      tags: [profit-missions]
      summary: >
        Aggregate a FORWARD test result from the mission's OWN executed-and-closed
        trade drafts (real realised outcomes only) and persist an honestly-labelled
        result with a small-sample warning when sparse (Phase 9). Never fabricates a
        forward record. Advisory only. User/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionForwardRequest" }
      responses:
        "201":
          description: The persisted forward result (forward label)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionTestResult" }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/testing:
    get:
      operationId: listMissionTestResults
      tags: [profit-missions]
      summary: >
        List a mission's persisted test results (backtest + forward), newest first
        (Phase 9). Honestly labelled; advisory only. User/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: The mission's test results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: "#/components/schemas/MissionTestResult" }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/drift:
    get:
      operationId: getMissionDrift
      tags: [profit-missions]
      summary: >
        Evaluate strategy drift by comparing the latest backtest (historical) vs
        forward (real realised) metrics (Phase 9). Fail-safe: SEVERE drift demotes
        the mission, reduces risk, and pauses promotion. Insufficient evidence
        yields an honest UNKNOWN with no false drift. User/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The drift decision + whether the mission was demoted/paused
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionDriftResult" }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/promotion:
    get:
      operationId: getMissionPromotion
      tags: [profit-missions]
      summary: >
        Read the mission's promotion status — the per-gate checklist, guardrail
        ceiling, drift severity, and whether a target automation level is allowed
        (Phase 9). Fail-closed and advisory: this NEVER enables live auto or
        bypasses a live gate. User/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: targetLevel
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 6 }
      responses:
        "200":
          description: The promotion status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionPromotionStatus" }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/automation-level:
    patch:
      operationId: applyMissionAutomationLevel
      tags: [profit-missions]
      summary: >
        Apply an automation-level change (0–6) (Phase 9). Fail-closed: the level is
        written ONLY when the promotion gate approves it. Live-auto levels require
        explicit opt-in (`enableLiveAuto: true`) AND all promotion gates AND the
        platform live gates — defaulting stays Level 2. Audited + journaled.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionAutomationLevelRequest" }
      responses:
        "200":
          description: The applied automation level + promotion decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionAutomationLevelResult" }
        "400":
          description: Missing or invalid level
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "409":
          description: >
            Live auto requires explicit enablement and every promotion gate to pass.
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string }
                  decision: { $ref: "#/components/schemas/MissionPromotionDecision" }

  /profit-missions/{id}/certificate:
    get:
      operationId: getMissionCertificate
      tags: [profit-missions]
      summary: >
        Fetch the Mission Risk Certificate content for a mission (Phase 9): honest,
        banned-vocabulary-clean summary plus the REQUIRED confirmation phrase. Read
        only. User/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: targetAutomationLevel
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 6 }
      responses:
        "200":
          description: The certificate content
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MissionCertificateContent" }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
    post:
      operationId: acceptMissionCertificate
      tags: [profit-missions]
      summary: >
        Record an APPEND-ONLY Mission Risk Certificate acceptance (Phase 9).
        Fail-closed: the exact confirmation phrase + explicit confirmation are
        required; prior acceptances are never overwritten. User/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MissionCertificateAcceptRequest" }
      responses:
        "201":
          description: The acceptance was recorded
          content:
            application/json:
              schema:
                type: object
                required: [acceptedAt, acceptanceCount]
                properties:
                  acceptedAt: { type: string }
                  acceptanceCount: { type: integer }
        "400":
          description: Invalid acceptance (missing/incorrect phrase or confirmation)
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/briefing:
    get:
      operationId: getMissionBriefing
      tags: [profit-missions]
      summary: >
        Build the mission's daily briefing from honest mission state + closed-trade
        aggregates (Phase 9). Advisory, no guarantees. User/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The daily briefing
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/eod-review:
    get:
      operationId: getMissionEodReview
      tags: [profit-missions]
      summary: >
        Build the mission's end-of-day review from honest closed-trade aggregates
        (Phase 9). Advisory, no guarantees. User/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The end-of-day review
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /profit-missions/{id}/report:
    get:
      operationId: getMissionReport
      tags: [profit-missions]
      summary: >
        Build the post-mission report + learning-loop aggregation from honest closed
        trade records (Phase 9). Advisory, no guarantees. User/mission scoped.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The mission report + learning loop
          content:
            application/json:
              schema:
                type: object
                required: [report]
                properties:
                  report: { type: object, additionalProperties: true }
                  learning: { type: object, nullable: true, additionalProperties: true }
        "404":
          description: Mission not found
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /admin/profit-missions/{id}:
    get:
      operationId: getAdminMissionDetail
      tags: [profit-missions]
      summary: >
        Admin-only redacted mission detail (Phase 9): mission core fields, test
