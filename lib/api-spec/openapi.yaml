      summary: Recent persisted AACI decisions (ADMIN/OWNER only)
      description: >
        Lists the most recent persisted AACI decisions (append-only evidence
        rows) for operator review of the advisory execution gate and manual
        advisory paths. ADMIN/OWNER only. Advisory / observation only — never an
        execution gate.
      parameters:
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: actorType
          required: false
          schema: { type: string, enum: [user, ruby, self_trade_agent, admin, system] }
        - in: query
          name: symbol
          required: false
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: Recent AACI decisions
          content:
            application/json:
              schema:
                type: object
                required: [decisions]
                properties:
                  decisions:
                    type: array
                    items: { $ref: "#/components/schemas/AaciDecisionListItem" }
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/aaci/snapshot/{symbol}:
    get:
      operationId: getAdminAaciSnapshot
      tags: [adminAaci]
      summary: AACI Shared Truth Snapshot (ADMIN/OWNER only, diagnostic)
      description: >
        Returns the composed Shared Truth Snapshot for a symbol — the normalized
        cross-system state the cohesion engine reads from. ADMIN/OWNER only.
        Diagnostic and advisory only.
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: timeframe
          required: false
          schema: { type: string, enum: [M1, M5, M15, M30, H1, H4, D1], default: M15 }
      responses:
        "200":
          description: Shared Truth Snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AaciSnapshot" }
        "400":
          description: Invalid symbol
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/aaci/learning/summary:
    get:
      operationId: getAdminAaciLearningSummary
      tags: [adminAaci]
      summary: AACI learning health summary (ADMIN/OWNER only)
      description: >
        Roll-up of the adaptive learning layer: tracked trust entities,
        quarantined entities, entities currently flagged as drifted, and the
        number of recommend-only changes awaiting admin action. ADMIN/OWNER
        only. Advisory / observation only — never an execution gate.
      responses:
        "200":
          description: Learning health summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AaciLearningSummary" }
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/aaci/learning/trust:
    get:
      operationId: listAdminAaciTrustScores
      tags: [adminAaci]
      summary: AACI per-entity trust scores (ADMIN/OWNER only)
      description: >
        Lists per-entity Bayesian trust rows (alpha/beta, effective trust,
        evidence, quarantine + drift state). Optionally filtered by entity type
        or quarantine state. ADMIN/OWNER only. Advisory / observation only.
      parameters:
        - in: query
          name: entityType
          required: false
          schema: { type: string, enum: [module, agent, signal, strategy, symbol, session, timeframe] }
        - in: query
          name: quarantinedOnly
          required: false
          schema: { type: boolean }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Trust score rows
          content:
            application/json:
              schema:
                type: object
                required: [scores]
                properties:
                  scores:
                    type: array
                    items: { $ref: "#/components/schemas/AaciTrustScore" }
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/aaci/learning/changes:
    get:
      operationId: listAdminAaciLearningChanges
      tags: [adminAaci]
      summary: AACI learning change log (ADMIN/OWNER only)
      description: >
        Lists append-only learning-audit rows (trust updates, drift
        recommendations, quarantine, weight updates, approvals, rollbacks),
        newest first. Optionally filtered by status or entity type. ADMIN/OWNER
        only. Rows are evidence and are never deleted.
      parameters:
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [APPLIED, RECOMMENDED, APPROVED, REJECTED, ROLLED_BACK] }
        - in: query
          name: entityType
          required: false
          schema: { type: string, enum: [module, agent, signal, strategy, symbol, session, timeframe] }
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 500, default: 200 }
      responses:
        "200":
          description: Learning change rows
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items: { $ref: "#/components/schemas/AaciLearningChange" }
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/aaci/learning/changes/{id}/approve:
    post:
      operationId: approveAdminAaciLearningChange
      tags: [adminAaci]
      summary: Approve a recommend-only learning change (ADMIN/OWNER only)
      description: >
        Applies a RECOMMEND_ONLY learning change (e.g. a major weight change)
        and transitions it to APPROVED. CAS-guarded so two admins cannot both
        approve. A reason (≥3 chars) is required and audited. ADMIN/OWNER only.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AaciLearningActionRequest" }
      responses:
        "200":
          description: Change approved + applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AaciLearningActionResult" }
        "400":
          description: Invalid request (missing reason)
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: Change not found
        "409":
          description: Change is not in a recommend-only state

  /admin/aaci/learning/changes/{id}/reject:
    post:
      operationId: rejectAdminAaciLearningChange
      tags: [adminAaci]
      summary: Reject a recommend-only learning change (ADMIN/OWNER only)
      description: >
        Rejects a RECOMMEND_ONLY learning change without applying it and
        transitions it to REJECTED. CAS-guarded. A reason (≥3 chars) is required
        and audited. ADMIN/OWNER only.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AaciLearningActionRequest" }
      responses:
        "200":
          description: Change rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AaciLearningActionResult" }
        "400":
          description: Invalid request (missing reason)
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: Change not found
        "409":
          description: Change is not in a recommend-only state

  /admin/aaci/learning/changes/{id}/rollback:
    post:
      operationId: rollbackAdminAaciLearningChange
      tags: [adminAaci]
      summary: Roll back an applied learning change (ADMIN/OWNER only)
      description: >
        Reverts a previously APPLIED learning change, restoring the weight to its
        recorded prior value, and transitions it to ROLLED_BACK with a ROLLBACK
        audit row pointing at the reverted change. CAS-guarded. A reason (≥3
        chars) is required and audited. ADMIN/OWNER only.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AaciLearningActionRequest" }
      responses:
        "200":
          description: Change rolled back
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AaciLearningActionResult" }
        "400":
          description: Invalid request (missing reason)
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required
        "404":
          description: Change not found
        "409":
          description: Change is not in an applied state

  /admin/security/overview:
