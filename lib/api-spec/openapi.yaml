  /market-heat:
    get:
      operationId: getMarketHeat
      tags: [news]
      summary: Honest global market heat (countries, currencies, synthetics)
      description: >
        Returns honesty-aware heat verdicts for countries, currencies, and a
        separate synthetic-markets panel, plus the normalized provider status
        row. Missing news/economic-calendar providers produce an explicit
        "unavailable" verdict, never fake neutral/low-risk heat. Advisory only —
        never an execution gate.
      parameters:
        - in: query
          name: timeframe
          required: false
          schema: { type: string, enum: [M1, M5, M15, M30, H1, H4, D1], default: M15 }
        - in: query
          name: includeNews
          required: false
          schema: { type: boolean, default: true }
        - in: query
          name: includeCalendar
          required: false
          schema: { type: boolean, default: true }
        - in: query
          name: session
          required: false
          description: Restrict the heat universe to markets active in this trading session.
          schema: { type: string, enum: [sydney, tokyo, london, newyork] }
        - in: query
          name: symbols
          required: false
          description: Comma-separated ARX symbols to restrict the heat universe to.
          schema: { type: string }
        - in: query
          name: countries
          required: false
          description: Comma-separated country keys to restrict the returned country verdicts to.
          schema: { type: string }
      responses:
        "200":
          description: Global market heat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketHeatResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /market-heat/diagnostics:
    get:
      operationId: getMarketHeatDiagnostics
      tags: [news]
      summary: Per-provider heat diagnostics (redacted key presence only)
      description: >
        Reports per-provider configured/connected, last fetch, last error,
        record count, freshness, and coverage. API-key presence is reported as a
        boolean only — the key value is never returned.
      responses:
        "200":
          description: Heat diagnostics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketHeatDiagnostics" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

