components:
  parameters:
    BrokerHubConnectionId:
      name: connectionId
      in: path
      required: true
      description: Owned MT5 bridge connection identifier
      schema: { type: integer, minimum: 1 }
  schemas:
    BrokerHubFlags:
      type: object
      required: [metadataEnabled, tradingEnabled, automationEnabled, canPlaceLiveTrade]
      properties:
        metadataEnabled: { type: boolean, enum: [false] }
        tradingEnabled: { type: boolean, enum: [false] }
        automationEnabled: { type: boolean, enum: [false] }
        canPlaceLiveTrade: { type: boolean, enum: [false] }

    BrokerHubConnectionResponse:
      allOf:
        - $ref: "#/components/schemas/BrokerHubFlags"
        - type: object
          required: [venue, connectionId, status, connected, nativeStatus, observedAt, staleSeconds, reason]
          properties:
            venue: { type: string, enum: [MT5] }
            connectionId: { type: integer }
            status: { type: string }
            connected: { type: boolean }
            nativeStatus: { type: ["string", "null"] }
            observedAt: { type: ["string", "null"], format: date-time }
            staleSeconds: { type: ["integer", "null"] }
            reason: { type: string }

    BrokerHubAccountResponse:
      allOf:
        - $ref: "#/components/schemas/BrokerHubFlags"
        - type: object
          required: [venue, connectionId, accountRefMasked, brokerName, serverName, environment, currency, balance, equity, margin, freeMargin, leverage, observedAt, snapshotStatus]
          properties:
            venue: { type: string, enum: [MT5] }
            connectionId: { type: integer }
            accountRefMasked: { type: ["string", "null"] }
            brokerName: { type: ["string", "null"] }
            serverName: { type: ["string", "null"] }
            environment: { type: string, enum: [UNKNOWN, DEMO, LIVE] }
            currency: { type: ["string", "null"] }
            balance: { type: ["number", "null"] }
            equity: { type: ["number", "null"] }
            margin: { type: ["number", "null"] }
            freeMargin: { type: ["number", "null"] }
            leverage: { type: ["number", "null"] }
            observedAt: { type: ["string", "null"], format: date-time }
            snapshotStatus: { type: string, enum: [FRESH, STALE, MISSING] }

    BrokerHubInstrument:
      type: object
      required: [symbol, displayName, exactBrokerSymbol, brokerReportsTradeAllowed, discoveryStatus, digits, point, minVolume, maxVolume, volumeStep, evidence]
      properties:
        symbol: { type: string }
        displayName: { type: ["string", "null"] }
        exactBrokerSymbol: { type: string }
        brokerReportsTradeAllowed: { type: boolean }
        discoveryStatus: { type: string, enum: [FRESH, STALE] }
        digits: { type: ["integer", "null"] }
        point: { type: ["number", "null"] }
        minVolume: { type: ["number", "null"] }
        maxVolume: { type: ["number", "null"] }
        volumeStep: { type: ["number", "null"] }
        evidence:
          type: object
          required: [observedAt, exactBrokerSymbol, nativeConnectionRef]
          properties:
            observedAt: { type: string, format: date-time }
            exactBrokerSymbol: { type: string }
            nativeConnectionRef: { type: string }

    BrokerHubInstrumentsResponse:
      allOf:
        - $ref: "#/components/schemas/BrokerHubFlags"
        - type: object
          required: [venue, connectionId, discoveryStatus, instruments]
          properties:
            venue: { type: string, enum: [MT5] }
            connectionId: { type: integer }
            discoveryStatus: { type: string, enum: [AVAILABLE, DISCOVERY_REQUIRED] }
            instruments:
              type: array
              items: { $ref: "#/components/schemas/BrokerHubInstrument" }

    BrokerHubCapabilitiesResponse:
      allOf:
        - $ref: "#/components/schemas/BrokerHubFlags"
        - type: object
          required: [venue, connectionId, observedAt, capabilities]
          properties:
            venue: { type: string, enum: [MT5] }
            connectionId: { type: integer }
            observedAt: { type: ["string", "null"], format: date-time }
            capabilities:
              type: object
              required: [accountSnapshot, positionSnapshot, openOrderSnapshot, instrumentDiscovery, marketDataSnapshot]
              properties:
                accountSnapshot: { type: boolean }
                positionSnapshot: { type: boolean, enum: [false] }
                openOrderSnapshot: { type: boolean, enum: [false] }
                instrumentDiscovery: { type: boolean }
                marketDataSnapshot: { type: boolean }

    # ── Claude Backend Fix Agent (Task #705) — ADMIN-ONLY, ADVISORY / DIAGNOSTIC.
    FixAgentRequest:
      type: object
      required: [errorText]
      properties:
        area:
          type: string
          enum: [mt5_bridge, live_pipeline, market_data, api_routes, database, auth, frontend, other]
          description: "Backend area hint."
        errorText: { type: string, description: "The error/stack to diagnose (redacted server-side)." }
        contextText: { type: string, description: "Optional surrounding context (redacted server-side)." }
        logsText: { type: string, description: "Optional log excerpt (redacted server-side)." }
        model:
          type: string
          enum: [claude-sonnet-4-6, claude-opus-4-8]
          description: "Optional model override; falls back to the configured model."

    FixAgentUsage:
      type: object
      required: [inputTokens, outputTokens, latencyMs]
      properties:
        inputTokens: { type: integer, nullable: true }
        outputTokens: { type: integer, nullable: true }
        latencyMs: { type: integer }

    FixAgentDiagnosis:
      type: object
      required: [summary, severity, likelyCauses, affectedAreas, suggestedChecks, confidence, raw]
      properties:
        summary: { type: string }
        severity: { type: string, enum: [low, medium, high, critical, unknown] }
        likelyCauses: { type: array, items: { type: string } }
        affectedAreas: { type: array, items: { type: string } }
        suggestedChecks: { type: array, items: { type: string } }
        confidence: { type: string, enum: [low, medium, high, unknown] }
        raw: { type: boolean, description: "True when the model did not return parseable JSON." }

    FixAgentDiagnoseResponse:
      type: object
      required: [ok, runId, mode, provider, model, dryRun, result, usage]
      properties:
        ok: { type: boolean }
        runId: { type: integer }
        mode: { type: string, enum: [diagnose] }
        provider: { type: string }
        model: { type: string }
        dryRun: { type: boolean }
        result: { $ref: "#/components/schemas/FixAgentDiagnosis" }
        usage: { $ref: "#/components/schemas/FixAgentUsage" }

    FixAgentProposedChange:
      type: object
      required: [file, description, diff]
      properties:
        file: { type: string }
        description: { type: string }
        diff: { type: string, description: "Unified-diff suggestion for human review — never applied." }

    FixAgentPatchProposal:
      type: object
      required: [summary, rationale, proposedChanges, risks, testSuggestions, dryRun, applied, raw]
      properties:
        summary: { type: string }
        rationale: { type: string }
        proposedChanges: { type: array, items: { $ref: "#/components/schemas/FixAgentProposedChange" } }
        risks: { type: array, items: { type: string } }
        testSuggestions: { type: array, items: { type: string } }
        dryRun: { type: boolean, description: "Always true in this build." }
        applied: { type: boolean, description: "Always false in this build — no APPLY path exists." }
        raw: { type: boolean }

    FixAgentProposePatchResponse:
      type: object
      required: [ok, runId, mode, provider, model, dryRun, result, usage]
      properties:
        ok: { type: boolean }
        runId: { type: integer }
        mode: { type: string, enum: [propose_patch] }
        provider: { type: string }
        model: { type: string }
        dryRun: { type: boolean }
        result: { $ref: "#/components/schemas/FixAgentPatchProposal" }
        usage: { $ref: "#/components/schemas/FixAgentUsage" }

    FixAgentHealthResponse:
      type: object
      required: [ok, enabled, dryRun, provider, model, providerConfigured]
      properties:
        ok: { type: boolean }
        enabled: { type: boolean }
        dryRun: { type: boolean }
        provider: { type: string }
        model: { type: string }
        providerConfigured: { type: boolean }

    FixAgentRunSummary:
      type: object
      required: [id, adminId, adminRole, mode, provider, model, dryRun, applied, status, createdAt]
      properties:
        id: { type: integer }
        adminId: { type: integer, nullable: true }
        adminRole: { type: string }
        mode: { type: string }
        area: { type: string, nullable: true }
        provider: { type: string }
        model: { type: string }
        dryRun: { type: boolean }
        applied: { type: boolean }
        status: { type: string }
        errorReason: { type: string, nullable: true }
        inputTokens: { type: integer, nullable: true }
        outputTokens: { type: integer, nullable: true }
        latencyMs: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }

    FixAgentRunsResponse:
      type: object
      required: [ok, count, runs]
      properties:
        ok: { type: boolean }
        count: { type: integer }
        runs: { type: array, items: { $ref: "#/components/schemas/FixAgentRunSummary" } }

    FixAgentRecentError:
      type: object
      required: [id, recordedAt, status, totalMs, errorText, area]
      properties:
        id: { type: integer, description: "Monotonic ring-buffer id for stable keying." }
        recordedAt: { type: integer, description: "When the request was recorded (ms since epoch)." }
        method: { type: string, nullable: true }
        action: { type: string, nullable: true, description: "Route/action label, e.g. \"GET /api/me/account-mode\"." }
        status: { type: integer, description: "HTTP status (>= 400)." }
        totalMs: { type: integer }
        area:
          type: string
          enum: [mt5_bridge, live_pipeline, market_data, api_routes, database, auth, frontend, other]
          description: "Best-effort backend-area hint inferred from the route."
        errorText: { type: string, description: "Pre-built summary to load into the diagnose form." }

    FixAgentRecentErrorsResponse:
      type: object
      required: [ok, count, errors]
      properties:
        ok: { type: boolean }
        count: { type: integer }
        errors: { type: array, items: { $ref: "#/components/schemas/FixAgentRecentError" } }

    # ── Profit Mission (Task #660) — Phase 1 planner / feasibility / probability
    # PLANNING + DISPLAY ONLY. Every assessment field is an advisory ESTIMATE and
    # nothing here is read by any execution gate.

    ParseMissionIntentRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "Natural-language mission description to parse." }

    ParseMissionIntentResponse:
      type: object
      description: >
        Parsed mission amounts and timeframe. Advisory / planning only — no
        persistence, no execution gate. startingAmount is null when the
        description mentions only a target amount (e.g. "scalp to $X in 20 min")
        — the UI should preserve the current form value in that case.
      required: [startingAmount, targetAmount, timeframeAmount, timeframeUnit, timeframeMinutes, timeframeLabel, source]
      properties:
        startingAmount:
          type: number
          nullable: true
          description: "Null when only a target amount was specified."
        targetAmount: { type: number }
        timeframeAmount: { type: number }
        timeframeUnit: { type: string, enum: [minutes, hours, days, weeks] }
        timeframeMinutes: { type: number }
        timeframeLabel: { type: string }
        riskProfile:
          type: string
          nullable: true
          enum: [conservative, balanced, aggressive, extreme]
          description: "Risk profile extracted from text, or null if not mentioned."
        source: { type: string, description: "The raw sentence that was successfully parsed." }

    ProfitMissionScenarioProjection:
      type: object
      description: One labelled scenario estimate (best / expected / worst).
      required: [endingValue, profit, returnPct]
      properties:
        endingValue: { type: number, description: "Estimated final account value." }
        profit: { type: number, description: "Estimated profit/loss vs starting amount." }
        returnPct: { type: number }

    ProfitMissionMath:
      type: object
      description: >
        Deterministic required-return / pace math for a mission. Pure derivation
        from the goal inputs — no fabricated or simulator data.
      required:
        [startingAmount, targetAmount, currentValue, requiredProfit,
         requiredReturnPct, remainingProfit, totalDays, tradingDays, elapsedDays,
         remainingDays, requiredDailyProfit, requiredSessionProfit,
         requiredHourlyProfit, requiredDailyReturnPct, progressPct,
         progressPctClamped, timeElapsedPct, currentDailyProfit, paceRatio,
         onTrack, timeframeMinutes, requiredReturnPerHourPct,
         requiredDailyEquivalentReturnPct, invalid, invalidReasons]
      properties:
        startingAmount: { type: number }
        targetAmount: { type: number }
        currentValue: { type: number }
        requiredProfit: { type: number }
        requiredReturnPct: { type: number }
        remainingProfit: { type: number }
        totalDays: { type: number }
        tradingDays: { type: integer }
        elapsedDays: { type: number }
        remainingDays: { type: number }
        requiredDailyProfit: { type: number }
        requiredSessionProfit: { type: number }
        requiredHourlyProfit: { type: number }
        requiredDailyReturnPct: { type: number }
        progressPct: { type: number }
        progressPctClamped: { type: number }
        timeElapsedPct: { type: number }
        currentDailyProfit: { type: number }
        paceRatio: { type: number }
        onTrack: { type: boolean }
        timeframeMinutes: { type: number, description: "Total timeframe in minutes." }
        requiredReturnPerHourPct: { type: number, description: "Required total return per hour (linear)." }
        requiredDailyEquivalentReturnPct: { type: number, description: "Required daily-equivalent return % (per-hour × 24)." }
        invalid: { type: boolean }
        invalidReasons: { type: array, items: { type: string } }

    ProfitMissionFeasibility:
      type: object
      description: >
        Advisory feasibility verdict. `isEstimate` is always true; the verdict can
        only lower a tier / add warnings / block START — never relax a gate.
      required:
        [tier, feasibilityScore, riskScore, recommendedRiskProfile, missionType,
         warnings, explanation, requiredReturnPct, requiredDailyReturnPct,
         riskProfileMismatch, canStart, startBlockReason, isEstimate,
         unitAwareMissionClass]
      properties:
        tier:
          type: string
          enum: [Easy, Realistic, Challenging, Aggressive, Extreme, Unreasonable]
        feasibilityScore: { type: number, description: "0–100; higher = more feasible." }
        riskScore: { type: number, description: "0–100; higher = more risk." }
        recommendedRiskProfile:
          type: string
          enum: [conservative, balanced, aggressive, extreme]
        missionType:
          type: string
          enum: [steady_growth, standard_growth, accelerated_growth, high_risk_sprint, extreme_sprint, unrealistic]
        warnings: { type: array, items: { type: string } }
        explanation: { type: string }
        requiredReturnPct: { type: number, description: "Total return % the target needs." }
        requiredDailyReturnPct: { type: number, description: "Compound daily return % the target needs." }
        riskProfileMismatch: { $ref: "#/components/schemas/ProfitMissionRiskProfileMismatch" }
        canStart: { type: boolean, description: "Feed-gated; START blocked while false (draft still allowed)." }
        startBlockReason: { type: string, nullable: true }
        isEstimate: { type: boolean, enum: [true] }
        unitAwareMissionClass:
          type: string
          enum: [Scalp, "Extreme scalp", "Unrealistic scalp", Intraday, "High-risk intraday", "Unrealistic intraday", Swing, Multi-day]
          description: "Unit-aware classification layered on top of feasibility tier."

    ProfitMissionRiskProfileMismatch:
      type: object
      description: >
        Display-only comparison of the user's selected risk profile vs the profile
        the required pace demands. Explains why a target is harder than the chosen
        profile assumes; never relaxes or triggers a gate.
      required: [selected, required, mismatch, explanation]
      properties:
        selected: { type: string, enum: [conservative, balanced, aggressive, extreme] }
        required: { type: string, enum: [conservative, balanced, aggressive, extreme] }
        mismatch: { type: boolean, description: "True when selected is below the required profile." }
        explanation: { type: string, nullable: true }

    ProfitMissionProbability:
      type: object
      description: >
        Advisory probability / risk read. Every value is a labelled ESTIMATE;
        `sampleSize` is 0 in Phase 1 so a sample-size warning is always present and
        `planningProjectionOnly` is true (forward math, not backtested).
      required:
        [targetHitProbability, drawdownRisk, failureProbability, projections,
         confidence, sampleSize, sampleSizeWarnings, planningProjectionOnly,
         planningProjectionNote, isEstimate, disclaimer]
      properties:
        targetHitProbability: { type: number, description: "0–100 estimate." }
        drawdownRisk: { type: number, description: "0–100 estimate." }
        failureProbability: { type: number, description: "0–100 estimate." }
        projections:
          type: object
          required: [best, expected, worst]
          properties:
            best: { $ref: "#/components/schemas/ProfitMissionScenarioProjection" }
            expected: { $ref: "#/components/schemas/ProfitMissionScenarioProjection" }
            worst: { $ref: "#/components/schemas/ProfitMissionScenarioProjection" }
        confidence: { type: string, enum: [low, medium, high] }
        sampleSize: { type: integer }
        sampleSizeWarnings: { type: array, items: { type: string } }
        planningProjectionOnly: { type: boolean, description: "True when sampleSize is 0 (forward math, not backtested)." }
        planningProjectionNote: { type: string, description: "Honest projection-only note; empty string otherwise." }
        isEstimate: { type: boolean, enum: [true] }
        disclaimer: { type: string }

    ProfitMission:
      type: object
      description: >
        A persisted mission plan plus its server-computed reads. PLANNING +
        DISPLAY ONLY — no execution surface in Phase 1.
      required:
        [id, userId, startingAmount, targetAmount, requiredProfit, currentValue,
         timeframeStart, timeframeEnd, riskProfile, executionMode,
         automationLevel, status, currentMode, math, feasibility, probability,
         createdAt, updatedAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        startingAmount: { type: number }
        targetAmount: { type: number }
        requiredProfit: { type: number }
        currentValue: { type: number }
        timeframeStart: { type: string, description: "ISO 8601." }
        timeframeEnd: { type: string, description: "ISO 8601." }
        timeframeAmount: { type: number, nullable: true, description: "Numeric amount (e.g. 30 for '30 minutes')." }
        timeframeUnit: { type: string, nullable: true, enum: [minutes, hours, days, weeks], description: "Unit of the timeframe amount." }
        timeframeMinutes: { type: number, nullable: true, description: "Total timeframe in minutes (timeframeAmount × unit factor)." }
        timeframeLabel: { type: string, nullable: true, description: "Human-readable label, e.g. '30 minutes', '1 day'." }
        riskProfile: { type: string, enum: [conservative, balanced, aggressive, extreme] }
        executionMode: { type: string, enum: [paper, demo, live] }
        automationLevel: { type: integer, description: "2 = approval mode (no autonomous execution)." }
        status:
          type: string
          enum:
            [draft, pending_approval, running, paused, protect_mode, target_hit,
             stopped_by_risk, failed, expired, completed, cancelled]
        currentMode: { type: string, enum: [planning, running, review] }
        settings: { type: object, nullable: true, additionalProperties: true }
        math: { $ref: "#/components/schemas/ProfitMissionMath" }
        feasibility: { $ref: "#/components/schemas/ProfitMissionFeasibility" }
        probability: { $ref: "#/components/schemas/ProfitMissionProbability" }
        createdAt: { type: string, description: "ISO 8601." }
        updatedAt: { type: string, description: "ISO 8601." }
        completedAt: { type: string, nullable: true, description: "ISO 8601." }

    ProfitMissionPulse:
      type: object
      description: >
        Live recompute of a mission's pace / feasibility / probability against the
        current account value. Display-only.
      required: [id, currentValue, math, feasibility, probability, asOf]
      properties:
        id: { type: integer }
        currentValue: { type: number }
        math: { $ref: "#/components/schemas/ProfitMissionMath" }
        feasibility: { $ref: "#/components/schemas/ProfitMissionFeasibility" }
        probability: { $ref: "#/components/schemas/ProfitMissionProbability" }
        risk:
          allOf: [{ $ref: "#/components/schemas/ProfitMissionRiskState" }]
          nullable: true
          description: >
            Phase 6 additive, stricter-only risk read (drawdown / blow-up / daily
            budget / protective mode). Display-only; can never relax a gate.
        executionHealth:
          allOf: [{ $ref: "#/components/schemas/MissionExecutionHealth" }]
          nullable: true
          description: >
            Phase 7 advisory broker/feed execution-health verdict (symbol-independent).
            Analyze/watch is always allowed; execution-block only. Honest unknown
            never reads "good". Display-only; can never relax a gate.
        exposure:
          allOf: [{ $ref: "#/components/schemas/MissionExposureAggregates" }]
          nullable: true
          description: >
            Phase 7 aggregate of this user's OPEN live exposure (per-user isolation).
            Display-only.
        protection:
          allOf: [{ $ref: "#/components/schemas/MissionProtectionSnapshot" }]
          nullable: true
          description: >
            Phase 8 protection surface — milestones / locked profit / protection
            ladder / giveback guard + controlled-compounding state. Recomputed +
            persisted (merged into progressJson) on every pulse. Display-only; a
            target stop+lock flips the mission to completed but never relaxes a gate.
        asOf: { type: string, description: "ISO 8601 server time of this recompute." }

    MissionProtectionSnapshot:
      type: object
      description: >
        Phase 8 mission protection + compounding snapshot. Display-only; composed
        from realised CLOSED profit only (never floating). Compounding never boosts
        during drawdown or after a single win; the protection ladder can only
        tighten risk after milestones / giveback.
      required: [milestone, compounding, missionCompleted]
      properties:
        milestone: { $ref: "#/components/schemas/MissionMilestoneState" }
        compounding: { $ref: "#/components/schemas/MissionCompoundingState" }
        missionCompleted:
          type: boolean
          description: True when a target stop+lock flipped the mission to `completed`.

    MissionMilestoneState:
      type: object
      description: >
        Phase 8 milestone / protection-ladder / giveback / daily-goal read. Derived
        from realised CLOSED profit vs the mission's required profit. STRICTER-ONLY:
        every field can only tighten risk; nothing here places a trade.
      required:
        [milestone, lockedProfit, minSetupTier, riskMultiplier, suggestedMode,
         stopAndLock, givebackTriggered, dailyGoalReached, reasons, warnings,
         peakRealisedProfit, realisedProfit]
      properties:
        milestone:
          type: integer
          description: "Highest milestone reached: 0 / 25 / 50 / 75 / 100 (% of required profit)."
        lockedProfit: { type: number, description: "Realised profit now considered locked / secured." }
        minSetupTier: { type: string, description: "Minimum setup tier the mission may now take (rises with milestones)." }
        riskMultiplier: { type: number, description: "Risk multiplier on top of profile risk (≤ 1; stricter-only)." }
        suggestedMode: { type: string, description: "Suggested mission mode escalation (never looser than the caller's mode)." }
        stopAndLock: { type: boolean, description: "True when the mission should stop and lock profit (default at 100%)." }
        givebackTriggered: { type: boolean, description: "True when the giveback guard fired (profit handed back from peak)." }
        dailyGoalReached: { type: boolean, description: "True when today's profit goal was reached (lock/protect for the day)." }
        reasons: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        peakRealisedProfit: { type: number, description: "Peak realised profit carried forward + updated this evaluation." }
        realisedProfit: { type: number, description: "Sum of realised P/L across CLOSED mission trades (account currency)." }

    MissionCompoundingState:
      type: object
      description: >
        Phase 8 controlled-compounding state. REALISED CLOSED PROFIT ONLY — never
        floating, never during drawdown, never after a single win. The multiplier
        defaults to exactly 1 (no boost) whenever any safety gate fails.
      required:
        [active, multiplier, reinvestibleProfit, reasons, blockers, mode,
         realisedProfit, realisedTradeCount, drawdownPct, governorMode]
      properties:
        active: { type: boolean, description: "True only when every compounding gate passes." }
        multiplier: { type: number, description: "Risk multiplier on top of profile risk (≥ 1; exactly 1 when off)." }
        reinvestibleProfit: { type: number, description: "Realised profit eligible to be reinvested (never floating)." }
        reasons: { type: array, items: { type: string } }
        blockers: { type: array, items: { type: string } }
        mode: { type: string, description: "Configured compounding mode (off / conservative / balanced / aggressive)." }
        realisedProfit: { type: number }
        realisedTradeCount: { type: integer, description: "Count of CLOSED realised mission trades." }
        drawdownPct:
          type: number
          nullable: true
          description: "Current mission drawdown %, from the persisted risk read (null when unknown)."
        governorMode: { type: string, description: "Risk Governor mode (unknown fails closed to protect)." }

    MissionExitActionRequest:
      type: object
      description: >
        Phase 8 optional honest signals a caller can observe for the exit decision.
        All fields are optional; omitted values default to the SAFE "no anomaly"
        value. Nothing here can force a trade — only justify a protective exit.
      properties:
        signals:
          type: object
          properties:
            invalidation: { type: boolean }
            agentDisagreement: { type: boolean }
            orderFlowReversal: { type: boolean }
            highImpactNewsImminent: { type: boolean }
            unstableSpread: { type: boolean }
            structureBreak: { type: boolean }
            atr: { type: number, nullable: true, description: "ATR in price terms (sizes the trail)." }
            brokerSupportsPartialClose: { type: boolean }

    MissionExitDecision:
      type: object
      description: >
        Phase 8 pure Exit Manager Pro decision for an open mission trade. Advisory /
        protective only — it maps onto the EXISTING instant-trade actions. No
        guaranteed-profit vocabulary; every reason is an estimate / observation.
      required: [action, closeFraction, newPrice, trigger, justifiedEarlyExit, reasons, warnings]
      properties:
        action:
          type: string
          enum: [NONE, MOVE_BREAKEVEN, TRAIL, PARTIAL_CLOSE, CLOSE, ADJUST_TARGET]
        closeFraction:
          type: number
          nullable: true
          description: "For PARTIAL_CLOSE: fraction (0..1) of the remaining position to close."
        newPrice:
          type: number
          nullable: true
          description: "For TRAIL / MOVE_BREAKEVEN / ADJUST_TARGET: the new price level."
        trigger:
          type: string
          nullable: true
          description: "Which protective trigger produced the decision (null for NONE)."
        justifiedEarlyExit:
          type: boolean
          description: "True when an early exit is risk-justified (must NOT be punished in capture analysis)."
        reasons: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }

    MissionPartialPlanStep:
      type: object
      required: [order, kind, triggerPrice, closeFraction, newStop, label]
      properties:
        order: { type: integer }
        kind: { type: string, description: "TP1 / TP2 / RUNNER / MOVE_BREAKEVEN / TRAIL / CLOSE step kind." }
        triggerPrice: { type: number, nullable: true, description: "Trigger price (where the step becomes due)." }
        closeFraction: { type: number, nullable: true, description: "For PARTIAL_CLOSE: fraction (0..1) of remaining to close." }
        newStop: { type: number, nullable: true, description: "For MOVE_BREAKEVEN / TRAIL: the new stop level." }
        label: { type: string }

    MissionPartialPlan:
      type: object
      description: >
        Phase 8 partial-profit plan. Honest degradation: when the broker/symbol can
        not support partials, the plan degrades to a supported full-close-at-target
        rather than pretending a partial happened.
      required: [steps, degraded, warnings, reason]
      properties:
        steps:
          type: array
          items: { $ref: "#/components/schemas/MissionPartialPlanStep" }
        degraded:
          type: boolean
          description: "True when partials were requested but the broker can't support them."
        warnings: { type: array, items: { type: string } }
        reason: { type: string }

    MissionExitOpenPosition:
      type: object
      description: Phase 8 snapshot of the OPEN live position linked to a mission trade (per-user).
      required: [brokerTicket, symbol, side, volume, entryPrice, currentPrice, stopLoss, takeProfit, floatingPl]
      properties:
        brokerTicket: { type: string }
        symbol: { type: string }
        side: { type: string, enum: [BUY, SELL] }
        volume: { type: number }
        entryPrice: { type: number }
        currentPrice: { type: number, nullable: true }
        stopLoss: { type: number, nullable: true }
        takeProfit: { type: number, nullable: true }
        floatingPl: { type: number, nullable: true }

    MissionExitActionResult:
      type: object
      description: >
        Phase 8 result of managing an open mission trade's protective exit. When an
        action is dispatched it routed through the EXISTING gated instant-trade path
        (source "mission"); NONE → dispatched=false and nothing was placed.
      required: [ok, decision, partialPlan, dispatched, position]
      properties:
        ok: { type: boolean }
        decision: { $ref: "#/components/schemas/MissionExitDecision" }
        partialPlan: { $ref: "#/components/schemas/MissionPartialPlan" }
        dispatched:
          type: boolean
          description: "True when an exit action was routed to the gated executor."
        commandId:
          type: string
          nullable: true
          description: "Live command id of the dispatched action (null when nothing was dispatched)."
        position: { $ref: "#/components/schemas/MissionExitOpenPosition" }

    MissionExecutionHealth:
      type: object
      description: >
        Phase 7 broker/feed execution-health verdict. BLOCK-EXECUTION-ONLY: a false
        executionAllowed blocks dispatch but analyze/watch stays allowed. Honest
        unknown inputs fail closed (block); they never read as "good"/"normal".
      required: [executionAllowed, analyzeAllowed, blockers, warnings, reason]
      properties:
        executionAllowed: { type: boolean }
        analyzeAllowed: { type: boolean, description: "Always true — analysis is never gated." }
        blockers: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        reason: { type: string }

    MissionExposureAggregates:
      type: object
      description: >
        Phase 7 aggregate of OPEN live exposure for a single user (per-user
        isolation). Display-only.
      required: [openCount, totalOpenRisk, riskByAssetClass, countByAssetClass]
      properties:
        openCount: { type: integer }
        totalOpenRisk: { type: number }
        riskByAssetClass:
          type: object
          additionalProperties: { type: number }
        countByAssetClass:
          type: object
          additionalProperties: { type: integer }

    MissionExecutionQuality:
      type: object
      description: >
        Phase 7 advisory execution-quality + net-profit + exposure annotation for a
        scan proposal. BLOCK/DOWNGRADE-ONLY — never raises a setup or relaxes a gate.
        Honest unknowns never read as "good". The exposure leg is present on the
        Judge-selected proposal only.
      required: [executionQuality, netProfit]
      properties:
        executionQuality:
          type: object
          additionalProperties: true
          description: ExecutionQualityVerdict (spread/slippage/liquidity/quote-freshness; allowed + blockers + warnings).
        netProfit:
          type: object
          additionalProperties: true
          description: NetProfitVerdict (estimated total cost vs target; allowed + blockers + warnings; unknown target fails closed).
        exposure:
          type: object
          nullable: true
          additionalProperties: true
          description: ExposureVerdict on the selected proposal only (open + proposed; duplicate / correlated / overexposure blockers).

    ProfitMissionRiskBudget:
      type: object
      description: >
        Per-mission risk budget. ADDITIVE + STRICTER-ONLY over the per-user Risk
        Governor. martingaleAllowed defaults false and is never silently enabled.
      required:
        [maxTradesPerDay, maxScalpsPerSession, maxLossPerTradePct, maxLossPerDayPct,
         maxLossPerSessionPct, maxMissionDrawdownPct, maxSameSymbolExposure,
         maxCorrelatedExposure, maxConsecutiveLosses, cooldownAfterLossMinutes,
         cooldownAfterStreakMinutes, martingaleAllowed]
      properties:
        maxTradesPerDay: { type: integer }
        maxScalpsPerSession: { type: integer }
        maxLossPerTradePct: { type: number }
        maxLossPerDayPct: { type: number }
        maxLossPerSessionPct: { type: number }
        maxMissionDrawdownPct: { type: number }
        maxSameSymbolExposure: { type: integer }
        maxCorrelatedExposure: { type: integer }
        maxConsecutiveLosses: { type: integer }
        cooldownAfterLossMinutes: { type: number }
        cooldownAfterStreakMinutes: { type: number }
        martingaleAllowed: { type: boolean }

    ProfitMissionRiskState:
      type: object
      description: >
        Phase 6 mission risk read. Composes the per-user Risk Governor history with
        the pure mission-risk + blow-up engines. STRICTER-ONLY: every field can only
        escalate protection; nothing here places a trade or relaxes a gate.
      required:
        [asOf, mode, ladderAction, pace, drawdownPct, peakValue, missionLossPct,
         dailyLossPct, budgetUsedPct, riskMultiplier, consecutiveLosses, tradesToday,
         budget, blowup, behavioral, emergency, reasons]
      properties:
        asOf: { type: string, description: "ISO 8601." }
        mode: { type: string, enum: [attack, normal, protect, recovery, cooldown, stop] }
        ladderAction: { type: string, enum: [none, reduce_risk, a_only, cooldown, stop] }
        pace: { type: string, enum: [ahead, on_track, behind] }
        drawdownPct: { type: number }
        peakValue: { type: number }
        missionLossPct: { type: number }
        dailyLossPct: { type: number }
        budgetUsedPct: { type: number }
        riskMultiplier: { type: number }
        consecutiveLosses: { type: integer }
        tradesToday: { type: integer }
        budget: { $ref: "#/components/schemas/ProfitMissionRiskBudget" }
        blowup:
          type: object
          required: [level, action, score, factors]
          properties:
            level: { type: string, enum: [low, medium, high, critical] }
            action:
              type: string
              enum: [continue, reduce_risk, pause, approval_required, stop_mission]
            score: { type: number }
            factors: { type: array, items: { type: string } }
        behavioral:
          type: object
          required: [overtrading, revenge, cooldownTriggered, scoreDock]
          properties:
            overtrading: { type: boolean }
            revenge: { type: boolean }
            cooldownTriggered: { type: boolean }
            scoreDock: { type: number }
        emergency:
          type: object
          required: [triggered, action, conditions]
          properties:
            triggered: { type: boolean }
            action: { type: string, enum: [none, pause, stop] }
            primary: { type: string, nullable: true }
            conditions: { type: array, items: { type: string } }
        reasons: { type: array, items: { type: string } }

    MissionDispatchResult:
      type: object
      description: >
        Result of dispatching an APPROVED mission draft into REAL execution via the
        instant-trade router (source "mission"). ok:true only when the order was
        sent to the live pipeline; the draft is then flipped to `executed`.
      required: [ok, commandId, draft]
      properties:
        ok: { type: boolean }
        commandId: { type: string, nullable: true }
        draft: { $ref: "#/components/schemas/TradeDraft" }

    MissionBacktestRequest:
      type: object
      description: >
        Phase 9 backtest request. Runs a deterministic historical/simulated
        backtest for the named strategy; advisory only — never a live grant.
      required: [strategyId, symbol, timeframe]
      properties:
        strategyId: { type: string }
        symbol: { type: string }
        timeframe: { type: string }
        candleCount: { type: integer, nullable: true, minimum: 50, maximum: 5000 }
        minConfidence: { type: integer, nullable: true, minimum: 0, maximum: 100 }

    MissionForwardRequest:
      type: object
      description: >
        Phase 9 forward-test request. Aggregates the mission's OWN closed trade
        drafts (real outcomes); all fields optional (derived from the drafts).
      properties:
        strategyKey: { type: string, nullable: true }
        symbol: { type: string, nullable: true }
        timeframe: { type: string, nullable: true }

    MissionTestMetrics:
      type: object
      required:
        [totalTrades, winningTrades, losingTrades, winRate, netProfitLoss, maxDrawdownPct, averageRr, expectancyR, profitFactor]
      properties:
        totalTrades: { type: integer }
        winningTrades: { type: integer }
        losingTrades: { type: integer }
        winRate: { type: number }
        netProfitLoss: { type: number }
        maxDrawdownPct: { type: number }
        averageRr: { type: number }
        expectancyR: { type: number }
        profitFactor: { type: number }

    MissionTestResult:
      type: object
      description: >
        An honestly-labelled, append-only mission test result. `kind` distinguishes
        BACKTEST (historical/simulated) from FORWARD (real realised). `sampleWarning`
        is set when the sample is too small to be meaningful. Advisory only.
      required:
        [id, missionId, kind, strategyKey, symbol, timeframe, label, sampleSize, isVerified, metrics, headline, notes, promotionEligible, createdAt]
      properties:
        id: { type: integer }
        missionId: { type: integer }
        kind: { type: string, enum: [BACKTEST, FORWARD] }
        strategyKey: { type: string }
        symbol: { type: string }
        timeframe: { type: string }
        label: { type: string }
        sampleSize: { type: integer }
        sampleWarning: { type: string, nullable: true }
        isVerified: { type: boolean }
        metrics: { $ref: "#/components/schemas/MissionTestMetrics" }
        headline: { type: string }
        notes: { type: array, items: { type: string } }
        promotionEligible: { type: boolean }
        createdAt: { type: string }

    MissionDriftResult:
      type: object
      description: >
        Strategy-drift evaluation. SEVERE drift is fail-safe: the mission is
        demoted, risk reduced, and promotion paused. `insufficientEvidence` is true
        when there is not enough data on both sides for an honest comparison.
      required: [drift, demoted, promotionPaused, insufficientEvidence]
      properties:
        drift: { type: object, additionalProperties: true }
        demoted: { type: boolean }
        promotionPaused: { type: boolean }
        insufficientEvidence: { type: boolean }

    MissionPromotionDecision:
      type: object
      description: Per-gate promotion checklist + the allowed maximum level.
      additionalProperties: true

    MissionPromotionStatus:
      type: object
      description: >
        The mission's promotion status — current level, certificate/live-auto state,
        the per-gate decision, the guardrail ceiling, and drift severity. Fail-closed
        and advisory: reading this NEVER enables live auto or bypasses a live gate.
      required: [currentLevel, liveAutoEnabled, certificateAccepted, decision, guardrail, driftSeverity]
      properties:
        currentLevel: { type: integer }
        liveAutoEnabled: { type: boolean }
        certificateAccepted: { type: boolean }
        decision: { $ref: "#/components/schemas/MissionPromotionDecision" }
        guardrail: { type: object, additionalProperties: true }
        driftSeverity: { type: string }

    MissionAutomationLevelRequest:
      type: object
      description: >
        Apply an automation level (0–6). Live-auto levels require explicit
        `enableLiveAuto: true` in addition to every promotion + live gate.
      required: [level]
      properties:
        level: { type: integer, minimum: 0, maximum: 6 }
        enableLiveAuto: { type: boolean, nullable: true }

    MissionAutomationLevelResult:
      type: object
      required: [applied, level, liveAutoEnabled, decision]
      properties:
        applied: { type: boolean }
        level: { type: integer }
        liveAutoEnabled: { type: boolean }
        decision: { $ref: "#/components/schemas/MissionPromotionDecision" }

    MissionCertificateContent:
      type: object
      description: >
        Honest, banned-vocabulary-clean certificate content plus the REQUIRED
        confirmation phrase the user must type to accept.
      additionalProperties: true

    MissionCertificateAcceptRequest:
      type: object
      description: >
        Append-only certificate acceptance. The exact `phrase` + explicit `confirmed`
        flag are required; prior acceptances are never overwritten.
      required: [confirmed, phrase]
      properties:
        confirmed: { type: boolean }
        phrase: { type: string }
        targetAutomationLevel: { type: integer, nullable: true, minimum: 0, maximum: 6 }

    CreateProfitMissionRequest:
      type: object
      description: >
        A user's stated goal. The server computes all assessment reads. Supply
        either timeframeEnd (legacy) OR timeframeAmount + timeframeUnit (preferred,
        minutes-first model). When amount+unit are present timeframeEnd is derived
        from timeframeStart + minutes; both paths are accepted.
      required: [startingAmount, targetAmount]
      properties:
        startingAmount: { type: number, description: "Account currency; must be > 0." }
        targetAmount: { type: number, description: "Must be > startingAmount." }
        timeframeStart: { type: string, nullable: true, description: "ISO 8601; defaults to now." }
        timeframeEnd: { type: string, nullable: true, description: "ISO 8601; must be after start. Optional when timeframeAmount+unit provided." }
        timeframeAmount: { type: number, nullable: true, description: "Numeric amount (e.g. 30). Required when timeframeUnit is set." }
        timeframeUnit:
          type: string
          nullable: true
          enum: [minutes, hours, days, weeks]
          description: "Unit of timeframeAmount. Required when timeframeAmount is set."
        riskProfile:
          type: string
          nullable: true
          enum: [conservative, balanced, aggressive, extreme]
        currentValue: { type: number, nullable: true, description: "Defaults to startingAmount." }
        settings: { type: object, nullable: true, additionalProperties: true }

    MissionLifecycleActionRequest:
      type: object
      description: >
        Optional context for a user lifecycle action (pause / resume / cancel).
        Display-only — never touches any execution path.
      properties:
        reason: { type: string, nullable: true, description: "Optional user-supplied note for the journal." }

    MissionSettingsUpdateRequest:
      type: object
      description: Replace a mission's free-form settings (records an override event).
      required: [settings]
      properties:
        settings: { type: object, additionalProperties: true }
        reason: { type: string, nullable: true, description: "Optional note for the journal." }

    MissionEvent:
      type: object
      description: One append-only mission journal entry. Observation-only; carries no secrets.
      required: [id, missionId, type, message, metadata, createdAt]
      properties:
        id: { type: integer }
        missionId: { type: integer }
        type:
          type: string
          enum:
            [mission_created, status_changed, paused, resumed, cancelled,
             settings_updated, feasibility_recorded, mode_changed, snapshot_taken,
             risk_stop, risk_mode_changed, risk_paused, draft_executed,
             draft_execution_blocked, draft_execution_rejected,
             draft_dispatch_skipped_non_live, target_reached, expired]
        message: { type: string, nullable: true }
        metadata: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string, description: "ISO 8601." }

    # ── Profit Mission Phase 3 — Multi-Agent Proposal System (advisory) ───────

    MissionAgent:
      type: object
      description: >
        One specialist agent on a mission's team. Advisory only — agents produce
        read-only proposals and never execute. rank/weight/status are advisory
        ranking signals (Phase 4 evolves them); they never gate execution.
      required:
        [id, missionId, agentKey, name, role, status, rank, weight, createdAt]
      properties:
        id: { type: integer }
        missionId: { type: integer }
        agentKey:
          type: string
          enum: [SCALPER, TREND, REVERSAL, GOLD, SYNTHETIC, FOREX, RISK, JUDGE]
        registryAgentKey: { type: string, nullable: true }
        name: { type: string }
        role: { type: string }
        status:
          type: string
          enum: [active, shadow, learning_camp, probation, restricted, disabled]
        rank: { type: integer }
        weight: { type: number }
        performance: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string, description: "ISO 8601." }

    MissionProposalEntryPlan:
      type: object
      required: [entryPrice, entryZoneLow, entryZoneHigh]
      properties:
        entryPrice: { type: number, nullable: true }
        entryZoneLow: { type: number, nullable: true }
        entryZoneHigh: { type: number, nullable: true }

    MissionProposalRiskPlan:
      type: object
      required: [stopLoss, takeProfit, riskAmount, expectedR]
      properties:
        stopLoss: { type: number, nullable: true }
        takeProfit: { type: number, nullable: true }
        riskAmount: { type: number, nullable: true }
        expectedR: { type: number, nullable: true }

    MissionProposal:
      type: object
      description: >
        A structured, read-only agent proposal. Analysis artifact ONLY — there is
        no draft, approval-to-execute, or order placement. direction NONE +
        status context_only is the honest no-edge / no-live-feed state.
      required:
        [id, proposalId, missionId, agentKey, symbol, timeframe, direction,
         confidence, urgency, entryPlan, riskPlan, warnings, status, createdAt]
      properties:
        id: { type: integer }
        proposalId: { type: string }
        missionId: { type: integer }
        missionAgentId: { type: integer }
        agentKey:
          type: string
          enum: [SCALPER, TREND, REVERSAL, GOLD, SYNTHETIC, FOREX, RISK, JUDGE]
        symbol: { type: string }
        timeframe: { type: string }
        direction: { type: string, enum: [BUY, SELL, NONE] }
        setupType: { type: string, nullable: true }
        confidence: { type: number }
        urgency: { type: string, enum: [low, medium, high] }
        entryPlan: { $ref: "#/components/schemas/MissionProposalEntryPlan" }
        riskPlan: { $ref: "#/components/schemas/MissionProposalRiskPlan" }
        marketSnapshot: { type: object, nullable: true, additionalProperties: true }
        warnings: { type: array, items: { type: string } }
        reason: { type: string, nullable: true }
        invalidationLevel: { type: string, nullable: true }
        status:
          type: string
          enum: [proposed, selected, rejected, vetoed, expired, context_only]
        selectionReason: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        riskObjection: { type: string, nullable: true }
        judgeDecision: { type: string, nullable: true, enum: [best, no_trade] }
        createdAt: { type: string, description: "ISO 8601." }
        edge:
          allOf: [{ $ref: "#/components/schemas/EdgeScore" }]
          nullable: true
          description: Advisory edge read (Phase 5). Capped honestly — never raises over a safety block.
        missionImpact:
          allOf: [{ $ref: "#/components/schemas/MissionImpact" }]
          nullable: true
          description: Mission-impact preview, present on the selected proposal only.
        executionQuality:
          allOf: [{ $ref: "#/components/schemas/MissionExecutionQuality" }]
          nullable: true
          description: >
            Phase 7 advisory execution-quality + net-profit (+ exposure on selected)
            annotation. BLOCK/DOWNGRADE-ONLY — never raises a setup or relaxes a gate.

    EdgeScore:
      type: object
      description: >
        Advisory edge read (Phase 5). 0..100 finalEdgeScore + tier. HONEST CAPS:
        a stale feed / extreme spread / too-late entry can only LOWER standing
        (blocked or contextOnly) — the edge can never raise a setup above a
        safety block. actionable is true only for A+/A/B from a trusted feed.
      required: [finalEdgeScore, rawScore, tier, contextOnly, blocked, actionable, reason]
      properties:
        finalEdgeScore: { type: number }
        rawScore: { type: number }
        tier: { type: string, enum: ["A+", "A", "B", "C", "D", "F"] }
        contextOnly: { type: boolean }
        blocked: { type: boolean }
        capReason: { type: string, nullable: true }
        actionable: { type: boolean }
        warnings: { type: array, items: { type: string } }
        reason: { type: string }

    MissionImpactScenario:
      type: object
      required:
        [label, resultingValue, profitDelta, progressPctAfter, progressPctDelta,
         remainingProfitAfter, requiredDailyPaceAfter, requiredDailyPaceDelta]
      properties:
        label: { type: string, enum: [win, loss, expected] }
        resultingValue: { type: number }
        profitDelta: { type: number }
        progressPctAfter: { type: number }
        progressPctDelta: { type: number }
        remainingProfitAfter: { type: number }
        requiredDailyPaceAfter: { type: number }
        requiredDailyPaceDelta: { type: number }

    MissionImpact:
      type: object
      description: >
        Best/expected/worst-case mission-impact preview for a setup. ESTIMATE
        ONLY (isEstimate always true) — banned-vocabulary-safe, never a promise.
      required:
        [current, win, loss, expected, riskAmount, takeProfitGain, expectedR,
         winProbability, summary, isEstimate]
      properties:
        current:
          type: object
          required: [currentValue, progressPct, remainingProfit, requiredDailyPace]
          properties:
            currentValue: { type: number }
            progressPct: { type: number }
            remainingProfit: { type: number }
            requiredDailyPace: { type: number }
        win: { $ref: "#/components/schemas/MissionImpactScenario" }
        loss: { $ref: "#/components/schemas/MissionImpactScenario" }
        expected: { $ref: "#/components/schemas/MissionImpactScenario" }
        riskAmount: { type: number }
        takeProfitGain: { type: number }
        expectedR: { type: number }
        winProbability: { type: number }
        summary: { type: string }
        isEstimate: { type: boolean }

    OpportunityQueueEntry:
      type: object
      required: [proposalId, agentKey, symbol, timeframe, direction, rank, riskAdjustedScore, missionFit, actionable, opportunityCost, reasons]
      properties:
        proposalId: { type: string }
        agentKey: { type: string }
        symbol: { type: string }
        timeframe: { type: string }
        direction: { type: string, enum: [BUY, SELL, NONE] }
        edgeTier: { type: string, nullable: true, enum: ["A+", "A", "B", "C", "D", "F"] }
        edgeScore: { type: number, nullable: true }
        rank: { type: integer }
        riskAdjustedScore: { type: number }
        missionFit: { type: number }
        actionable: { type: boolean }
        opportunityCost: { type: number }
        reasons: { type: array, items: { type: string } }

    OpportunityQueue:
      type: object
      description: >
        Risk-adjusted opportunity queue (Phase 5). Ranked by mission fit, NOT raw
        confidence. decision is wait when no A/B-tier actionable edge exists.
      required: [decision, best, queue, bestAlternativeForgone]
      properties:
        decision: { type: string, enum: [act, wait] }
        best:
          allOf: [{ $ref: "#/components/schemas/OpportunityQueueEntry" }]
          nullable: true
        queue:
          type: array
          items: { $ref: "#/components/schemas/OpportunityQueueEntry" }
        waitReason: { type: string, nullable: true }
        bestAlternativeForgone: { type: number }

    TradeDraft:
      type: object
      description: >
        A reviewable / approvable TRADE DRAFT (Phase 5). APPROVAL ARTIFACT ONLY —
        approving flips status to `approved` and writes a journal event; it NEVER
        places a live/demo order. The `executed` status is reserved for later
        phases. effectiveStatus applies expiry-on-read.
      required:
        [id, draftId, missionId, proposalId, agentKey, symbol, timeframe,
         direction, status, effectiveStatus, createdAt, updatedAt]
      properties:
        id: { type: integer }
        draftId: { type: string }
        missionId: { type: integer }
        proposalId: { type: string }
        agentKey: { type: string }
        symbol: { type: string }
        timeframe: { type: string }
        direction: { type: string, enum: [BUY, SELL, NONE] }
        entryPrice: { type: number, nullable: true }
        stopLoss: { type: number, nullable: true }
        takeProfit: { type: number, nullable: true }
        lot: { type: number, nullable: true }
        riskAmount: { type: number, nullable: true }
        expectedR: { type: number, nullable: true }
        edgeScore: { type: number, nullable: true }
        edgeTier: { type: string, nullable: true, enum: ["A+", "A", "B", "C", "D", "F"] }
        edge:
          allOf: [{ $ref: "#/components/schemas/EdgeScore" }]
          nullable: true
        missionImpact:
          allOf: [{ $ref: "#/components/schemas/MissionImpact" }]
          nullable: true
        reason: { type: string, nullable: true }
        approvalReason: { type: string, nullable: true }
        rejectionReason: { type: string, nullable: true }
        status:
          type: string
          enum: [proposed, waiting_confirmation, approved, rejected, expired, executed, cancelled]
        effectiveStatus:
          type: string
          enum: [proposed, waiting_confirmation, approved, rejected, expired, executed, cancelled]
        createdAt: { type: string, description: "ISO 8601." }
        updatedAt: { type: string, description: "ISO 8601." }
        expiresAt: { type: string, nullable: true }
        approvedAt: { type: string, nullable: true }
        rejectedAt: { type: string, nullable: true }

    TradeDraftDecisionRequest:
      type: object
      description: Optional human-readable reason for the approve/reject decision.
      properties:
        reason: { type: string, nullable: true, maxLength: 500 }

    MissionScanResult:
      type: object
      description: >
        The result of running a mission's agents. Advisory only. judgeDecision
        no_trade with an empty/context-only set is the honest no-edge outcome.
      required:
        [proposals, selectedProposalId, judgeDecision, judgeReason,
         liveFeedConnected, symbolsScanned]
      properties:
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/MissionProposal"
        selectedProposalId: { type: string, nullable: true }
        judgeDecision: { type: string, enum: [best, no_trade] }
        judgeReason: { type: string }
        liveFeedConnected: { type: boolean }
        symbolsScanned: { type: integer }
        queue:
          allOf: [{ $ref: "#/components/schemas/OpportunityQueue" }]
          nullable: true
          description: Risk-adjusted opportunity queue (Phase 5).
        missionImpact:
          allOf: [{ $ref: "#/components/schemas/MissionImpact" }]
          nullable: true
          description: Mission-impact preview for the selected proposal (Phase 5).

    # ── Market Heat (Task #611) — honesty-aware heat verdicts ────────────────

    MarketHeatSource:
      type: object
      description: One data source's liveness for a heat verdict.
      required: [kind, name, status, configured, connected, recordCount]
      properties:
        kind: { type: string, enum: [price, news, calendar] }
        name: { type: string }
        status: { type: string, enum: [live, delayed, stale, missing, unavailable, error] }
        configured: { type: boolean }
        connected: { type: boolean }
        updatedAt: { type: string, nullable: true }
        recordCount: { type: integer }
        note: { type: string, nullable: true }

    MarketHeatVerdict:
      type: object
      description: >
        Honesty-aware heat verdict for a country, currency, symbol, synthetic, or
        the global aggregate. Decision-support only — `advisoryOnly` is always
        true and no field here is read by any execution gate.
      required:
        [id, scope, key, displayName, heatScore, direction, intensity,
         sourceStatus, priceSource, newsSource, calendarSource, confidence,
         reason, affectedSymbols, warnings, advisoryOnly]
      properties:
        id: { type: string }
        scope: { type: string, enum: [global, country, currency, symbol, synthetic] }
        key: { type: string }
        displayName: { type: string }
        heatScore: { type: number, description: "-100..+100" }
        direction: { type: string, enum: [bullish, bearish, neutral, unavailable] }
        intensity: { type: string, enum: [extreme, high, moderate, low, calm, unavailable] }
        sourceStatus: { type: string, enum: [confirmed, price_only, delayed, stale, provider_missing, unavailable] }
        priceSource: { $ref: "#/components/schemas/MarketHeatSource" }
        newsSource: { $ref: "#/components/schemas/MarketHeatSource" }
        calendarSource: { $ref: "#/components/schemas/MarketHeatSource" }
        priceUpdatedAt: { type: string, nullable: true }
        newsUpdatedAt: { type: string, nullable: true }
        calendarUpdatedAt: { type: string, nullable: true }
        confidence: { type: string, enum: [high, medium, low, none] }
        reason: { type: string }
        affectedSymbols: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
        advisoryOnly: { type: boolean, enum: [true] }

    MarketHeatProviderStatus:
      type: object
      required: [price, news, calendar]
      properties:
        price: { $ref: "#/components/schemas/MarketHeatSource" }
        news: { $ref: "#/components/schemas/MarketHeatSource" }
        calendar: { $ref: "#/components/schemas/MarketHeatSource" }

    MarketHeatNewsHeadline:
      type: object
      description: >
        A single severity-ranked recent headline driving the news-risk level.
        Surfaced (with source + publish time) so users can judge relevance.
        Decision-support only — never an execution input.
      required: [headline, source, publishedAt, severity]
      properties:
        headline: { type: string }
        source: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }
        severity: { type: string, enum: [high, medium, low] }

    MarketHeatNewsRisk:
      type: object
      description: >
        Honest "today's news risk" summary. `level` is `unavailable` whenever the
        news provider is not positively connected — never fabricated "low risk".
        `topHeadlines`/`highImpactCount` are empty/0 unless positively connected.
      required: [level, connected, itemCount, highImpactCount, topHeadlines, provider, summary]
      properties:
        level: { type: string, enum: [high, elevated, moderate, low, unavailable] }
        connected: { type: boolean }
        itemCount: { type: integer }
        highImpactCount: { type: integer }
        topHeadlines:
          type: array
          items: { $ref: "#/components/schemas/MarketHeatNewsHeadline" }
        provider: { type: string }
        updatedAt: { type: string, nullable: true }
        summary: { type: string }

    MarketHeatEvent:
      type: object
      description: >
        A single upcoming scheduled economic event. Surfaced ONLY from a
        connected real economic-calendar provider; the array is empty (never
        fabricated) when the calendar is not connected.
      required: [id, title, currency, impact, timeUtc, affectedSymbols]
      properties:
        id: { type: string }
        title: { type: string }
        currency: { type: string }
        impact: { type: string, enum: [low, medium, high] }
        timeUtc: { type: string }
        affectedSymbols: { type: array, items: { type: string } }

    MarketHeatResponse:
      type: object
      required: [generatedAt, timeframe, global, countries, currencies, synthetics, providerStatus, newsRisk, upcomingEvents, warnings]
      properties:
        generatedAt: { type: string }
        timeframe: { type: string }
        global: { $ref: "#/components/schemas/MarketHeatVerdict" }
        countries: { type: array, items: { $ref: "#/components/schemas/MarketHeatVerdict" } }
        currencies: { type: array, items: { $ref: "#/components/schemas/MarketHeatVerdict" } }
        synthetics: { type: array, items: { $ref: "#/components/schemas/MarketHeatVerdict" } }
        providerStatus: { $ref: "#/components/schemas/MarketHeatProviderStatus" }
        newsRisk: { $ref: "#/components/schemas/MarketHeatNewsRisk" }
        upcomingEvents: { type: array, items: { $ref: "#/components/schemas/MarketHeatEvent" } }
        warnings: { type: array, items: { type: string } }

    MarketHeatCountriesResponse:
      type: object
      required: [generatedAt, countries, providerStatus]
      properties:
        generatedAt: { type: string }
        countries: { type: array, items: { $ref: "#/components/schemas/MarketHeatVerdict" } }
        providerStatus: { $ref: "#/components/schemas/MarketHeatProviderStatus" }

    MarketHeatSymbolResponse:
      type: object
      required: [generatedAt, symbol, isApprovedMarket]
      description: >
        Symbol heat verdict with affected countries/currencies. For an
        unapproved symbol, `isApprovedMarket` is false and `verdict` is omitted
        (Focus-Lock blocked envelope).
      properties:
        generatedAt: { type: string }
        symbol: { type: string }
        isApprovedMarket: { type: boolean }
        blockedReason: { type: string, nullable: true }
        verdict: { $ref: "#/components/schemas/MarketHeatVerdict" }
        countries: { type: array, items: { $ref: "#/components/schemas/MarketHeatVerdict" } }
        currencies: { type: array, items: { $ref: "#/components/schemas/MarketHeatVerdict" } }
        newsRisk: { type: string, nullable: true }
        providerStatus: { $ref: "#/components/schemas/MarketHeatProviderStatus" }

    MarketHeatDiagnosticProvider:
      type: object
      required: [kind, name, configured, connected, apiKeyPresent, recordCount, freshness]
      properties:
        kind: { type: string, enum: [price, news, calendar] }
        name: { type: string }
        configured: { type: boolean }
        connected: { type: boolean }
        apiKeyPresent: { type: boolean, description: "Redacted presence only — never the key." }
        lastFetchAt: { type: string, nullable: true }
        lastError: { type: string, nullable: true }
        recordCount: { type: integer }
        highImpactCount:
          type: integer
          description: >
            News only — count of records matching a high-impact severity keyword
            (0 when not connected or not applicable). Omitted for other kinds.
        freshness: { type: string }

    MarketHeatDiagnostics:
      type: object
      required: [generatedAt, providers, coverage]
      properties:
        generatedAt: { type: string }
        providers: { type: array, items: { $ref: "#/components/schemas/MarketHeatDiagnosticProvider" } }
        coverage:
          type: object
          required: [countries, currencies, symbols, synthetics]
          properties:
            countries: { type: integer }
            currencies: { type: integer }
            symbols: { type: integer }
            synthetics: { type: integer }

    # ── Trading School progress (per-user learning state) ────────────────────

    SchoolQuizAttempt:
      type: object
      description: A single recorded quiz attempt for a lesson.
      required: [lessonId, scorePct, passed, at]
      properties:
        lessonId: { type: string }
        scorePct: { type: number, description: "Fraction 0..1" }
        passed:   { type: boolean }
        at:       { type: string, description: "ISO-8601 timestamp" }

    TradingSchoolProgress:
      type: object
      description: |
        A learner's full Trading School progress. The client store sends this
        whole object on every write (write-through) and reads it back on load
        (read-through), so it persists across devices and browser clears.
      required:
        [startedAt, completedAt, lastLessonId, completedLessonIds,
         passedLessonIds, attempts, labsAttempted, earnedBadgeIds]
      properties:
        startedAt:    { type: string, nullable: true, description: "ISO-8601 or null" }
        completedAt:  { type: string, nullable: true, description: "ISO-8601 or null" }
        lastLessonId: { type: string, nullable: true }
        completedLessonIds:
          type: array
          items: { type: string }
        passedLessonIds:
          type: array
          items: { type: string }
        attempts:
          type: array
          items: { $ref: "#/components/schemas/SchoolQuizAttempt" }
        labsAttempted:
          type: array
          items: { type: string }
        earnedBadgeIds:
          type: array
          items: { type: string }

    TradingSchoolProgressResponse:
      type: object
      required: [ok, progress]
      properties:
        ok: { type: boolean }
        progress: { $ref: "#/components/schemas/TradingSchoolProgress" }

    TradingSchoolProgressDeleteResponse:
      type: object
      required: [ok, deleted]
      properties:
        ok: { type: boolean }
        deleted:
          type: boolean
          description: True if a row was removed; false if none existed (still ok).

    # ── Bridge v2 status surfaces (Task #398) ────────────────────────────────

    BridgeV2AdminStatus:
      type: object
      description: Consolidated Bridge v2 readiness for one bridge (ADMIN/OWNER).
      required:
        [userId, connected, freshness, executionAllowedServed, totalAccepted,
         totalDuplicates, totalGaps, totalMissed, totalRejected, totalResets,
         pendingCommandCount]
      properties:
        userId: { type: integer }
        bridgeConnectionId: { type: integer, nullable: true }
        connected: { type: boolean }
        freshness: { type: string, enum: [LIVE, STALE, OFFLINE, UNKNOWN] }
