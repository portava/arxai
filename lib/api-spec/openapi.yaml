  /news/calendar:
    get:
      operationId: getEconomicCalendar
      tags: [news]
      summary: Upcoming economic events
      parameters:
        - name: currency
          in: query
          schema:
            type: string
        - name: impact
          in: query
          schema:
            type: string
        - name: days
          in: query
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EconomicEvent"

  /economic-calendar/events:
    get:
      operationId: getLiveCalendarEvents
      tags: [news]
      summary: |
        Live upcoming events from the configured real economic-calendar
        provider (Trading Economics). Returns provider metadata + a
        window-filtered array of enriched events. `connected` is false when no
        provider is configured (`ECONOMIC_CALENDAR_PROVIDER` + `TRADING_ECONOMICS_KEY`)
        or the last fetch failed. This is the primary/unified endpoint for both
        the Economic Calendar page and the radar/Ruby seam — do not drift by
        sourcing status and event list from separate endpoints.
      parameters:
        - name: symbol
          in: query
          description: Optional ARX symbol to scope the window (e.g. EURUSD). When omitted all events are returned.
          schema: { type: string }
        - name: daysAhead
          in: query
          schema: { type: integer, default: 7, minimum: 1, maximum: 30 }
        - name: from
          in: query
          description: Inclusive lower-bound ISO date (e.g. "2025-01-15"). When set, overrides the daysAhead window start.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive upper-bound ISO date. When set, overrides the daysAhead window end.
          schema: { type: string, format: date }
        - name: currencies
          in: query
          description: Comma-separated currency codes to filter events (e.g. "USD,EUR,GBP").
          schema: { type: string }
        - name: impact
          in: query
          description: Minimum impact level to include.
          schema: { type: string, enum: [low, medium, high] }
        - name: symbols
          in: query
          description: Comma-separated ARX symbols for additional symbol-scoping (e.g. "EURUSD,GBPUSD").
          schema: { type: string }
      responses:
        "200":
          description: Live calendar snapshot
          content:
            application/json:
              schema:
                type: object
                required: [connected, provider, configured, eventCount, events]
                properties:
                  connected:  { type: boolean }
                  provider:   { type: string }
                  configured: { type: boolean }
                  eventCount: { type: integer }
                  lastFetchAt:      { type: string, nullable: true }
                  lastErrorAt:      { type: string, nullable: true }
                  lastErrorMessage: { type: string, nullable: true }
                  freshnessStatus:  { type: string, enum: [fresh, stale, unavailable] }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/RawCalendarEvent" }

  /economic-events:
    get:
      operationId: listEconomicEvents
      tags: [news]
      summary: List synced economic events (Build N)
      parameters:
        - name: currency
          in: query
          schema: { type: string }
        - name: impact
          in: query
          schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
        - name: days
          in: query
          schema: { type: integer, default: 7 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/EconomicEventRecord" }

  /economic-events/sync:
    post:
      operationId: syncEconomicEvents
      tags: [news]
      summary: Pull events from the configured news provider into the DB
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                daysAhead: { type: integer, default: 7 }
      responses:
        "200":
          description: |
            Sync result. When no provider is configured the response is an
            explicit not_configured result (provider:"none", configured:false,
            connected:false, eventsSynced:0) — never a fake success, and no
            provider fetch is attempted.
          content:
            application/json:
              schema:
                type: object
                required: [provider, providerState, configured, connected, eventsSynced, upserted, daysAhead, message]
                properties:
                  provider:      { type: string }
                  providerState: { type: string, enum: [not_configured, fetch_error, connected] }
                  configured:    { type: boolean }
                  connected:     { type: boolean }
                  eventsSynced:  { type: integer }
                  upserted:      { type: integer, description: "Back-compat alias for eventsSynced." }
                  daysAhead:     { type: integer }
                  message:       { type: string }
        "500":
          description: |
            Provider is configured but the fetch failed (providerState:"fetch_error").
          content:
            application/json:
              schema:
                type: object
                required: [provider, providerState, configured, connected, eventsSynced, upserted, daysAhead, message]
                properties:
                  provider:      { type: string }
                  providerState: { type: string, enum: [not_configured, fetch_error, connected] }
                  configured:    { type: boolean }
                  connected:     { type: boolean }
                  eventsSynced:  { type: integer }
                  upserted:      { type: integer }
                  daysAhead:     { type: integer }
                  message:       { type: string }

  /economic-events/upcoming:
    get:
      operationId: getUpcomingEconomicEvents
      tags: [news]
      summary: Upcoming high-impact events in the next N hours
      parameters:
        - name: hours
          in: query
          schema: { type: integer, default: 24 }
        - name: minImpact
          in: query
          schema: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL], default: HIGH }
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: object
                required: [events, windowHours, minImpact]
                properties:
                  windowHours: { type: integer }
                  minImpact:   { type: string }
                  events:
                    type: array
                    items: { $ref: "#/components/schemas/EconomicEventRecord" }

