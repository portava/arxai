            never an execution input.
          required: [connected, provider, itemCount, highImpactCount, topHeadlines, updatedAt]
          properties:
            connected:       { type: boolean }
            provider:        { type: string }
            itemCount:       { type: integer }
            highImpactCount: { type: integer }
            topHeadlines:
              type: array
              items: { $ref: "#/components/schemas/MarketHeatNewsHeadline" }
            updatedAt:       { type: ["string", "null"] }

    RawCalendarEvent:
      type: object
      required: [id, title, currency, impact, eventTimeIso, affectedMarkets]
      description: |
        A raw economic-calendar event from a connected real provider (Trading
        Economics). Never fabricated — the radar/Ruby surfaces these only when
        `connected:true` from the calendar seam. The live-calendar endpoint
        (`GET /economic-calendar/events`) returns enriched fields in addition to
        the base radar fields: country, source, forecast, previous, actual, plus
        the explicit contract fields eventTimeUtc, affectedSymbols, and riskNote.
      properties:
        id:             { type: string }
        title:          { type: string }
        currency:       { type: string }
        impact:         { type: string, enum: [low, medium, high] }
        eventTimeIso:   { type: string, format: date-time }
        affectedMarkets:
          type: array
          items: { type: string }
        country:        { type: string }
        source:         { type: string }
        forecast:       { type: ["string", "null"] }
        previous:       { type: ["string", "null"] }
        actual:         { type: ["string", "null"] }
        eventTimeUtc:
          type: string
          format: date-time
          description: ISO-8601 event time in UTC. Same value as eventTimeIso; explicit name for contract clarity.
        eventTimeLocal:
          type: string
          format: date-time
          description: |
            Event time for local-time rendering. Trading Economics reports all times
            in UTC; this carries the same ISO string as eventTimeUtc. Consumers should
            format it using Intl.DateTimeFormat with the user's browser locale.
        affectedSymbols:
          type: array
          items: { type: string }
          description: Explicit alias for affectedMarkets — both are always present when returned from the enriched endpoint.
        riskNote:
          type: ["string", "null"]
          description: Brief human-readable risk guidance derived from impact level; null for low-impact events.

