      responses:
        "200":
          description: Security posture overview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSecurityOverview" }
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/security/timeline:
    get:
      operationId: getAdminSecurityTimeline
      tags: [adminSecurity]
      summary: Redacted security-event timeline (ADMIN/OWNER only)
      description: >
