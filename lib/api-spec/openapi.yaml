        masterAccountNumberMasked: { type: string, nullable: true }
        masterStatus: { type: string, nullable: true }
        openAttributions: { type: integer }
        realizedPnl7d: { type: number }

    MasterMt5Snapshot:
      type: object
      description: >
        Real MT5 master-account snapshot, owner/admin only. Sourced from the
        EA heartbeat (arx_master_bridge_pool + mt5_connection). Never includes
        tokens, IPs, or the unmasked account number. Null for normal users.
      required:
        [mt5Balance, mt5Equity, mt5UsedMargin, mt5FreeMargin, mt5OpenPnl,
         openPositions, arxAllocated, arxAvailable, arxReserved, realizedPnl7d,
         snapshotStatus, isOverAllocated, unattributedCount, syncStatus]
      properties:
        mt5Balance: { type: number }
        mt5Equity: { type: number }
        mt5UsedMargin: { type: number }
        mt5FreeMargin: { type: number }
        mt5OpenPnl: { type: number }
        openPositions: { type: integer }
        accountCurrency: { type: string, nullable: true }
        brokerName: { type: string, nullable: true }
        serverName: { type: string, nullable: true }
        accountTypeLabel: { type: string, nullable: true }
        accountNumberMasked: { type: string, nullable: true }
        arxAllocated: { type: number }
        arxAvailable: { type: number }
        arxReserved: { type: number }
        realizedPnl7d: { type: number }
        snapshotStatus: { type: string, enum: [FRESH, STALE, MISSING] }
        snapshotAgeMs: { type: integer, nullable: true }
        lastMt5SnapshotAt: { type: string, format: date-time, nullable: true }
        isOverAllocated: { type: boolean }
        unattributedCount: { type: integer }
        syncStatus:
          type: string
          enum: [LIVE, STALE, UNAVAILABLE]
          description: Derived health for the card sync badge.

    MeSharedAccountAllocationView:
      type: object
      description: >
        Canonical per-user live allocation — the SAME source the live dispatch
        gate, chart/scanner/assistant preflight, and /me/master-live/access use
        (getUserAllocationView). Strictly the caller's own allocation; never
        master or cross-user data. Display surfaces must read availableAllocation
        from here instead of the static virtual_balance, which drifts from the
        headroom the gate actually enforces.
      required:
        [assignedAllocation, availableAllocation, reservedRisk, openFloatingLoss,
         bridgeAvailability, bridgeMessage, hasAllocation, isOverAllocated]
      properties:
        assignedAllocation: { type: number }
        availableAllocation:
          type: number
          description: assigned − reserved + open floating loss, floored at 0.
        reservedRisk: { type: number }
        openFloatingLoss:
          type: number
          description: Sum of the caller's own open floating losses (<= 0).
        bridgeAvailability: { type: string, enum: [HEALTHY, RECONCILING, UNAVAILABLE] }
        bridgeMessage: { type: string }
        hasAllocation:
          type: boolean
          description: >
            True only when an allocation row exists AND assigns > 0. Lets the UI
            distinguish "no allocation assigned yet" from "fully consumed"; both
            still block live dispatch but need different honest copy.
        isOverAllocated: { type: boolean }

    MeSharedAccountSummaryResp:
      type: object
      required: [ok, userId, accounts]
      properties:
        ok: { type: boolean }
        userId: { type: integer }
        accounts:
          type: array
          items: { $ref: "#/components/schemas/MeSharedAccountSummaryRow" }
        allocationView:
          oneOf:
            - $ref: "#/components/schemas/MeSharedAccountAllocationView"
            - type: "null"
          description: >
            Canonical per-user allocation for ALL callers (own data only).
            Present on success; null only on the error path.
        masterMt5:
          oneOf:
            - $ref: "#/components/schemas/MasterMt5Snapshot"
            - type: "null"
          description: Owner/admin-only real MT5 master snapshot; null otherwise.
        masterAccess:
          type: boolean
          description: >
            True when the caller is owner/admin and may view/refresh the MT5
            master snapshot — independent of whether masterMt5 is currently
            non-null (the bridge may be unpinned/offline). Drives the refresh
            capability in the UI.
        error: { type: string, nullable: true }

