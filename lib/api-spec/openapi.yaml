        universeCount, so "N of M scanned" reconciles with no silent drops.
      required: [symbol, displayName, reason]
      properties:
        symbol: { type: string }
        displayName: { type: string }
        reason:
          type: string
          enum: [MISSING_FEED, LIMITED_HISTORY, STALE_DATA, UNSUPPORTED_SYMBOL, PROVIDER_ERROR, EXCLUDED_BY_FILTER]

