    MeSharedAccountSummaryRow:
      type: object
      required: [id, routingMode, accountType, virtualBalance, virtualEquity, virtualMarginUsed, virtualPnl, status, updatedAt, openAttributions, realizedPnl7d]
      properties:
        id: { type: integer }
