      type: object
      required: [universe, timeframe, map, bestVsSelected, skippedSymbols, universeCount, dataNote, generatedAt]
      properties:
        universe: { type: string, enum: [all, forex, metals, crypto, stocks, synthetic] }
        timeframe: { type: string }
        map: { $ref: "#/components/schemas/OpportunityMapResult" }
        bestVsSelected: { $ref: "#/components/schemas/OpportunityBestVsSelected" }
        skippedSymbols:
          type: array
          items: { $ref: "#/components/schemas/OpportunitySkippedSymbol" }
          description: Universe symbols dropped from the scan, each with a concrete reason.
        universeCount:
          type: integer
          description: Total symbols in the scanned universe (M in "N of M scanned").
        dataNote: { type: string, nullable: true }
        generatedAt:
          type: string
          format: date-time
          description: ISO timestamp of when this scan was really computed. A cached read keeps the original stamp, so a cached value is never shown as "fresh now".

