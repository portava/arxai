                  executionMode:              { type: string, enum: [READ_ONLY] }
                  placementLayer:             { type: string, enum: [BROKER_PLACEMENT_LAYER_NOT_IMPLEMENTED] }
                  liveExecutionEnabled:       { type: boolean }
                  liveBrokerExecutionAvailable: { type: boolean }
                  brokerPlacementImplemented: { type: boolean }
