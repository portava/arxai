        priceTo: { type: ["number", "null"] }
        note: { type: ["string", "null"] }
        status: { type: string, enum: [active, triggered, dismissed] }
        lastTriggeredAt: { type: ["string", "null"] }
        expiresAt: { type: ["string", "null"] }
        createdAt: { type: string }

    ChartAnnotationCreateRequest:
      type: object
      required: [symbol, kind, price]
      properties:
        symbol: { type: string, minLength: 1, maxLength: 64 }
        displaySymbol: { type: string, minLength: 1, maxLength: 64 }
        timeframe: { type: string, enum: [M1, M5, M15, M30, H1, H4, D1], default: M5 }
        kind: { type: string, enum: [SUPPORT, RESISTANCE, WATCH_ZONE, PRICE_ALERT] }
        direction: { type: string, enum: [above, below] }
