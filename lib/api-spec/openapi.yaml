  /backtest-runs:
    get:
      operationId: getBacktestRuns
      tags: [backtestRuns]
      summary: List recent backtest runs
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items: { $ref: "#/components/schemas/BacktestRun" }
    post:
      operationId: createBacktestRun
      tags: [backtestRuns]
      summary: Create and execute a backtest run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [strategyId, symbol]
              properties:
                strategyId:     { type: string }
                symbol:         { type: string }
                timeframe:      { type: string, default: M1 }
                candleCount:    { type: integer, default: 500 }
                initialBalance: { type: number, default: 10000 }
                minConfidence:  { type: integer, default: 60 }
                startTime:
                  type: string
                  format: date-time
                  description: >
                    Optional history-range start (ISO). When a range is given the run
                    uses REAL broker_candles history only — insufficient history returns
                    an honest INSUFFICIENT_DATA run, never a synthetic fallback.
                endTime:
                  type: string
                  format: date-time
                  description: Optional history-range end (ISO). Required together with startTime.
      responses:
        "200":
          description: Run completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BacktestRun" }

  /backtest-runs/{id}:
    get:
      operationId: getBacktestRun
      tags: [backtestRuns]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
