  /chart/candles:
    get:
      operationId: getChartCandles
      tags: [data]
      summary: Normalized chart candles with source, quality & AI-usability (ARX Native Chart L1)
      description: |
        Returns normalized OHLC candles for a symbol/timeframe over the existing
        market-data router. Never fabricates bars — an unavailable feed returns an
        empty candle list with an honest quality + warning. Detects missing,
        duplicate, out-of-order, and invalid-OHLC sequences and flags stale/delayed
        feeds. aiUsable is true only when the feed is clean (current, complete, no
        gaps, valid OHLC). Existing /api/data/candles is unchanged.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1]
            default: M5
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 300
      responses:
        "200":
          description: Normalized chart candles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartCandlesResponse"
        "400":
          description: Invalid symbol or timeframe

  /chart/feed-status:
    get:
      operationId: getChartFeedStatus
      tags: [data]
      summary: Normalized feed status for a symbol (ARX Native Chart L1)
      description: |
        Lightweight liveness probe for a symbol's feed. Reports source, isLive,
        last tick/candle time, latency, stale flag, sequence-anomaly counts,
        quality, and aiUsable derived from real provider signals. Never fabricates.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1]
            default: M5
      responses:
        "200":
          description: Normalized feed status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartFeedStatus"
        "400":
          description: Invalid symbol or timeframe

  /chart/history:
    get:
      operationId: getChartHistory
      tags: [data]
      summary: Deep, scrollable candle history with a `before` cursor and honest metadata
      description: |
        Paginated candle HISTORY for a symbol/timeframe, served from the
        persisted candle cache (deep, accumulating storage) and seeded/backfilled
        from real providers. Pass `before` (ISO time) to page strictly OLDER bars
        (back-scrolling). Returns ONE coherent source per response (provenance),
        and never labels historical/stale data as live: a page reached via the
        `before` cursor is `historical_only`; the newest window's live/stale
        verdict comes from the shared freshness precedence. Never fabricates — a
        provider that cannot reach the requested depth reports
        `providerLimitReached` + `providerMessage`. Market-data telemetry only;
        touches no execution path. Existing /api/chart/candles is unchanged.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1]
            default: M5
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 500
        - name: before
          in: query
          description: Return bars strictly OLDER than this ISO time (back-pagination cursor).
          schema:
            type: string
        - name: source
          in: query
          description: Continuation — the source echoed by a previous page (keeps one coherent series).
          schema:
            type: string
      responses:
        "200":
          description: Paginated candle history with honest metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartHistoryResponse"
        "400":
          description: Invalid symbol or timeframe

  /me/chart/intelligence:
    get:
      operationId: getMeChartIntelligence
      tags: [data]
      summary: Chart Intelligence State for a symbol/timeframe (Chart Brain v2 L1 — Fast Brain)
      description: |
        Per-user-safe Chart Intelligence State assembled by the Fast Brain on top
        of the Level 1 Truth Layer. Returns the truth state, the still-forming
        current candle, the latest closed candle, fast candle statistics, fast
        flags (basic proximity / momentum), and EXPLICIT placeholders for the
        market-understanding, setup, and decision engines that later Chart Brain
        tasks populate — never faked. Includes a Chart Speed State (state-build +
        feed latency, active mode) and a slowBrainBlockedLiveExecution flag that
        always reads false. Read-only: never places, modifies, or closes a trade,
        and never blocks candle rendering or live execution. aiUsable is marked
        false whenever the underlying feed is dirty.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1]
            default: M5
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 300
      responses:
        "200":
          description: Chart Intelligence State
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartIntelligenceResponse"
        "400":
          description: Invalid symbol or timeframe
        "401":
          description: Unauthorized

  /me/market/truth/{symbol}:
    get:
      operationId: getMeMarketTruth
      tags: [data]
      summary: One Truth Snapshot for a symbol/timeframe (Task #512 — One Truth, One Brain)
      description: |
        The single per-user Truth Snapshot for a symbol. It COMPOSES the existing
        canonical resolvers — chart feed (data state, price, data timestamps),
        market-impact radar (news provider + events), the scanner signal, the
        scalp/flame reads, and the timing read — into ONE object so every
        scanner/chart/Ruby surface renders identical freshness, news state, price,
        and component verdicts. Read-only: it never places, modifies, or closes a
        trade, never gates execution, and never fabricates data — a blind or
        failing source becomes an absent component (present:false), never a guess.
        Freshness is exposed as the underlying DATA timestamps (lastCandleAt /
        lastTickAt); the snapshot's own generatedAt is the build time, kept
        separate. Actionable entry/stop/target levels are withheld when the saved
        geometry has drifted too far from the current price.
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: tf
          in: query
          schema:
            type: string
            enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1]
            default: M15
      responses:
        "200":
          description: The composed Truth Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketTruthResponse"
        "400":
          description: Invalid symbol or timeframe
        "401":
          description: Unauthorized

  /me/chart/smart-layers:
    get:
      operationId: getMeChartSmartLayers
      tags: [data]
      summary: Smart Chart Layers & Market Impact Radar for a symbol/timeframe (Task #197)
      description: |
        Per-user-safe Smart Chart overlay model. Returns Ruby's signal geometry
        (watch / entry / retest / late / invalidation / stop / take-profit) and
        structure levels as drawable visual layers that stay CONSISTENT with
        Ruby's text, plus a Market Impact Radar that maps events from a
        connected, real economic-calendar provider onto the symbol (severity +
        countdown), an honest news behavior note, reserved execution-cost and
        trade-health overlay slots, and a data-side Smart Chart Overlay
        Handshake. ADVISORY / VISUAL ONLY — it never places, modifies, or closes
        a trade and never gates execution. HONEST: news is real or honestly
        absent — when no real economic-calendar provider is connected the radar
        shows no scheduled events (none are fabricated) and the read degrades to
        technicals-only behavior, never fabricated events, headlines, or
        results. Synthetic instruments never map to real-world events.
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
        - name: timeframe
          in: query
          schema:
            type: string
            enum: [M1, M5, M15, M30, H1, H4, D1]
            default: M5
      responses:
        "200":
          description: Smart Chart Layers, Market Impact Radar and overlay handshake
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SmartChartLayersResponse"
        "400":
          description: Invalid symbol or timeframe
        "401":
          description: Unauthorized

  /me/trade-health:
    get:
      operationId: getMeTradeHealth
      tags: [data]
      summary: Live Trade Health & Management report for the caller's open positions (Task #198)
      description: |
        Per-user post-entry health monitor. For every open position the caller
        holds (mode-scoped: live for a LIVE_SHARED user, demo for a DEMO user,
        nothing for PAPER) it classifies the position (healthy / weakening /
        danger / invalidated), tracks take-profit progress and stop-loss
        distance, and emits break-even, partial-close, conflict, correlation,
        overtrading, trade-style and setup-alternative GUIDANCE, plus the Live
        Trade Health Handshake per position and active trade-health chart
        overlays. GUIDANCE ONLY — it never places, modifies, or closes a trade;
        auto-close stays alert-only and the 16-gate live pipeline is untouched.
        HONEST: every price is a real broker-derived number or null; when an
        input is missing the read degrades honestly (unknown progress, a
        not-available check, a "based on floating profit/loss only" note) and
        never fabricates a value or uses sim/mock/paper data as real. Strictly
        per-user — no other user's position is ever returned.
      parameters:
        - name: chartSymbol
          in: query
          required: false
          description: |
            The symbol currently shown on the chart, used to drive the active
            trade-health overlays and the per-position symbol-match check. Omit
            when no chart is open — overlays are then empty (never fabricated).
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Trade-health report with the read-only safety envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradeHealthResponse"
        "401":
          description: Unauthorized

  /me/trading-school/progress:
    get:
      operationId: getMeTradingSchoolProgress
      tags: [data]
      summary: Get the caller's Trading School learning progress
      description: |
        Returns the authenticated user's Trading School progress (lessons
        started/complete, quiz attempts + best scores, labs attempted, earned
        badges). Strictly per-user — never returns another user's progress.
        When the user has no saved progress yet, an empty progress object is
        returned. Education data only; touches no trading or safety surface.
      responses:
        "200":
          description: The caller's Trading School progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingSchoolProgressResponse"
        "401":
          description: Unauthorized
    put:
      operationId: putMeTradingSchoolProgress
      tags: [data]
      summary: Save (upsert) the caller's Trading School learning progress
      description: |
        Write-through upsert of the caller's full Trading School progress blob.
        The client store sends the complete state after each change so it
        persists across devices and browser clears. Strictly per-user — a user
        can only ever write their own row. Education data only; never blocks or
        touches trading, execution, or any safety surface.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TradingSchoolProgress"
      responses:
        "200":
          description: The saved Trading School progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingSchoolProgressResponse"
        "401":
          description: Unauthorized
    delete:
      operationId: deleteMeTradingSchoolProgress
      tags: [data]
      summary: Delete the caller's Trading School learning progress
      description: |
        Removes the authenticated user's Trading School progress row outright
        (idempotent — succeeds even if no row exists). Backs the "Reset
        progress" flow and any future account-data-removal request so the
        saved server copy is cleared, not just overwritten with an empty blob.
        Strictly per-user — a user can only ever delete their own row.
        Education data only; never blocks or touches trading, execution, or any
        safety surface.
      responses:
        "200":
          description: The caller's Trading School progress was removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TradingSchoolProgressDeleteResponse"
        "401":
          description: Unauthorized

  /me/assistant/draft-read:
    post:
      operationId: postMeAssistantDraftRead
      tags: [assistant]
      summary: Ruby Draft Read — read-only prepared read over the Chart Intelligence State
      description: |
        Deterministic, READ-ONLY Ruby read assembled from the already-built
        Chart Intelligence State for a symbol/timeframe. No LLM and no provider
        re-probe — it restates the chart's own truth/understanding/decision
        layers in plain language for a small set of fixed intents
        (analyze, is-this-a-buy, is-this-a-scalp, why-not-now,
        what-changes-my-mind, what-invalidates, hold-or-close, agent-consensus).
        Ruby is strictly read-only: it never places, modifies, or closes a trade,
        never mutates a connection, and never reads another user's data. Every
        response carries the paper_only / liveLocked / readOnlyMode /
        allowOrderExecution=false envelope. Honest by construction — degrades to
        an "insufficient" read on a dirty/empty feed rather than inventing a
        setup.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RubyDraftReadRequest"
      responses:
        "200":
          description: Ruby Draft Read result with the read-only safety envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RubyDraftReadResponse"
        "400":
          description: Invalid body
        "401":
          description: Unauthorized

  /me/assistant-settings:
    get:
      operationId: getMeAssistantSettings
      tags: [assistant]
      summary: Get the caller's AI assistant personalization settings (display name)
      description: |
        Per-user assistant personalization. Returns the resolved assistant
        display name for the signed-in user (falls back to the app default
        "Eleanor" when the user has never customized it) and whether the value
        is currently the default. Personalization/branding only — no AI logic,
        safety, or execution behavior is affected.
      responses:
        "200":
          description: The caller's assistant settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettings"
        "401":
          description: Unauthorized
    patch:
      operationId: updateMeAssistantSettings
      tags: [assistant]
      summary: Update the caller's AI assistant display name
      description: |
        Sets a custom assistant display name for the signed-in user only, or
        resets to the default ("Eleanor") when displayName is null. The name is
        validated server-side (2–24 chars; letters/numbers/spaces/apostrophes/
        hyphens; reserved/impersonation names rejected). Strictly per-user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantSettingsUpdate"
      responses:
        "200":
          description: Updated assistant settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettings"
        "400":
          description: Invalid name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSettingsError"
        "401":
          description: Unauthorized

  /me/chart/decision-receipt:
    post:
      operationId: postMeChartDecisionReceipt
      tags: [data]
      summary: Create an immutable chart Decision Receipt (Chart Brain v2 L5 — Slow Brain)
      description: |
        Records ONE immutable Decision Receipt capturing exactly what the chart +
        intelligence layers said at decision time for a symbol/timeframe. The
        receipt is written once and never mutated or deleted. SLOW BRAIN: this is
        decision-support memory only — it is never on the live execution path and
        never blocks candle render or order dispatch. Per-user: the receipt is
        owned by the caller. Fails open (created=false) on a storage error rather
        than breaking the read. Read-only with respect to trading: never places,
        modifies, or closes a trade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartDecisionReceiptCreateRequest"
      responses:
        "200":
          description: The created Decision Receipt (or created=false on storage failure)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartDecisionReceiptCreateResponse"
        "400":
          description: Invalid body
        "401":
          description: Unauthorized

  /me/chart/decision-receipts:
    get:
      operationId: getMeChartDecisionReceipts
      tags: [data]
      summary: List the caller's chart Decision Receipts (Chart Brain v2 L5)
      description: |
        Per-user history of immutable Decision Receipts, most recent first.
        Strictly scoped to the calling user — no other user's receipts are ever
        returned. Read-only.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: The caller's receipts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartDecisionReceiptListResponse"
        "401":
          description: Unauthorized

  /me/chart/decision-receipts/{receiptId}:
    get:
      operationId: getMeChartDecisionReceipt
      tags: [data]
      summary: Get one of the caller's Decision Receipts with its appended outcomes (Chart Brain v2 L5)
      description: |
        Returns a single immutable receipt owned by the caller plus its
        append-only OUTCOME/REVIEW records. 404 when not found or not owned by the
        caller (per-user isolation). Read-only.
      parameters:
        - name: receiptId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: The receipt with its appended outcomes/reviews
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartDecisionReceiptDetailResponse"
        "401":
          description: Unauthorized
        "404":
          description: Not found
    # ── Append-only outcome / review ──
  /me/chart/decision-receipts/{receiptId}/outcome:
    post:
      operationId: postMeChartDecisionReceiptOutcome
      tags: [data]
      summary: Append an OUTCOME or REVIEW to a Decision Receipt (Chart Brain v2 L5)
      description: |
        Appends an objective OUTCOME or a subjective REVIEW to a receipt the
        caller owns. The original receipt is NEVER modified — the record is added
        to a separate append-only store. 404 when the receipt is not found or not
        owned by the caller. Read-only with respect to trading.
      parameters:
        - name: receiptId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartDecisionOutcomeCreateRequest"
      responses:
        "200":
          description: The appended outcome/review record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartDecisionOutcomeCreateResponse"
        "400":
          description: Invalid body
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /me/chart/similar-setups:
    post:
      operationId: postMeChartSimilarSetups
      tags: [data]
      summary: Find the caller's structurally similar past setups (Chart Brain v2 L5 — Slow Brain)
      description: |
        Builds a deterministic setup fingerprint for a symbol/timeframe from the
        current Chart Intelligence State and searches the caller's OWN past
        receipts for structurally similar setups, scored field-by-field. Honest by
        construction: returns enoughHistory=false rather than implying a pattern
        when there is too little comparable history. SLOW BRAIN — never on the live
        path, never blocks render or dispatch. Per-user. Read-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartSimilarSetupsRequest"
      responses:
        "200":
          description: Similar-setup matches (or an honest not-enough-history result)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartSimilarSetupsResponse"
        "400":
          description: Invalid body
        "401":
          description: Unauthorized

  /me/chart/behavior-protection:
    get:
      operationId: getMeChartBehaviorProtection
      tags: [data]
      summary: Advisory chart behavior-protection signals for the caller (Chart Brain v2 L5)
      description: |
        Respectful, advisory behavior signals derived ONLY from the caller's own
        recent trading history (chasing, revenge trading, overtrading, directional
        bias-lock, holding losers, ignoring invalidation). Decision-support only —
        it NEVER overrides market truth and never changes a signal, gate, or price.
        Investor (view-only) callers receive applicable=false. SLOW BRAIN, per-user,
        read-only, fails open.
      responses:
        "200":
          description: Behavior-protection result (applicable=false for investors)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartBehaviorProtectionResponse"
        "401":
          description: Unauthorized

  /admin/chart/decision-receipts:
    get:
      operationId: getAdminChartDecisionReceipts
      tags: [admin]
      summary: Admin/OWNER history of chart Decision Receipts across users (Chart Brain v2 L5)
      description: |
        Cross-user read of Decision Receipts for operator review. Requires an
        ADMIN/OWNER session (admin-previewing-as-user is downgraded and refused).
        Read-only.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: userId
          in: query
          schema: { type: integer, minimum: 1 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
      responses:
        "200":
          description: Receipts across users (each annotated with its owning userId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChartDecisionReceiptListResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (not an admin/owner session)

  /admin/handshake-monitor:
    get:
      operationId: getAdminHandshakeMonitor
      tags: [admin]
      summary: ADVISORY cross-layer readiness verdicts for the operator monitor
      description: |
        Read-only operator view of the ARX Handshake System. Returns the current
        ADVISORY readiness verdict for every handshake type plus recent evidence
        check-ins. This NEVER gates, slows, or blocks any trade and is not part of
        the 16-gate live pipeline. Requires an ADMIN/OWNER session
        (admin-previewing-as-user is downgraded and refused). Investor-scoped
        handshakes report SKIPPED in this system view (no single-tenant data).
      responses:
        "200":
          description: Advisory verdicts plus recent check-ins
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandshakeMonitorResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (not an admin/owner session)

  /admin/handshake-monitor/refresh:
    post:
      operationId: refreshAdminHandshakeMonitor
      tags: [admin]
      summary: Force a fresh evaluation of all handshakes and record evidence
      description: |
        Forces a fresh read-only evaluation of every handshake type and records a
        deliberate operator snapshot for the implemented ones. Advisory only —
        records evidence, never changes execution. ADMIN/OWNER only.
      responses:
        "200":
          description: Number of handshakes refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HandshakeMonitorRefreshResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (not an admin/owner session)

  /me/chart/annotations:
    get:
      operationId: getMeChartAnnotations
      tags: [data]
      summary: List the caller's chart annotations (marked levels / zones / price alerts)
      description: |
        Per-user list of marked support/resistance levels, watch zones, and price
        alerts created from the chart command menu. Excludes dismissed by default.
        SLOW BRAIN — never on the live path, never places a trade. Read-only.
      parameters:
        - name: symbol
          in: query
          schema: { type: string, minLength: 1, maxLength: 64 }
        - name: includeDismissed
          in: query
          schema: { type: boolean }
      responses:
        "200":
          description: The caller's annotations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartAnnotationListResponse"
        "401":
          description: Unauthorized
    post:
      operationId: postMeChartAnnotation
      tags: [data]
      summary: Create a chart annotation (marked level / watch zone / price alert)
      description: |
        Creates one per-user annotation. PRICE_ALERT requires a direction;
        WATCH_ZONE requires priceTo. Price alerts are evaluated read-only by the
        AI-alert scan and NEVER execute a trade. Per-user, additive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartAnnotationCreateRequest"
      responses:
        "200":
          description: The created annotation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartAnnotationResponse"
        "400":
          description: Invalid body
        "401":
          description: Unauthorized

  /me/chart/annotations/{id}:
    delete:
      operationId: deleteMeChartAnnotation
      tags: [data]
      summary: Soft-delete (dismiss) one of the caller's chart annotations
      description: |
        Soft-deletes (status=dismissed) one annotation owned by the caller. There
        is no hard-delete path. Per-user scoped — only the owner can dismiss.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Dismissed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartAnnotationDismissResponse"
        "400":
          description: Invalid id
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /me/chart/ai-alerts/scan:
    post:
      operationId: postMeChartAiAlertsScan
      tags: [data]
      summary: Scan a symbol for AI-aware chart-state transition alerts (Chart Brain v2 L6)
      description: |
        Builds the current Chart Intelligence State for a symbol/timeframe and
        fires / clears deduped alerts on REAL state transitions (setup ready,
        setup stale/invalid, risk veto on/off, agent conflict, feed degraded) plus
        user price-alert crossings. Role-aware (trade-oriented alerts suppressed
        for investors), per-user, fail-open. NEVER places a trade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartAiAlertsScanRequest"
      responses:
        "200":
          description: Scan result (fired + cleared alert types)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartAiAlertsScanResponse"
        "400":
          description: Invalid body
        "401":
          description: Unauthorized

  /admin/chart/benchmark:
    get:
      operationId: getAdminChartBenchmark
      tags: [admin]
      summary: Chart Brain benchmark scorecard across users (Chart Brain v2 L6)
      description: |
        Admin/OWNER aggregation of REAL decision receipts, outcomes, and
        agent-governance traces into 15 benchmark scores plus trend, weak areas,
        recent failed reads, successful no-trades, and speed/feed warnings. No
        fabricated scores — a dimension is null when there is not enough real
        evidence. Requires an ADMIN/OWNER session (admin-previewing-as-user is
        downgraded and refused). Read-only.
      parameters:
        - name: windowDays
          in: query
          schema: { type: integer, minimum: 1, maximum: 90, default: 30 }
      responses:
        "200":
          description: Benchmark scorecard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartBenchmarkResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (not an admin/owner session)

  /market/historical-analysis:
    post:
      operationId: postMarketHistoricalAnalysis
      tags: [data]
      summary: Same-time historical comparison (yesterday / week / month / year / 5y)
      description: |
        Read-only. Returns a same-time comparison pack for a symbol/timeframe,
        with a sample-size-honest directional bias and explicit unavailable
        windows when history does not span back far enough. Never fabricates
        candles, never places trades, never mutates safety state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoricalAnalysisRequest"
      responses:
        "200":
          description: Historical comparison result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalAnalysisResult"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }

  /market/news-intelligence:
    post:
      operationId: postMarketNewsIntelligence
      tags: [data]
      summary: Normalized news + event risk pack for a symbol
      description: |
        Read-only. Returns a normalized news-intelligence pack fusing recent
        headlines (real provider when configured), upcoming economic events,
        and per-symbol news-risk scoring. When a feed is unavailable the
        response says so honestly — never fabricates headlines or events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol]
              properties:
                symbol: { type: string, minLength: 1, maxLength: 64 }
      responses:
        "200":
          description: News intelligence pack
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsIntelligencePack"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }

  /trade-management/{id}/snapshot:
