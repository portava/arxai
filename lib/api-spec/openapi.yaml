                  disclaimer:                 { type: string }

  /paper/demo-execution/queue:
    post:
      operationId: queueDemoExecutionOrder
      tags: [paperIntelligence]
      summary: Queue a single DEMO_MARKET_ORDER (max 0.01 lot, demo accounts only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [symbol, side, volume, demoOnly, executionMode]
              properties:
                symbol:        { type: string }
                side:          { type: string, enum: [BUY, SELL] }
                volume:        { type: number, maximum: 0.01, exclusiveMinimum: 0 }
                stopLoss:      { type: number, minimum: 0 }
                takeProfit:    { type: number, minimum: 0 }
                reason:        { type: string }
                demoOnly:      { type: boolean, enum: [true] }
                executionMode: { type: string, enum: [DEMO_ONLY, READ_ONLY_WITH_DEMO_EXECUTION] }
      responses:
        "200":
          description: Demo order queued
          content:
            application/json:
              schema:
                type: object
                required: [queued, action, demoOnly, maxDemoLot, executionMode, placementLayer, liveExecutionEnabled, disclaimer]
                properties:
                  queued:               { type: boolean }
                  commandId:            { type: integer }
                  action:               { type: string, enum: [DEMO_MARKET_ORDER] }
                  demoOnly:             { type: boolean }
                  maxDemoLot:           { type: number }
                  executionMode:        { type: string, enum: [READ_ONLY] }
                  placementLayer:       { type: string, enum: [BROKER_PLACEMENT_LAYER_NOT_IMPLEMENTED] }
                  liveExecutionEnabled: { type: boolean }
                  disclaimer:           { type: string }
        "400":
          description: Validation rejected — BLOCKED_DEMO_SAFETY_GUARD
          content: { application/json: { schema: { type: object, required: [status, reason], properties: { status: { type: string, enum: [BLOCKED_DEMO_SAFETY_GUARD] }, reason: { type: string } } } } }
        "403":
          description: BLOCKED_READ_ONLY_MODE (real account) or BLOCKED_DEMO_SAFETY_GUARD (server disabled)
          content: { application/json: { schema: { type: object, required: [status, reason], properties: { status: { type: string, enum: [BLOCKED_READ_ONLY_MODE, BLOCKED_DEMO_SAFETY_GUARD] }, reason: { type: string } } } } }
        "409":
          description: Bridge offline / account type unknown
          content: { application/json: { schema: { type: object, required: [status, reason], properties: { status: { type: string, enum: [BLOCKED_DEMO_SAFETY_GUARD] }, reason: { type: string } } } } }

