    ChartDecisionOutcomeCreateResponse:
      type: object
      required: [outcome, safetyMode, liveLocked, readOnlyMode, allowOrderExecution]
      properties:
        outcome: { $ref: "#/components/schemas/ChartDecisionOutcomeView" }
        safetyMode: { type: string, enum: [paper_only] }
        liveLocked: { type: boolean }
        readOnlyMode: { type: boolean }
        allowOrderExecution: { type: boolean }

    ChartSimilarSetupsRequest:
      type: object
