      # currency strength, risk regime, pair bias and confidence are WITHHELD
      # rather than estimated. The fabricated scalars that used to live here
      # (riskSentiment from a Math.random coin flip, strengths from a jittered
      # hardcoded table) are removed from the contract so they cannot quietly
      # return and still validate. `session` is retained: it is derived from the
      # UTC clock, so it is a fact, not a market reading.
      required: [providerConnected, safetyNote, session, currencies, pairs]
      properties:
        providerConnected: { type: boolean }
        safetyNote: { type: string }
        session: { type: string }
        currencies:
          type: array
