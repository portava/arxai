  # ── Ruby Market Timing Brain (Task #220) ──────────────────────────────────
  # Advisory only — never an execution gate.

  /me/timing-brain/{symbol}:
    get:
      operationId: getTimingBrain
      tags: [timingBrain]
      summary: Get timing brain read for a single symbol
      description: >
        Returns a MarketTimingRead: heat score, tradeability, edge, danger,
        trap probability, room-to-move, buy/sell pressure, timing grade,
        entry permission, best action, session/kill-zone, news overlay, and
        broad-flow cross-asset context. All scores are advisory only and
        never gate live or demo execution.
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: timeframe
          required: false
          schema:
            type: string
            enum: [M1, M5, M15, M30, H1, H4, D1]
            default: M15
        - in: query
          name: tz
          required: false
          schema: { type: string }
          description: IANA timezone (e.g. "Europe/London") for local time in session result
      responses:
        "200":
          description: Timing brain read
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarketTimingRead" }
        "400":
          description: Invalid symbol
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /me/timing-brain:
    get:
      operationId: getTimingBrainMulti
      tags: [timingBrain]
      summary: Get timing brain reads for multiple symbols
      description: >
        Fan-out read for up to 6 symbols. Pass symbols as a comma-separated
        query string. Returns { results: MarketTimingRead[] } — fail-open per
        symbol (a failing symbol is omitted rather than aborting the whole response).
        Advisory only — never an execution gate.
      parameters:
        - in: query
          name: symbols
          required: true
          schema: { type: string }
          description: Comma-separated symbol list, e.g. "EURUSD,GBPUSD,XAUUSD"
        - in: query
          name: timeframe
          required: false
          schema:
            type: string
            enum: [M1, M5, M15, M30, H1, H4, D1]
            default: M15
        - in: query
          name: tz
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Multi-symbol timing reads
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MultiTimingBrainResp" }
        "400":
          description: No valid symbols provided
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "401":
          description: Authentication required

  /admin/timing-brain/snapshots:
    get:
      operationId: listAdminTimingBrainSnapshots
      tags: [adminTimingBrain]
      summary: List persisted timing-brain heat snapshots (admin/owner only)
      description: >
        Paginated time-series of persisted MarketTimingRead snapshots from the
        heat_snapshots table, optionally filtered by symbol. Newest first.
        ADMIN/OWNER only. Read-only — never an execution gate.
      parameters:
        - in: query
          name: symbol
          required: false
          schema: { type: string, maxLength: 64 }
          description: Optional symbol filter (case-insensitive exact match).
        - in: query
          name: limit
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Snapshot history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTimingBrainSnapshotsResp" }
        "403":
          description: Admin access required
          content:
            application/json:
              schema: { type: object, required: [ok, error], properties: { ok: { type: boolean }, error: { type: string } } }

  /admin/timing-brain/retention:
    get:
      operationId: getAdminTimingBrainRetention
      tags: [adminTimingBrain]
      summary: Timing-brain heat-snapshot retention status (admin/owner only)
      description: >
        Returns the active heat_snapshots retention policy, a dry-run plan
        (what a prune would do now), the most recent prune run, and the
        automatic worker status. Read-only. ADMIN/OWNER only.
      responses:
        "200":
          description: Retention status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeatSnapshotRetentionStatusResp" }
        "403":
          description: Admin access required
          content:
            application/json:
              schema: { type: object, required: [ok, error], properties: { ok: { type: boolean }, error: { type: string } } }

  /admin/timing-brain/retention/prune:
    post:
      operationId: runAdminTimingBrainRetentionPrune
      tags: [adminTimingBrain]
      summary: Run (or dry-run) heat-snapshot retention pruning (admin/owner only)
      description: >
        Triggers the retention policy. With dryRun=true nothing is deleted —
        only the plan is returned. Every run is recorded in
        heat_snapshot_retention_runs and logged. ADMIN/OWNER only. Never deletes
        audit-critical records or decision-linked snapshots.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HeatSnapshotRetentionPruneInput" }
      responses:
        "200":
          description: Prune result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HeatSnapshotRetentionPruneResp" }
        "400":
          description: Invalid request
          content:
            application/json:
              schema: { type: object, required: [ok, error], properties: { ok: { type: boolean }, error: { type: string } } }
        "403":
          description: Admin access required
          content:
            application/json:
              schema: { type: object, required: [ok, error], properties: { ok: { type: boolean }, error: { type: string } } }

  /me/aaci/decision/{symbol}:
    get:
      operationId: getAaciDecision
      tags: [aaci]
      summary: AACI advisory cohesion verdict for a symbol (per-user, read-only)
      description: >
        Builds a Shared Truth Snapshot from existing systems (risk governor,
        broker read-only, bridge, scanner, timing brain, news, alerts, fleet)
        fail-open per source, runs the AACI cohesion engine, and returns a clean,
        plain-English advisory verdict. ADVISORY ONLY — never gates live or demo
        execution and can only ADD caution. Per-user isolated.
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: timeframe
          required: false
          schema: { type: string, enum: [M1, M5, M15, M30, H1, H4, D1], default: M15 }
        - in: query
          name: action
          required: false
          schema: { type: string, maxLength: 64, default: EVALUATE }
          description: The action the user is contemplating (advisory context only).
        - in: query
          name: strategy
          required: false
          schema:
            type: string
            enum: [flame_scalp, fast_scalp, m5_pullback, m15_setup, swing, news_first_reaction, post_news_confirmation]
        - in: query
          name: signalAgeMs
          required: false
          schema: { type: integer, minimum: 0 }
          description: Age of the signal being acted on, in ms, for edge-decay.
      responses:
        "200":
          description: Advisory cohesion verdict
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AaciUserDecision" }
        "400":
          description: Invalid symbol
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /me/aaci/cohesion:
    get:
      operationId: getAaciCohesion
      tags: [aaci]
      summary: AACI advisory cohesion for a batch of symbols (per-user, read-only)
      description: >
        Batch advisory cohesion projection for the Scanner. Each symbol is
        evaluated independently and FAILS OPEN — a symbol that cannot be read is
        omitted from the results rather than failing the batch. Returns a clean,
        plain-English projection only (verdict label, tone, confidence
        multiplier) — no machine codes or sub-scores. ADVISORY ONLY — never
        reorders, re-ranks, or routes anything, and emits no notifications.
        Per-user isolated.
      parameters:
        - in: query
          name: symbols
          required: true
          schema: { type: string }
          description: >
            Comma-separated symbols (max 12, deduped case-insensitively). Extra
            symbols beyond the cap are ignored.
        - in: query
          name: timeframe
          required: false
          schema: { type: string, enum: [M1, M5, M15, M30, H1, H4, D1], default: M15 }
      responses:
        "200":
          description: Advisory cohesion projections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AaciCohesionResponse" }
        "401":
          description: Authentication required
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }

  /admin/aaci/decision/{symbol}:
    get:
      operationId: getAdminAaciDecision
      tags: [adminAaci]
      summary: AACI full diagnostic decision (ADMIN/OWNER only)
      description: >
        Same cohesion engine as the per-user verdict but returns the full
        diagnostic detail (all sub-scores, validity factors, hard-gate failure
        codes, system conflicts, stale inputs, and per-system handshakes).
        ADMIN/OWNER only. Advisory — never an execution gate.
      parameters:
        - in: path
          name: symbol
          required: true
          schema: { type: string, minLength: 1, maxLength: 64 }
        - in: query
          name: timeframe
          required: false
          schema: { type: string, enum: [M1, M5, M15, M30, H1, H4, D1], default: M15 }
        - in: query
          name: action
          required: false
          schema: { type: string, maxLength: 64, default: EVALUATE }
        - in: query
          name: strategy
          required: false
          schema:
            type: string
            enum: [flame_scalp, fast_scalp, m5_pullback, m15_setup, swing, news_first_reaction, post_news_confirmation]
        - in: query
          name: signalAgeMs
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Full AACI decision detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AaciDecision" }
        "400":
          description: Invalid symbol
          content:
            application/json:
              schema: { type: object, required: [error], properties: { error: { type: string } } }
        "401":
          description: Authentication required
        "403":
          description: Admin privileges required

  /admin/aaci/decisions:
    get:
