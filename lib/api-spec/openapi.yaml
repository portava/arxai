    # ── Admin Security surfaces (Task #241) ──────────────────────────────────

    AdminSecurityComponent:
      type: object
      required: [key, label, score, known]
      properties:
        key: { type: string, description: "Weighted Security Score component key." }
        label: { type: string, description: "Plain-English, token-free label." }
        score: { type: integer, minimum: 0, maximum: 100, description: "0–100 component score (unknown components are scored 0)." }
        known: { type: boolean, description: "False when the signal could not be verified (honest UNKNOWN — scored 0, never assumed secure)." }

    AdminSecurityControlStatus:
      type: string
      description: >
        Honest tri-state-plus for a protection control. ACTIVE = verified on;
        INACTIVE = verified off; FUTURE_READY = wired but owned by a later phase;
        UNKNOWN = could not be verified.
      enum: [ACTIVE, INACTIVE, FUTURE_READY, UNKNOWN]

    AdminSecurityEncryption:
      type: object
      description: Protection/encryption status. Boolean/enum signals only — never any secret value.
      required:
        - encryptionKeyConfigured
        - secretsConfigured
        - emailProviderConfigured
        - bridgeSecretConfigured
        - tokenRedactionActive
        - auditRedactionActive
        - commandSigningStatus
        - idempotencyStatus
        - replayProtectionStatus
        - promptInjectionGuardStatus
        - memoryBoundariesStatus
      properties:
        encryptionKeyConfigured: { type: boolean, description: "True when the active encryption-at-rest key version is configured." }
        secretsConfigured: { type: boolean, description: "True when the server session/signing secret is configured." }
        emailProviderConfigured:
          type: boolean
          nullable: true
          description: "True/false when the email provider can be resolved; null when it could not be determined."
        bridgeSecretConfigured: { type: boolean, description: "True when the command-signing secret used by the MT5 bridge is configured." }
        tokenRedactionActive: { type: boolean, description: "True when the redaction self-test confirms tokens/API keys are scrubbed." }
        auditRedactionActive: { type: boolean, description: "True when secret redaction is enabled and the self-test passes." }
        commandSigningStatus: { $ref: "#/components/schemas/AdminSecurityControlStatus" }
        idempotencyStatus: { $ref: "#/components/schemas/AdminSecurityControlStatus" }
        replayProtectionStatus: { $ref: "#/components/schemas/AdminSecurityControlStatus" }
        promptInjectionGuardStatus: { $ref: "#/components/schemas/AdminSecurityControlStatus" }
        memoryBoundariesStatus: { $ref: "#/components/schemas/AdminSecurityControlStatus" }
        legacyUnencryptedDetected:
          type: boolean
          nullable: true
          description: "True/false when a legacy-plaintext scan ran; null when not scanned (honest unknown)."

    AdminSecurityAuditChain:
      type: object
      required: [valid, checked, unknownCount]
      properties:
        valid: { type: boolean, description: "True when the tamper-evident hash chain recomputes and links cleanly." }
        checked: { type: integer, minimum: 0, description: "Number of chained rows verified." }
        unknownCount: { type: integer, minimum: 0, description: "Rows written with an honest UNKNOWN hash (never a fake link)." }
        reason: { type: string, nullable: true, description: "First break reason when invalid; null when valid." }

    AdminSecurityOverview:
      type: object
      required:
        - generatedAt
        - score
        - band
        - reasons
        - criticalFloorHit
        - lockdownActive
        - unknownComponents
        - components
        - encryption
        - failedHandshakes24h
      properties:
        generatedAt: { type: string, format: date-time }
        score: { type: integer, minimum: 0, maximum: 100 }
        band: { type: string, enum: [Secure, Healthy, Watch, Degraded, Critical, Lockdown] }
        reasons: { type: array, items: { type: string } }
        criticalFloorHit: { type: boolean }
        lockdownActive: { type: boolean }
        unknownComponents: { type: array, items: { type: string } }
        components: { type: array, items: { $ref: "#/components/schemas/AdminSecurityComponent" } }
        encryption: { $ref: "#/components/schemas/AdminSecurityEncryption" }
        auditChain:
          allOf: [ { $ref: "#/components/schemas/AdminSecurityAuditChain" } ]
          nullable: true
          description: "Tamper-evident chain verification; null when it could not be computed."
        lastSecurityCheck: { type: string, format: date-time, nullable: true }
        failedHandshakes24h: { type: integer, minimum: 0 }

    AdminSecurityTimelineEvent:
      type: object
      required: [securityEventId, eventType, severity, status, createdAt]
      properties:
        securityEventId: { type: string }
        eventType: { type: string }
        severity: { type: string }
        status: { type: string }
        actorRole: { type: string, nullable: true }
        actorType: { type: string, nullable: true }
        affectedObject: { type: string, nullable: true }
        message: { type: string, nullable: true, description: "Already redacted before write." }
        redactionStatus: { type: string, nullable: true }
        securityLevel: { type: string, nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }

    AdminSecurityTimeline:
      type: object
      required: [count, events]
      properties:
        count: { type: integer, minimum: 0 }
        events: { type: array, items: { $ref: "#/components/schemas/AdminSecurityTimelineEvent" } }

