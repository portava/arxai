  /bridge/v2/ingest:
    post:
      operationId: bridgeV2Ingest
      tags: [bridgeV2]
      summary: >-
        ARX Bridge v2 broker-truth EVENT ingest (EA-facing). Per-user bridge
        token only; telemetry/truth + dedupe — never an execution path.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: A single Bridge v2 message or a batch under `messages`.
              additionalProperties: true
      responses:
        "200":
          description: Per-message ingest outcomes
          content:
            application/json:
              schema:
                type: object
                required: [ok, received, accepted, results]
                properties:
                  ok: { type: boolean }
                  received: { type: integer }
                  accepted: { type: integer }
                  results:
                    type: array
                    items:
                      type: object
                      required: [accepted, outcome]
                      properties:
                        accepted: { type: boolean }
                        outcome: { type: string }
                        messageType: { type: string, nullable: true }
                        sequenceVerdict: { type: string, nullable: true }
                        gapSize: { type: integer, nullable: true }
                        transportLatencyMs: { type: integer, nullable: true }
                        freshnessVerdict: { type: string, nullable: true }
                        lifecycleState: { type: string, nullable: true }
                        detail: { type: string, nullable: true }

  /bridge/v2/config:
    get:
      operationId: getBridgeV2Config
      tags: [bridgeV2]
      summary: >-
        ARX Bridge v2 remote-config manifest (EA-facing). Per-user bridge token
        only. `executionAllowed` is the honest AND of the stored admin flag and
        the server master switch (env AND db); it never overrides local EA ARM.
      responses:
        "200":
          description: The EA's versioned config manifest
          content:
            application/json:
              schema:
                type: object
                required: [ok, configVersion, executionAllowed, maxLiveLot]
                properties:
                  ok: { type: boolean }
                  configVersion: { type: integer }
                  executionAllowed:
                    type: string
                    description: '"true" or "false" — string so the EA can string-compare.'
                  maxLiveLot: { type: number }
                  tunables: { type: object, additionalProperties: true }
                  lastAckedVersion: { type: integer, nullable: true }

  /bridge/v2/commands:
    get:
      operationId: getBridgeV2Commands
      tags: [bridgeV2]
      summary: >-
        ARX Bridge v2 whitelisted-command channel (EA-facing). Per-user bridge
        token only. PURE READ-PROJECTION of already-16-gated arx_live_commands
        (status SENT_TO_MT5_LIVE); never originates or mutates a trade.
      responses:
        "200":
          description: Dispatched-not-yet-resolved live commands for this bridge
          content:
            application/json:
              schema:
                type: object
                required: [ok, count, commands]
                properties:
                  ok: { type: boolean }
                  count: { type: integer }
                  commands:
                    type: array
                    items:
                      type: object
                      required:
                        [arxCommandId, action, symbol, side, volume, stopLoss,
                         takeProfit, createdAtEpoch, confirmedByUser]
                      properties:
                        arxCommandId: { type: string }
                        action:
                          type: string
                          enum: [OPEN_MARKET, CLOSE_POSITION]
                        symbol: { type: string }
                        side: { type: string, enum: [BUY, SELL] }
                        volume: { type: number }
                        stopLoss: { type: number }
                        takeProfit: { type: number }
                        brokerTicket: { type: string, nullable: true }
                        createdAtEpoch: { type: integer }
                        confirmedByUser: { type: boolean }

