    # ── ARX Handshake System — advisory cross-layer readiness ───────────────
    HandshakeLayerCheckView:
      type: object
      required: [layer, status, required, detail, ageMs]
      properties:
        layer: { type: string }
        status: { type: string, enum: [PASS, WARN, FAIL, SKIPPED, NOT_AVAILABLE] }
        required: { type: boolean }
        detail: { type: string }
        ageMs: { type: ["integer", "null"] }
    HandshakeFreshnessView:
      type: object
      required: [evaluatedAt, oldestSignalAgeMs, hasStaleSignal]
      properties:
        evaluatedAt: { type: string }
        oldestSignalAgeMs: { type: ["integer", "null"] }
        hasStaleSignal: { type: boolean }
    HandshakePermissionsView:
      type: object
      required: [adminOnly, investorScoped, executionCritical]
      properties:
        adminOnly: { type: boolean }
        investorScoped: { type: boolean }
        executionCritical: { type: boolean }
    HandshakeVerdictView:
      type: object
      required:
        [type, label, overallStatus, aggregateStatus, safeToProceed,
         implemented, checks, layersChecked, blockers, warnings,
         recommendations, permissions, freshness, userFacingMessage,
         adminDetails, evaluatedAt]
      properties:
        type: { type: string }
        label: { type: string }
        overallStatus:
          type: string
          enum: [READY, READY_WITH_WARNINGS, WAITING_FOR_DATA, STALE, DEGRADED, BLOCKED, ERROR]
        aggregateStatus: { type: string, enum: [PASS, WARN, BLOCK, UNKNOWN] }
        safeToProceed: { type: boolean }
        implemented: { type: boolean }
        checks:
          type: array
          items: { $ref: "#/components/schemas/HandshakeLayerCheckView" }
        layersChecked:
          type: array
          items: { $ref: "#/components/schemas/HandshakeLayerCheckView" }
        blockers:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
        recommendations:
          type: array
          items: { type: string }
        permissions: { $ref: "#/components/schemas/HandshakePermissionsView" }
        freshness: { $ref: "#/components/schemas/HandshakeFreshnessView" }
        userFacingMessage: { type: string }
        adminDetails: { type: string }
        evaluatedAt: { type: string }
    HandshakeCheckinView:
      type: object
      required: [id, handshakeType, overall, implemented, evaluatedAt, createdAt]
      properties:
        id: { type: integer }
        handshakeType: { type: string }
        overall: { type: string }
        blockingReasons:
          type: ["array", "null"]
          items: { type: string }
        warnings:
          type: ["array", "null"]
          items: { type: string }
        implemented: { type: boolean }
        evaluatedAt: { type: string }
        createdAt: { type: string }
    HandshakeMonitorSummaryView:
      type: object
      required: [total, implemented, ready, warnings, waiting, blocked, errors]
      properties:
        total: { type: integer }
        implemented: { type: integer }
        ready: { type: integer }
        warnings: { type: integer }
        waiting: { type: integer }
        blocked: { type: integer }
        errors: { type: integer }
    HandshakeMonitorResponse:
      type: object
      required: [ok, verdicts, recent, summary]
      properties:
        ok: { type: boolean }
        verdicts:
          type: array
          items: { $ref: "#/components/schemas/HandshakeVerdictView" }
        recent:
          type: array
          items: { $ref: "#/components/schemas/HandshakeCheckinView" }
        summary: { $ref: "#/components/schemas/HandshakeMonitorSummaryView" }
    HandshakeMonitorRefreshResponse:
      type: object
      required: [ok, refreshed]
      properties:
        ok: { type: boolean }
        refreshed: { type: integer }

