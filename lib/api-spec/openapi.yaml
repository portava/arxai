      summary: Calibration roll-up — predicted confidence tier vs realized accuracy by timeframe (ADMIN/OWNER)
      description: >
        Read-only roll-up over EXISTING resolved Ruby signal outcomes, grouped by
        timeframe × confidence tier. The accuracy denominator is exactly graded
        directional outcomes (WIN+LOSS); PENDING/UNRESOLVED are reported but never
        enter it. A cell whose graded sample is below `minSample` is flagged
        `insufficientSample` with null `accuracy`/`calibrationGap`. OBSERVATION
        ONLY — never an execution gate. Covers the newest 2000 matching outcomes
        (recency window), not full history.
      parameters:
        - name: userId
          in: query
          required: false
          schema: { type: integer }
        - name: symbol
          in: query
          required: false
          schema: { type: string }
        - name: fromMs
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: toMs
          in: query
          required: false
          schema: { type: integer, format: int64 }
        - name: minSample
          in: query
          required: false
          description: Minimum graded directional sample (WIN+LOSS) before a cell reports accuracy; below it the cell is flagged insufficientSample with null accuracy. Default 20.
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Calibration roll-up
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminIntelligenceCalibrationResp" }
        "400":
          description: Validation error
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RubyQualityErrorResp" }
        "403":
          description: Admin required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RubyQualityErrorResp" }

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a self-serve password reset link by email
      description: >
        Always returns the same neutral confirmation regardless of whether the
        email belongs to an account (no account enumeration). When it does, a
        hashed, single-use, time-limited reset token is issued and the reset
        link is delivered (logged in dev; production requires an email
        integration). Subject to a basic per-email/IP throttle.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForgotPasswordInput" }
      responses:
        "200":
          description: Neutral confirmation (issued or not — indistinguishable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForgotPasswordResult" }
        "400":
          description: Invalid email
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResult" }
        "429":
          description: Too many requests (throttled)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ForgotPasswordResult" }

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a single-use reset token
      description: >
        Validates the token (unused + unexpired), sets the new password,
        consumes the token (single-use), and invalidates all of the user's
        existing sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResetPasswordInput" }
      responses:
        "200":
          description: Password reset succeeded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetPasswordResult" }
        "400":
          description: Invalid or expired token, or weak password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResult" }

  /me/change-password:
    post:
      operationId: changeMyPassword
      tags: [auth]
      summary: Change the signed-in user's password
      description: >
        Authenticated password change for the logged-in user. Verifies the
        caller's current password, sets the new one, invalidates all of the
        user's other sessions, and issues a fresh session for the current
        device so the caller stays signed in. Requires a per-user session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordInput" }
      responses:
        "200":
          description: Password changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePasswordResult" }
        "400":
          description: Wrong current password, weak/identical new password, or invalid input
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResult" }
        "401":
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResult" }
        "403":
          description: Blocked by the security handshake
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResult" }
        "500":
          description: Password change failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthErrorResult" }

