    # ── ARX Native Chart — Level 1: candle data truth contract ──────────────
    ChartCandle:
      type: object
      description: >
        ARX Verified Candle — Phase 1 truth contract. Every bar carries the full
        VerifiedCandle shape: identity, OHLCV, source metadata, quality flags, and
        completion status. Quality flags are advisory; flagged bars are never dropped.
      required:
        [symbol, displaySymbol, timeframe, openTime, closeTime, open, high, low,
         close, volume, tickVolume, source, isComplete, isForming,
         sourceMode, priceBasis, isFinal, receivedAt, qualityFlags]
      properties:
        symbol: { type: string, description: ARX-canonical symbol }
        displaySymbol: { type: string, description: Friendly display name }
        timeframe: { type: string, enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1] }
        openTime: { type: string, description: ISO 8601 bar open time }
        closeTime: { type: string, description: ISO 8601 bar close time }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number, description: Real traded volume when the provider supplies it, else 0 }
        tickVolume:
          type: ["number", "null"]
          description: Verified tick count when a provider supplies one; null otherwise (e.g. synthetic indices / current REST adapters)
        source: { type: string, description: Provider id that served this bar }
        isComplete: { type: boolean, description: false for the still-forming most-recent bar }
        isForming:
          type: boolean
          description: >
            Task #496 — true ONLY for a server-synthesized real-time tip composed
            from live EA ticks (isComplete=false, isFinal=false). A closed provider
            bar is isForming=false. Analysis / Ruby / chart-intelligence exclude
            isForming bars (closed-bars-only); the tip is display telemetry, never
            persisted and never an execution input.
        # ── Phase 1: VerifiedCandle extension ─────────────────────────────────
        sourceMode:
          type: string
          enum: [live, demo, mock, dev, unknown]
          description: >
            live = real market data; demo = MT5 demo bridge context; mock = simulation
            provider (never safe as tradable truth); dev = developer test data;
            unknown = unrecognized source.
        priceBasis:
          type: string
          enum: [BID, MID, LAST, SYNTHETIC, UNKNOWN]
          description: >
            BID = MT5 broker bid-based bars; MID = bid-ask midpoint (forex/metals REST);
            LAST = exchange last price (indices/stocks/crypto); SYNTHETIC = Deriv
            volatility algorithm; UNKNOWN = provider not identified.
        isFinal:
          type: boolean
          description: Alias for isComplete. true when the bar's bucket is closed and will not be updated.
        receivedAt:
          type: string
          description: ISO 8601 timestamp when this batch was fetched from the provider.
        providerSymbol:
          type: ["string", "null"]
          description: The provider's own symbol string when it differs from the ARX canonical form; null when the provider uses the same symbol.
        brokerSymbol:
          type: ["string", "null"]
          description: MT5 broker-facing symbol when source is mt5_broker; null for all other sources.
        qualityFlags:
          type: array
          description: >
            Advisory per-candle quality indicators. Multiple flags may appear on one bar.
            Bars are NEVER dropped — flags are purely informational.
            OHLC_INVALID: high < low or open/close outside high/low.
            TIMESTAMP_INVALID: bar timestamp unparseable.
            OUTLIER_SPIKE: single-bar move far beyond neighboring bars.
            OUTLIER_WICK: wick-to-range ratio extreme for this asset class (D1/H4 only).
            ZERO_VOLUME_GHOST: zero volume on a non-synthetic bar.
            HISTORICAL_PERIOD_SHIFT: bar from a different price epoch (e.g. real 2023
              XAUUSD history at ~$2000 while current price is ~$4300 — legitimate
              history, not a bad tick; chart Y-axis may need to auto-scale).
            FORMING_BAR: bar is still open (closeTime in the future).
            MOCK_DATA: bar originated from a mock/simulation provider.
            DUPLICATE_BUCKET: another bar at this openTime was collapsed.
            STALE_FROM_PREV_TF: large gap before this bar suggests a timeframe carry-over.
          items:
            type: string
            enum:
              [OHLC_INVALID, TIMESTAMP_INVALID, OUTLIER_SPIKE, OUTLIER_WICK,
               ZERO_VOLUME_GHOST, HISTORICAL_PERIOD_SHIFT, FORMING_BAR, MOCK_DATA,
               DUPLICATE_BUCKET, STALE_FROM_PREV_TF]

    ChartFeedStatus:
      type: object
      required:
        [symbol, displaySymbol, assetClass, source, isLive, lastTickTime,
         lastCandleTime, latencyMs, missingCandleCount, duplicateCount,
         outOfOrderCount, invalidOhlcCount, trailingIntervals, stale, quality,
         warning, aiUsable, message]
      properties:
        symbol: { type: string }
        displaySymbol: { type: string }
        assetClass: { type: string, enum: [synthetic, forex, metals, indices, crypto, stocks, unknown] }
        source: { type: ["string", "null"], description: Winning provider id, or null when no feed served data }
        isLive: { type: boolean }
        lastTickTime: { type: ["string", "null"] }
        lastCandleTime: { type: ["string", "null"] }
        latencyMs: { type: ["number", "null"] }
        missingCandleCount: { type: integer }
        duplicateCount: { type: integer }
        outOfOrderCount: { type: integer }
        invalidOhlcCount: { type: integer }
        trailingIntervals:
          type: ["integer", "null"]
          description: >
            How many timeframe bar-intervals the newest bar lags behind the
            current expected bar. clean <= 1, delayed = 2, stale >= 3. null when
            the gap is unknown (no candles). Drives the staleness verdict, so
            surfacing it shows operators HOW MANY recent intervals are missing.
        stale: { type: boolean }
        quality:
          type: string
          enum: [clean, delayed, stale, partial, invalid, empty, unavailable]
        warning: { type: ["string", "null"] }
        aiUsable: { type: boolean, description: true only when quality is clean }
        feedReadinessState:
          type: ["string", "null"]
          description: Deriv synthetic warm-up lifecycle state when applicable
        message: { type: string }

    ChartMergeSeamReport:
      type: object
      description: >
        Historical + live seam analysis (Step 7). Reports the boundary between the
        last CLOSED bar and the FORMING bar. Identifies gaps and overlaps at the merge
        point so callers can detect missing/duplicate bars at the live edge.
      required:
        [formingBarDetected, formingBarCount, gapAtSeam, overlapAtSeam, seamGapIntervals]
      properties:
        formingBarDetected: { type: boolean, description: true when the last bar(s) are still forming (closeTime in the future) }
        formingBarCount: { type: integer, description: Number of still-forming bars at the trailing edge of the array }
        gapAtSeam: { type: boolean, description: true when there is a gap between the last closed bar and the first forming bar }
        overlapAtSeam: { type: boolean, description: true when the forming bar's open time overlaps the last closed bar }
        seamGapIntervals: { type: integer, description: Number of missing bar intervals at the seam (0 when no gap) }

    ChartCandleTruthResult:
      type: object
      description: >
        ARX Candle Truth Engine — Phase 1 structured per-timeframe audit result.
        Returned alongside every chart candle response. Covers Steps 1–9 of the
        mission: source documentation, OHLC integrity, outlier detection (including
        the 1D XAUUSD historical-period-shift finding), timeframe audit, merge-seam
        verification, mock detection, and symbol profile metadata.
        Assessment CLEAN = all checks passed; PARTIAL = sequence anomalies or
        insufficient history; STALE = feed lagging; DEGRADED = mock/invalid data;
        UNAVAILABLE = no candles returned.
      required:
        [timeframe, symbol, assetClass, source, sourceMode, priceBasis,
         ohlcSourceType, providerDeliversRealOhlc,
         bucketDurationSeconds, historyWindowRequested, candleCount,
         historyDepthHours, oldestBarTime, newestBarTime, historyMinimumMet,
         formingCandlePresent, formingCandleOhlc,
         duplicateCount, missingCandleCount, outOfOrderCount, invalidOhlcCount,
         precisionViolationCount,
         outlierSpikeCount, outlierWickCount, zeroVolumeGhostCount, historicalPeriodShiftCount,
         mockDataDetected, mockDataAdminReason,
         mergeSeam,
         pricePrecision, pipSize, allowedTimeframes, sessionAlwaysOpen, sessionNote,
         assessment, assessmentReasons, sourceDocumentation]
      properties:
        timeframe: { type: string, enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1] }
        symbol: { type: string }
        assetClass: { type: string, enum: [synthetic, forex, metals, indices, crypto, stocks, unknown] }
        source: { type: ["string", "null"] }
        sourceMode: { type: string, enum: [live, demo, mock, dev, unknown] }
        priceBasis: { type: string, enum: [BID, MID, LAST, SYNTHETIC, UNKNOWN] }
        ohlcSourceType:
          type: string
          enum: [true_ohlc, tick_aggregated, line_only, unknown]
          description: Whether the provider returns real OHLC bars (true_ohlc), builds them from ticks (tick_aggregated), or only has a price line (line_only).
        providerDeliversRealOhlc: { type: boolean }
        # Timeframe metadata (Step 6)
        bucketDurationSeconds: { type: integer, description: Expected bar duration in seconds for this timeframe }
        historyWindowRequested: { type: integer, description: How many candles were requested }
        candleCount: { type: integer, description: How many candles were actually returned }
        historyDepthHours: { type: ["number", "null"], description: Span from oldest to newest bar in hours }
        oldestBarTime: { type: ["string", "null"], description: ISO 8601 open time of the oldest bar }
        newestBarTime: { type: ["string", "null"], description: ISO 8601 open time of the newest bar }
        historyMinimumMet: { type: boolean, description: true when candleCount meets the recommended minimum (>=150 for intraday; >=50 for D1) }
        # Forming candle (Step 6)
        formingCandlePresent: { type: boolean, description: true when the trailing bar is still forming (not yet closed) }
        formingCandleOhlc:
          description: OHLC of the forming bar, or null when none
          oneOf:
            - type: object
              required: [open, high, low, close]
              properties:
                open: { type: number }
                high: { type: number }
                low: { type: number }
                close: { type: number }
            - type: "null"
        # Integrity (Step 4)
        duplicateCount: { type: integer, description: Bars with the same openTime that were collapsed (provider returned duplicates) }
        missingCandleCount: { type: integer, description: Expected bars absent from the sequence (gaps) }
        outOfOrderCount: { type: integer, description: Bars delivered out of ascending-time order by the provider }
        invalidOhlcCount: { type: integer, description: Bars with high < low or open/close outside high/low range, or with an unparseable timestamp (dropped from output) }
        precisionViolationCount:
          type: integer
          description: >
            Bars whose price decimal-place count is inconsistent with the symbol's
            stated pricePrecision. Non-zero indicates a provider returning data at the
            wrong scale (e.g. integer pips instead of decimal prices, or excess float
            noise digits). 0 when symbol profile precision is unavailable.
        # Outliers (Step 8)
        outlierSpikeCount: { type: integer, description: Bars with a spike-like price move far beyond neighbors }
        outlierWickCount: { type: integer, description: Bars with abnormal wick-to-range ratio (D1/H4 only) }
        zeroVolumeGhostCount: { type: integer, description: Non-synthetic bars with zero volume (data gap signal) }
        historicalPeriodShiftCount:
          type: integer
          description: >
            Bars from a significantly different price epoch. For XAUUSD: D1 bars near
            ~$1900–$2100 are REAL 2023 historical data (pre-rally), NOT bad ticks.
            Flag is advisory — bars are real history; chart Y-axis auto-scale is Phase 2.
        # Mock detection (Steps 4, 5)
        mockDataDetected: { type: boolean, description: true when source is a mock/simulation provider — data is not safe as tradable truth }
        mockDataAdminReason: { type: ["string", "null"], description: Admin-only reason string explaining which provider is mocked. Never shown to end users. }
        # Merge seam (Step 7)
        mergeSeam: { $ref: "#/components/schemas/ChartMergeSeamReport" }
        # Symbol profile (Step 9)
        pricePrecision: { type: ["integer", "null"], description: Decimal places for this symbol's prices from the symbol profile directory }
        pipSize: { type: ["number", "null"], description: Smallest tradeable price unit (pip/point) for this symbol }
        allowedTimeframes:
          type: array
          items: { type: string, enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1] }
          description: Timeframes supported for this symbol and asset class
        sessionAlwaysOpen: { type: boolean, description: true for 24/7 markets (synthetics, crypto); false for session-based markets (forex, stocks, indices) }
        sessionNote: { type: ["string", "null"], description: Human-readable market session description }
        # Assessment
        assessment:
          type: string
          enum: [CLEAN, PARTIAL, STALE, DEGRADED, UNAVAILABLE]
          description: Overall data quality verdict for this timeframe
        assessmentReasons:
          type: array
          items: { type: string }
          description: Ordered list of reasons behind the assessment (empty when CLEAN)
        # Source documentation (Steps 1, 2)
        sourceDocumentation:
          type: object
          description: Documented candle source characteristics for the asset class (Steps 1–2 of the mission)
          required: [dataMode, priceBasisNote, updateMethod, freshnessNote, supportedTimeframes, knownLimitations]
          properties:
            dataMode: { type: string }
            priceBasisNote: { type: string }
            updateMethod: { type: string }
            freshnessNote: { type: string }
            supportedTimeframes:
              type: array
              items: { type: string }
            knownLimitations:
              type: array
              items: { type: string }

    # ── Phase 3: Chart Truth Score, Chart Read Score, Gate Output, Broker Alignment ──

    ChartTruthSubMetric:
      type: object
      description: A single weighted sub-metric contributing to the Chart Truth Score.
      required: [key, label, weight, rawScore, weightedScore, detail]
      properties:
        key: { type: string }
        label: { type: string }
        weight: { type: number, description: Contribution weight (0–1, sum=1.0) }
        rawScore: { type: number, description: Raw 0–100 score for this sub-metric }
        weightedScore: { type: number, description: rawScore × weight }
        detail: { type: string, description: Plain-language explanation of the score }

    ChartTruthScore:
      type: object
      description: |
        Weighted 10-sub-metric score (0–100) answering "is the data real, fresh,
        correctly mapped/timed/mirrored/rendered?" Derived entirely from Phase 1
        signals — never fabricated.
        Labels: Verified (95–100), Healthy (85–94), Usable-but-watch (75–84),
        Degraded (60–74), Read-blocked (<60).
      required: [score, label, subMetrics, primaryConcern, note]
      properties:
        score: { type: number, description: Aggregate weighted 0–100 score }
        label:
          type: string
          enum: [Verified, Healthy, Usable-but-watch, Degraded, Read-blocked]
        subMetrics:
          type: array
          items: { $ref: "#/components/schemas/ChartTruthSubMetric" }
        primaryConcern: { type: ["string", "null"], description: Worst sub-metric detail, or null when all healthy }
        note: { type: string }

    ChartReadSubMetric:
      type: object
      description: One readability dimension within the Chart Read Score.
      required: [key, label, rawScore, detail]
      properties:
        key: { type: string }
        label: { type: string }
        rawScore: { type: number, description: 0–100 raw score for this dimension }
        detail: { type: string }

    ChartReadScore:
      type: object
      description: |
        Independent 0–100 readability/tradability score. Answers "is the current
        chart setup actually readable?" — separate from data quality (Chart Truth).
        Labels: Highly Readable (90–100), Readable (75–89), Partially Readable (55–74),
        Marginal (35–54), Unreadable (<35).
      required: [score, label, subMetrics, primaryConcern, note]
      properties:
        score: { type: number }
        label:
          type: string
          enum: [Highly Readable, Readable, Partially Readable, Marginal, Unreadable]
        subMetrics:
          type: array
          items: { $ref: "#/components/schemas/ChartReadSubMetric" }
        primaryConcern: { type: ["string", "null"] }
        note: { type: string }

    BrokerPriceAlignment:
      type: object
      description: |
        Chart latest-close vs MT5 broker bid/ask alignment. User-safe message only;
        adminDetail is admin-only. Honest unknown when broker data unavailable.
      required:
        [aligned, tolerance, chartPrice, brokerBid, brokerAsk, brokerMid,
         spreadPoints, deviationPct, chartPriceBasis, userMessage,
         adminDetail, brokerDataAvailable]
      properties:
        aligned: { type: boolean, description: True when broker data available and deviation within normal tolerance }
        tolerance:
          type: string
          enum: [tight, normal, wide, failed, unknown]
        chartPrice: { type: ["number", "null"] }
        brokerBid: { type: ["number", "null"] }
        brokerAsk: { type: ["number", "null"] }
        brokerMid: { type: ["number", "null"] }
        spreadPoints: { type: ["number", "null"] }
        deviationPct: { type: ["number", "null"], description: Absolute pct deviation of chartPrice from brokerMid }
        chartPriceBasis: { type: string, description: "BID / MID / LAST / SYNTHETIC / UNKNOWN" }
        userMessage: { type: string, description: User-safe message — never contains raw deviation numbers }
        adminDetail: { type: ["string", "null"], description: Admin-only diagnostic with bid/ask/deviation; null when broker unavailable }
        brokerDataAvailable: { type: boolean }

    ChartGateOutput:
      type: object
      description: |
        Phase 3 hard gate decisions. Phase 4 consumers read these without
        re-implementing threshold logic. Never gates candle rendering or the
        live 16-gate pipeline — advisory chokepoint for chart-BASED confirmations only.
      required:
        [chartTruthScore, chartReadScore, truthLabel, readLabel,
         confidentReadAllowed, scannerConfirmAllowed, selfTradeChartAllowed,
         candlestickModeAllowed, autonomousChartActionAllowed,
         tradeConfirmationAllowed, blockedReasons, primaryBlockReason, note]
      properties:
        chartTruthScore: { type: number, description: 0–100 Chart Truth Score }
        chartReadScore: { type: number, description: 0–100 Chart Read Score }
        truthLabel: { type: string }
        readLabel: { type: string }
        confidentReadAllowed:
          type: boolean
          description: Truth ≥ 75 — required for chart-based confident reads (Ruby chart-read, Scanner chart-confirm)
        scannerConfirmAllowed:
          type: boolean
          description: Truth ≥ 75 — required for scanner chart-confirmation flag
        selfTradeChartAllowed:
          type: boolean
          description: Truth ≥ 75 — required for self-trade chart-based confirmation
        candlestickModeAllowed:
          type: boolean
          description: Provider delivers real OHLC — when false use line/area mode
        autonomousChartActionAllowed:
          type: boolean
          description: Feed not stale — required before any autonomous chart-based action
        tradeConfirmationAllowed:
          type: boolean
          description: Mirror not failed (seam + broker alignment) — required for chart entry/stop references
        blockedReasons:
          type: array
          items: { type: string }
        primaryBlockReason: { type: ["string", "null"] }
        note: { type: string }

    ChartDecisionSnapshotCandleRef:
      type: object
      required: [openTime, closeTime, close, isComplete]
      properties:
        openTime: { type: string }
        closeTime: { type: string }
        close: { type: number }
        isComplete: { type: boolean }

    ChartDecisionSnapshotPlan:
      type: object
      required: [side, entry, sl, tp]
      properties:
        side: { type: string, enum: [BUY, SELL] }
        entry: { type: number }
        sl: { type: number }
        tp: { type: ["number", "null"] }

    ChartDecisionSnapshot:
      type: object
      description: |
        Point-in-time chart decision snapshot. Captures both scores, gate state,
        broker alignment, and optional trade plan at the moment of a serious read.
        REPLAY RULE: replay must only judge with data known at capturedAt.
      required:
        [id, capturedAt, symbol, displaySymbol, timeframe, chartTruthScore,
         chartReadScore, gateOutput, brokerAlignment, verifiedCandleRef,
         plan, replayNote, source]
      properties:
        id: { type: string }
        capturedAt: { type: string }
        symbol: { type: string }
        displaySymbol: { type: string }
        timeframe: { type: string }
        chartTruthScore: { $ref: "#/components/schemas/ChartTruthScore" }
        chartReadScore: { $ref: "#/components/schemas/ChartReadScore" }
        gateOutput: { $ref: "#/components/schemas/ChartGateOutput" }
        brokerAlignment: { $ref: "#/components/schemas/BrokerPriceAlignment" }
        verifiedCandleRef:
          oneOf:
            - $ref: "#/components/schemas/ChartDecisionSnapshotCandleRef"
            - type: "null"
        plan:
          oneOf:
            - $ref: "#/components/schemas/ChartDecisionSnapshotPlan"
            - type: "null"
        replayNote: { type: string }
        source: { type: string }

    ChartCandlesResponse:
      type: object
      required:
        [symbol, displaySymbol, timeframe, assetClass, source, quality, aiUsable,
         warning, latencyMs, requestedLimit, candleCount, candles, feedStatus,
         chartTruthScore]
      properties:
        symbol: { type: string }
        displaySymbol: { type: string }
        timeframe: { type: string, enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1] }
        assetClass: { type: string, enum: [synthetic, forex, metals, indices, crypto, stocks, unknown] }
        source: { type: ["string", "null"] }
        quality:
          type: string
          enum: [clean, delayed, stale, partial, invalid, empty, unavailable]
        aiUsable: { type: boolean }
        warning: { type: ["string", "null"] }
        latencyMs: { type: ["number", "null"] }
        requestedLimit: { type: integer }
        candleCount: { type: integer }
        candles:
          type: array
          items: { $ref: "#/components/schemas/ChartCandle" }
        feedStatus: { $ref: "#/components/schemas/ChartFeedStatus" }
        truthResult:
          description: >
            Phase 1 structured per-timeframe truth audit result alongside candles.
            null when no candles were returned (unavailable/empty feed).
          oneOf:
            - $ref: "#/components/schemas/ChartCandleTruthResult"
            - type: "null"
        chartTruthScore:
          description: Phase 3 weighted Chart Truth Score derived from Phase 1 signals.
          $ref: "#/components/schemas/ChartTruthScore"

    # ── Task #432 — Deep, scrollable candle history (paginated) ──
    ChartHistoryResponse:
      type: object
      description: >
        A page of candle history with honest, non-fabricated metadata. Served
        from one coherent source; historical/stale data is never labelled live.
      required:
        [ok, symbol, timeframe, assetClass, source, candles, status,
         returnedCount, oldest, newest, hasMoreHistory, nextBefore,
         providerLimitReached, providerMessage, cacheHit, fetchedAt,
         depthTargetDays, coverageDays, depthTargetMet, userMessage]
      properties:
        ok: { type: boolean }
        symbol: { type: string }
        timeframe: { type: string, enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1] }
        assetClass: { type: string, enum: [synthetic, forex, metals, indices, crypto, stocks, unknown] }
        source:
          type: ["string", "null"]
          description: The single source this page was served from (provenance).
        candles:
          type: array
          description: Ascending by time.
          items: { $ref: "#/components/schemas/Candle" }
        status:
          type: string
          enum: [live, stale, historical_only, unavailable]
          description: >
            live/stale apply only to the newest window; a page reached via the
            `before` cursor is always historical_only; unavailable = no source/candles.
        returnedCount: { type: integer }
        oldest: { type: ["string", "null"], description: Oldest bar time in this page. }
        newest: { type: ["string", "null"], description: Newest bar time in this page. }
        hasMoreHistory: { type: boolean, description: Older bars exist (in cache or pageable from a deep-cursor provider). }
        nextBefore:
          type: ["string", "null"]
          description: Cursor to pass as `before` for the next (older) page; null when exhausted.
        providerLimitReached:
          type: boolean
          description: The provider could not reach the requested depth (honest ceiling, not truncation).
        providerMessage: { type: ["string", "null"] }
        cacheHit:
          type: boolean
          description: Served from cache without a fresh provider fetch this call.
        fetchedAt: { type: string }
        depthTargetDays: { type: integer, description: Per-timeframe deep-history target in days. }
        coverageDays: { type: ["number", "null"], description: Days between oldest and newest cached bar for this source. }
        depthTargetMet: { type: boolean }
        sourcePriorityUsed:
          type: array
          items: { type: string }
          description: The history provider chain (deepest-capable first) consulted for this asset class.
        limitationReason:
          type: ["string", "null"]
          description: Why deeper history is unavailable when a real provider ceiling was hit (null otherwise).
        userMessage: { type: string }
        adminDetail: { type: string }

    # ── Chart Brain v2 — Task 1: Chart Intelligence State (Fast/Slow Brain) ──
    ChartCandleStats:
      type: object
      description: Fast, candle-only statistics. Honest — barsAnalyzed is 0 and the numbers are null when there is no usable closed-candle window.
      required:
        [barsAnalyzed, direction, lastClose, changeAbs, changePct, range, body,
         avgRange, atr]
      properties:
        barsAnalyzed: { type: integer, description: Closed bars actually used for these stats }
        direction: { type: string, enum: [up, down, flat, unknown] }
        lastClose: { type: ["number", "null"], description: Close of the latest closed bar }
        changeAbs: { type: ["number", "null"], description: Latest closed close minus the prior closed close }
        changePct: { type: ["number", "null"] }
        range: { type: ["number", "null"], description: High minus low of the latest closed bar }
        body: { type: ["number", "null"], description: abs(close - open) of the latest closed bar }
        avgRange: { type: ["number", "null"], description: Mean high-low across analyzed bars }
        atr: { type: ["number", "null"], description: Simple ATR (mean true range) across analyzed bars }

    ChartFastFlags:
      type: object
      description: Fast candle-derived flags. populated is false when there are too few candles to derive any flag — never fabricated.
      required: [populated, momentumBurst, nearRecentHigh, nearRecentLow, note]
      properties:
        populated: { type: boolean }
        momentumBurst: { type: boolean, description: Latest closed bar range materially exceeds the recent average }
        nearRecentHigh: { type: boolean, description: Last close sits in the top band of the recent high-low range }
        nearRecentLow: { type: boolean, description: Last close sits in the bottom band of the recent high-low range }
        note: { type: ["string", "null"] }

    # ── Chart Brain v2 — Task 2: Market Understanding Engines ──────────────
    ChartTrendRead:
      type: object
      description: Deterministic trend & regime read. populated is false (scores null) when the candle window is too short — never faked.
      required: [populated, direction, regime, strength, slope, higherTimeframeBias, note]
      properties:
        populated: { type: boolean }
        direction: { type: string, enum: [bullish, bearish, ranging, mixed, unknown] }
        regime: { type: string, enum: [trending, ranging, volatile, quiet, unknown] }
        strength: { type: ["number", "null"], description: 0-100 trend strength }
        slope: { type: ["number", "null"], description: Raw SMA slope; sign carries direction }
        higherTimeframeBias: { type: string, enum: [bullish, bearish, ranging, mixed, unknown] }
        note: { type: string }

    ChartLevel:
      type: object
      description: A support/resistance level with an observed personality.
      required:
        [kind, price, personality, touchCount, rejectionCount, breakCount,
         retestCount, strengthScore, weaknessScore, trapScore, distancePct]
      properties:
        kind: { type: string, enum: [support, resistance] }
        price: { type: number }
        personality:
          type: string
          enum: [fresh, defended, weakening, broken, retest_pending, trap_zone, scalp_only, invalidated]
        touchCount: { type: integer }
        rejectionCount: { type: integer }
        breakCount: { type: integer }
        retestCount: { type: integer }
        strengthScore: { type: number, description: 0-100 }
        weaknessScore: { type: number, description: 0-100 }
        trapScore: { type: number, description: 0-100 }
        distancePct: { type: ["number", "null"], description: Signed % distance from last close }

    ChartLevelsRead:
      type: object
      description: Mapped levels with personality, folding in remembered market events. populated is false when too little data — never faked.
      required: [populated, levels, nearestSupport, nearestResistance, eventsRemembered, note]
      properties:
        populated: { type: boolean }
        levels:
          type: array
          items: { $ref: "#/components/schemas/ChartLevel" }
        nearestSupport:
          oneOf:
            - $ref: "#/components/schemas/ChartLevel"
            - type: "null"
        nearestResistance:
          oneOf:
            - $ref: "#/components/schemas/ChartLevel"
            - type: "null"
        eventsRemembered: { type: integer, description: Remembered market events folded into the read }
        note: { type: string }

    ChartCandleSignal:
      type: object
      description: Per-candle intent & pressure scores.
      required:
        [offsetFromLatest, intent, buyerScore, sellerScore, rejectionScore,
         exhaustionScore, continuationScore, trapScore, importanceScore]
      properties:
        offsetFromLatest: { type: integer, description: 0 = latest closed bar }
        intent:
          type: string
          enum: [pushing, rejecting, trapping, exhausting, absorbing, continuing, breaking_structure, failing_to_break, noise]
        buyerScore: { type: number }
        sellerScore: { type: number }
        rejectionScore: { type: number }
        exhaustionScore: { type: number }
        continuationScore: { type: number }
        trapScore: { type: number }
        importanceScore: { type: number }

    ChartCandleIntentRead:
      type: object
      description: Candle intent & pressure across recent bars. populated is false with too few bars — never faked.
      required: [populated, latestIntent, dominantPressure, signals, note]
      properties:
        populated: { type: boolean }
        latestIntent:
          type: string
          enum: [pushing, rejecting, trapping, exhausting, absorbing, continuing, breaking_structure, failing_to_break, noise]
        dominantPressure: { type: string, enum: [buyers, sellers, balanced, unknown] }
        signals:
          type: array
          items: { $ref: "#/components/schemas/ChartCandleSignal" }
        note: { type: string }

    ChartTimeframeBias:
      type: object
      required: [timeframe, bias, available, stale]
      properties:
        timeframe: { type: string }
        bias: { type: string, enum: [bullish, bearish, ranging, mixed, unknown] }
        available: { type: boolean }
        stale: { type: boolean }

    ChartTimeframeAgreement:
      type: object
      description: Multi-timeframe bias agreement, computed in the background (Slow Brain). populated is false until the first background compute — never blocks and never faked.
      required: [populated, agreementScore, alignedDirection, scalpOnlyWarning, timeframes, computedAt, note]
      properties:
        populated: { type: boolean }
        agreementScore: { type: ["number", "null"], description: 0-100 }
        alignedDirection: { type: string, enum: [bullish, bearish, ranging, mixed, unknown] }
        scalpOnlyWarning: { type: boolean, description: Lower and higher timeframes conflict }
        timeframes:
          type: array
          items: { $ref: "#/components/schemas/ChartTimeframeBias" }
        computedAt: { type: ["string", "null"], description: ISO of last background compute }
        note: { type: string }

    ChartEvidenceItem:
      type: object
      required: [text, weight, source]
      properties:
        text: { type: string }
        weight: { type: number, description: 0-100 }
        source: { type: string, description: Engine that produced it }

    ChartContradiction:
      type: object
      required: [text, severity]
      properties:
        text: { type: string }
        severity: { type: string, enum: [low, medium, high] }

    ChartEvidenceRead:
      type: object
      description: Weighted evidence for/against the bias plus explicit contradictions. All text derives from real engine output — never invented.
      required: [populated, direction, evidenceFor, evidenceAgainst, contradictions, note]
      properties:
        populated: { type: boolean }
        direction: { type: string, enum: [bullish, bearish, neutral, unknown] }
        evidenceFor:
          type: array
          items: { $ref: "#/components/schemas/ChartEvidenceItem" }
        evidenceAgainst:
          type: array
          items: { $ref: "#/components/schemas/ChartEvidenceItem" }
        contradictions:
          type: array
          items: { $ref: "#/components/schemas/ChartContradiction" }
        note: { type: string }

    ChartReadinessGate:
      type: object
      required: [key, label, passed, score, detail]
      properties:
        key: { type: string }
        label: { type: string }
        passed: { type: boolean }
        score: { type: number, description: 0-100 contribution }
        detail: { type: string }

    ChartReadinessRead:
      type: object
      description: Trade-readiness gates with a 0-100 score and an A+/A/B/C/D/F label. Mandatory downgrades veto bad data, late entry, or high-severity contradictions — never optimistic.
      required: [populated, score, quality, gates, vetoed, vetoReason, note]
      properties:
        populated: { type: boolean }
        score: { type: ["number", "null"], description: 0-100 }
        quality: { type: string, enum: ["A+", "A", "B", "C", "D", "F", unrated] }
        gates:
          type: array
          items: { $ref: "#/components/schemas/ChartReadinessGate" }
        vetoed: { type: boolean }
        vetoReason: { type: ["string", "null"] }
        note: { type: string }

    ChartMarketUnderstanding:
      type: object
      description: Container of the deterministic market-understanding engine outputs. populated is false when the candle window is too short; sub-engine fields stay honest.
      required:
        [populated, trend, levels, candleIntent, timeframeAgreement, evidence,
         readiness, note]
      properties:
        populated: { type: boolean }
        trend: { $ref: "#/components/schemas/ChartTrendRead" }
        levels: { $ref: "#/components/schemas/ChartLevelsRead" }
        candleIntent: { $ref: "#/components/schemas/ChartCandleIntentRead" }
        timeframeAgreement: { $ref: "#/components/schemas/ChartTimeframeAgreement" }
        evidence: { $ref: "#/components/schemas/ChartEvidenceRead" }
        readiness: { $ref: "#/components/schemas/ChartReadinessRead" }
        note: { type: string }

    ChartSetupState:
      type: object
      description: Setup lifecycle & decay. The reachable stages are the chart-observable subset; trade_active→review require a live trade (out of scope) and are never asserted here. Honest — no setup when there is no edge.
      required:
        [populated, hasActiveSetup, stage, tradeType, direction, freshness,
         decayScore, ageBars, expiresInBars, invalidationCondition,
         invalidationPrice, note]
      properties:
        populated: { type: boolean }
        hasActiveSetup: { type: boolean }
        stage:
          type: string
          enum: [no_setup, idea_forming, watchlist, trigger, confirmation_needed, entry_valid, trade_active, management, exit, review, stale, invalid]
        tradeType: { type: string, enum: [scalp, intraday, structure, unknown] }
        direction: { type: string, enum: [bullish, bearish, none, unknown] }
        freshness: { type: ["number", "null"], description: 0-100 }
        decayScore: { type: ["number", "null"], description: 0-100 (higher = more decayed) }
        ageBars: { type: ["integer", "null"] }
        expiresInBars: { type: ["integer", "null"] }
        invalidationCondition: { type: ["string", "null"] }
        invalidationPrice: { type: ["number", "null"] }
        note: { type: string }

    ChartDecisionState:
      type: object
      description: Read-only summary of the engine outputs (bias + quality + actionability). NOT a decision/fork engine and the chart never executes from this state.
      required: [populated, bias, quality, actionability, vetoed, decision, note]
      properties:
        populated: { type: boolean }
        bias: { type: string, enum: [bullish, bearish, neutral, unknown] }
        quality: { type: string, enum: ["A+", "A", "B", "C", "D", "F", unrated] }
        actionability: { type: string, enum: [stand_aside, watch, prepare, ready, unknown] }
        vetoed: { type: boolean }
        decision: { type: ["string", "null"] }
        note: { type: string }

    ChartMarketSentence:
      type: object
      description: A single deterministic, plain-language sentence derived from the chart intelligence state. Display text only — never an execution instruction.
      required: [key, label, text, tone]
      properties:
        key: { type: string, description: Stable id for the sentence }
        label: { type: string, description: Short human label }
        text: { type: string, description: The plain-language sentence }
        tone: { type: string, enum: [bullish, bearish, neutral, caution, danger, info] }

    ChartMarketSentences:
      type: object
      description: Natural-language reader over the chart intelligence state. Deterministic and honest — when an engine is not populated the relevant sentence says so plainly rather than fabricating a read.
      required:
        [populated, market, proving, failedToProve, risk, entryTiming, scalp,
         bestNextAction, whatWouldChange, whatInvalidates, signalFreshness, note]
      properties:
        populated: { type: boolean, description: True only when the market-understanding engines are populated }
        market: { $ref: "#/components/schemas/ChartMarketSentence" }
        proving: { $ref: "#/components/schemas/ChartMarketSentence" }
        failedToProve: { $ref: "#/components/schemas/ChartMarketSentence" }
        risk: { $ref: "#/components/schemas/ChartMarketSentence" }
        entryTiming: { $ref: "#/components/schemas/ChartMarketSentence" }
        scalp: { $ref: "#/components/schemas/ChartMarketSentence" }
        bestNextAction: { $ref: "#/components/schemas/ChartMarketSentence" }
        whatWouldChange: { $ref: "#/components/schemas/ChartMarketSentence" }
        whatInvalidates: { $ref: "#/components/schemas/ChartMarketSentence" }
        signalFreshness: { $ref: "#/components/schemas/ChartMarketSentence" }
        note: { type: string }

    ChartSpeedState:
      type: object
      description: Chart speed architecture instrumentation. Fast Brain produces the request-path state; Slow Brain runs only in the background and never on the live-execution path.
      required:
        [activeMode, brain, feedLatencyMs, stateBuildMs, renderLatencyMs,
         overlayLatencyMs, slowBrainBlockedLiveExecution, slowBrainLastRunAt]
      properties:
        activeMode: { type: string, description: Active chart mode label (foundation reports "fast_brain") }
        brain: { type: string, enum: [fast, slow], description: Which brain produced this state — always fast on the request path }
        feedLatencyMs: { type: ["number", "null"], description: Truth-layer feed latency }
        stateBuildMs: { type: ["number", "null"], description: Fast Brain assembly time on the server }
        renderLatencyMs: { type: ["number", "null"], description: Client-measured chart render time; null on the server }
        overlayLatencyMs: { type: ["number", "null"], description: Client-measured overlay paint time; null on the server }
        slowBrainBlockedLiveExecution: { type: boolean, description: INVARIANT — always false; the Slow Brain never runs on the live-execution path }
        slowBrainLastRunAt: { type: ["string", "null"], description: Last background Slow Brain run, or null when it has never run }

    RubyDraftReadRequest:
      type: object
      required: [symbol, intent]
      properties:
        symbol: { type: string, minLength: 1, maxLength: 64 }
        timeframe: { type: string, enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1], default: M5 }
        limit: { type: integer, minimum: 1, maximum: 5000, default: 300 }
        intent:
          type: string
          enum: [analyze, is-this-a-buy, is-this-a-scalp, why-not-now, what-changes-my-mind, what-invalidates, hold-or-close, agent-consensus]
        draft:
          description: Optional draft the user is contemplating. Ruby reads it but NEVER executes it.
          oneOf:
            - type: object
              required: [side, entry, sl, tp]
              properties:
                side: { type: string, enum: [BUY, SELL] }
                entry: { type: number }
                sl: { type: number }
                tp: { type: number }
            - type: "null"

    RubyDraftConsensusView:
      type: object
      description: Advisory/shadow agent-consensus view — never gates a trade or the live path.
      required: [populated, headline, stance, conflict, protective, cautions]
      properties:
        populated: { type: boolean }
        headline: { type: string }
        stance: { type: string, enum: [support, caution, mixed, neutral] }
        conflict: { type: boolean }
        protective: { type: boolean }
        cautions: { type: array, items: { type: string } }

    RubyDraftRead:
      type: object
      description: Deterministic, read-only prepared Ruby read over the Chart Intelligence State. Decision support only — the chart never executes from it.
      required: [intent, symbol, displaySymbol, timeframe, feedUsable, dataQuality, bias, headline, points, cautions, bestNextAction, confidenceLabel, confidenceScore, agentConsensus, disclaimer]
      properties:
        intent:
          type: string
          enum: [analyze, is-this-a-buy, is-this-a-scalp, why-not-now, what-changes-my-mind, what-invalidates, hold-or-close, agent-consensus]
        symbol: { type: string }
        displaySymbol: { type: string }
        timeframe: { type: string }
        feedUsable: { type: boolean, description: True when the state is fresh and understanding engines are populated }
        dataQuality: { type: string, enum: [ok, insufficient], description: "Mirrors the chart-read honesty signal — 'insufficient' when the underlying feed is stale/unconfirmed so the read carries a visible 'feed not confirmed' caveat. Advisory only; never gates execution." }
        bias: { type: string, enum: [bullish, bearish, neutral, unknown] }
        headline: { type: string }
        points: { type: array, items: { type: string } }
        cautions: { type: array, items: { type: string } }
        bestNextAction: { type: string }
        confidenceLabel: { type: string }
        signalStrength: { type: ["number", "null"], description: "Canonical name for the readiness score 0-100 — a hand-weighted signal strength, NOT a calibrated win probability. Always equals confidenceScore while both are emitted." }
        confidenceScore: { type: ["number", "null"], deprecated: true, description: "Deprecated alias of signalStrength — same value, kept (and still required) so existing clients keep working." }
        agentConsensus: { $ref: "#/components/schemas/RubyDraftConsensusView" }
        disclaimer: { type: string }

    RubyDraftReadResponse:
      type: object
      required: [draftRead, safetyMode, liveLocked, readOnlyMode, allowOrderExecution]
      properties:
        draftRead: { $ref: "#/components/schemas/RubyDraftRead" }
        safetyMode: { type: string, enum: [paper_only] }
        liveLocked: { type: boolean }
        readOnlyMode: { type: boolean }
        allowOrderExecution: { type: boolean }

    # ── Chart Brain v2 — Task 5: per-user decision memory (Slow Brain) ──
    ChartSetupFingerprint:
