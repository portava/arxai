    # Live Test Cycle response shape.
    #
    # The live-test-cycle endpoints themselves are not yet declared as
    # paths in this spec (they are consumed via raw fetch from
    # `ControlledLiveTestButton.tsx`), but this schema is the canonical,
    # contract-frozen definition of the response. In particular:
    #
    # - `realizedPlUsd` is NULLABLE and MUST be ignored by any
    #   downstream ledger / aggregate / report / AI-learning consumer
    #   unless `pnlStatus === "COMPUTED"`.
    # - `pnlStatus` is the data-quality discriminator: PENDING while
    #   the cycle is open, COMPUTED when a valid broker close fill was
    #   ingested, UNKNOWN when the EA close-result omitted the fill
    #   price (or any other invalid-fill condition documented in
    #   `artifacts/api-server/src/lib/live/realizedPnl.ts`).
    # - `dataQualityFlag` carries a machine-readable tag (e.g.
    #   `MISSING_CLOSE_FILL_PRICE`) when `pnlStatus === "UNKNOWN"`.
    LiveTestCycle:
      type: object
      required: [cycleId, userId, status, symbol, side, requestedVolume, stopLoss, pnlStatus]
      properties:
        cycleId:
          type: string
        userId:
          type: integer
        status:
          type: string
          enum:
            - PENDING_PRECHECK
            - DRY_RUN_BLOCKED
            - OPEN_DISPATCHED
            - OPEN_REJECTED
            - OPEN_FILLED
            - CLOSE_DISPATCHED
            - CLOSE_FAILED_MANUAL_REQUIRED
            - COMPLETED
        symbol:
          type: string
        side:
          type: string
          enum: [BUY, SELL]
        requestedVolume:
          type: number
        stopLoss:
          type: number
        takeProfit:
          type: ["number", "null"]
        openCommandId:
          type: ["string", "null"]
        openBrokerTicket:
          type: ["string", "null"]
        openFillPrice:
          type: ["number", "null"]
        openRejectionReason:
          type: ["string", "null"]
        closeCommandId:
          type: ["string", "null"]
        closeFillPrice:
          type: ["number", "null"]
        closeRejectionReason:
          type: ["string", "null"]
        # Nullable on purpose. Consumers MUST gate on `pnlStatus`.
        realizedPlUsd:
          type: ["number", "null"]
        pnlStatus:
          type: string
          enum: [PENDING, COMPUTED, UNKNOWN]
          description: >-
            Data-quality discriminator for `realizedPlUsd`. Any ledger
            / aggregate / report / AI-learning consumer MUST treat the
            P/L value as unusable unless this is "COMPUTED".
        dataQualityFlag:
          type: ["string", "null"]
          description: >-
            Machine-readable reason `pnlStatus` is UNKNOWN. Known
            values: `MISSING_CLOSE_FILL_PRICE`, `MISSING_OPEN_FILL_PRICE`.
        reportedEaVersion:
          type: ["string", "null"]
          description: >-
            EA version reported by the bridge that closed the cycle,
            captured at completion. When `pnlStatus` is UNKNOWN and this
            is below 1.28 (or null), the close fill price was missing
            because the EA is too old to report it — the UI surfaces an
            upgrade-to-v1.28 hint.

    BotStatus:
      type: object
      required: [mode, symbol, strategy, riskMode, isRunning, isPaused]
      properties:
        mode:
          type: string
          enum: [OFF, DEMO, LIVE]
        symbol:
          type: string
        strategy:
          type: string
        riskMode:
          type: string
          enum: [Conservative, Balanced, Aggressive]
        isRunning:
          type: boolean
        isPaused:
          type: boolean
        lastScanAt:
          type: ["string", "null"]

    BotStatusUpdate:
      type: object
      properties:
        mode:
          type: string
          enum: [OFF, DEMO, LIVE]
        symbol:
          type: string
        strategy:
          type: string
        riskMode:
          type: string
          enum: [Conservative, Balanced, Aggressive]
        isRunning:
          type: boolean
        isPaused:
          type: boolean

    BotSettings:
      type: object
      required: [id, symbol, strategy, riskMode, mode, autoTrade, enabledStrategies, newsFilter, sessionFilter]
      properties:
        id:
          type: integer
        symbol:
          type: string
        strategy:
          type: string
        riskMode:
          type: string
        mode:
          type: string
        autoTrade:
          type: boolean
        enabledStrategies:
          type: array
          items:
            type: string
        newsFilter:
          type: boolean
        sessionFilter:
          type: boolean
        scanIntervalSeconds:
          type: integer

    BotSettingsUpdate:
      type: object
      properties:
        symbol:
          type: string
        strategy:
          type: string
        riskMode:
          type: string
        mode:
          type: string
        autoTrade:
          type: boolean
        enabledStrategies:
          type: array
          items:
            type: string
        newsFilter:
          type: boolean
        sessionFilter:
          type: boolean
        scanIntervalSeconds:
          type: integer

    EmergencyStopResult:
      type: object
      required: [success, message, closedTrades]
      properties:
        success:
          type: boolean
        message:
          type: string
        closedTrades:
          type: integer

    Signal:
      type: object
      required: [id, symbol, direction, confidence, entryPrice, stopLoss, takeProfit, strategy, reason, riskWarning, createdAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        direction:
          type: string
          enum: [BUY, SELL, WAIT]
        confidence:
          type: integer
        entryPrice:
          type: number
        stopLoss:
          type: number
        takeProfit:
          type: number
        strategy:
          type: string
        reason:
          type: string
        riskWarning:
          type: string
        createdAt:
          type: string

    Trade:
      type: object
      required: [id, symbol, direction, lot, entryPrice, stopLoss, takeProfit, strategy, confidence, status, mode, createdAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        direction:
          type: string
          enum: [BUY, SELL]
        lot:
          type: number
        entryPrice:
          type: number
        stopLoss:
          type: number
        takeProfit:
          type: number
        strategy:
          type: string
        confidence:
          type: integer
        status:
          type: string
          enum: [OPEN, CLOSED_WIN, CLOSED_LOSS, CANCELLED]
        mode:
          type: string
          enum: [DEMO, LIVE]
        pnl:
          type: ["number", "null"]
        # Mirrors lib/live/realizedPnl pnlStatus contract. When set to
        # "UNKNOWN" the row MUST be excluded from any P/L aggregation
        # (totalPnl, winRate, equity curve, profit factor) and the UI
        # MUST render "P/L unavailable" instead of the numeric pnl.
        # null = legacy / implicit COMPUTED (or PENDING for OPEN rows).
        pnlStatus:
          type: ["string", "null"]
          enum: [PENDING, COMPUTED, UNKNOWN, null]
        # Machine-readable reason the broker close-result did not yield a
        # trustworthy P/L (e.g. "MISSING_CLOSE_FILL_PRICE"). Surfaced only
        # under admin diagnostics — never to anonymous callers.
        dataQualityFlag:
          type: ["string", "null"]
        # EA version that reported the close when pnlStatus is "UNKNOWN". The
        # Trade Logs UI shows an "upgrade to v1.28" nudge when this is null or
        # < 1.28 (the first EA version that returns the broker's real close fill
        # price). Null for legacy/demo rows or COMPUTED closes.
        reportedEaVersion:
          type: ["string", "null"]
        closedAt:
          type: ["string", "null"]
        createdAt:
          type: string

    TradeInput:
      type: object
      required: [symbol, direction, lot, entry, sl, tp, strategy, confidence]
      properties:
        symbol:
          type: string
        direction:
          type: string
          enum: [BUY, SELL]
        lot:
          type: number
        entry:
          type: number
        sl:
          type: number
        tp:
          type: number
        strategy:
          type: string
        confidence:
          type: integer
        # Build F — Live Execution Safety Layer.
        # Optional today (PAPER/SIMULATED stays open). When safety_core
        # operationalMode escalates to LIVE_TRADING, the trades route REQUIRES
        # this id to point to a CONFIRMED, non-executed, non-expired
        # execution_confirmations row.
        confirmationId:
          type: ["integer", "null"]

    TradeResult:
      type: object
      required: [success, message, tradeId, mode]
      properties:
        success:
          type: boolean
        message:
          type: string
        tradeId:
          type: integer
        mode:
          type: string

    AssistantSettings:
      type: object
      required: [displayName, isDefault]
      properties:
        displayName:
          type: string
          description: Resolved assistant display name for this user (default "Eleanor").
        isDefault:
          type: boolean
          description: True when the user has not set a custom name (using the default).
    AssistantSettingsUpdate:
      type: object
      properties:
        displayName:
          type: string
