      properties:
        receipt: { $ref: "#/components/schemas/ChartDecisionReceiptView" }
        outcomes:
          type: array
          items: { $ref: "#/components/schemas/ChartDecisionOutcomeView" }
        safetyMode: { type: string, enum: [paper_only] }
        liveLocked: { type: boolean }
        readOnlyMode: { type: boolean }
        allowOrderExecution: { type: boolean }

    ChartDecisionOutcomeCreateRequest:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [OUTCOME, REVIEW] }
        outcome:
          type: string
          enum:
