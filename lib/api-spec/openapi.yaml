        readOnlyMode: { type: boolean }
        allowOrderExecution: { type: boolean }

    ChartReasoningCondition:
      type: object
      description: A single level-tied condition that would improve, weaken, or invalidate the current read. Decision-support text only — never an execution instruction.
      required: [kind, text, price]
      properties:
        kind: { type: string, enum: [improve, weaken, invalidate] }
        text: { type: string }
        price: { type: ["number", "null"], description: The pivotal price when level-tied, else null }

    ChartOppositeScenario:
      type: object
      description: The opposite-direction scenario — what would flip the bias and what to expect if it does.
      required: [direction, trigger, triggerPrice, expectation]
      properties:
        direction: { type: string, enum: [bullish, bearish, neutral, unknown] }
        trigger: { type: string }
        triggerPrice: { type: ["number", "null"] }
        expectation: { type: string }

    ChartDecisionReasoning:
      type: object
      description: What-would-change-my-mind plus opposite scenario, tied to real level prices. Honest when unpopulated. The chart never executes from this.
      required: [populated, bias, improve, weaken, invalidate, opposite, note]
      properties:
        populated: { type: boolean }
        bias: { type: string, enum: [bullish, bearish, neutral, unknown] }
        improve: { type: array, items: { $ref: "#/components/schemas/ChartReasoningCondition" } }
        weaken: { type: array, items: { $ref: "#/components/schemas/ChartReasoningCondition" } }
        invalidate: { type: array, items: { $ref: "#/components/schemas/ChartReasoningCondition" } }
        opposite:
          oneOf:
            - $ref: "#/components/schemas/ChartOppositeScenario"
            - type: "null"
        note: { type: string }

    ChartForkBranch:
      type: object
      description: One branch of the decision fork at the nearest pivotal level, with a likelihood (not a prediction) and the read it leads to.
      required: [kind, likelihood, price, text, leadsTo]
      properties:
        kind: { type: string, enum: [break, hold, fakeout, rejection, chop, invalidation] }
        likelihood: { type: string, enum: [low, medium, high] }
        price: { type: ["number", "null"] }
        text: { type: string }
        leadsTo: { type: string }

    ChartCandleExpectation:
      type: object
      description: An expectation for the next 1–3 candles with what would confirm or invalidate it.
      required: [horizon, text, confirms, invalidates]
      properties:
        horizon: { type: integer, description: 1 = next candle, up to 3 }
        text: { type: string }
        confirms: { type: string }
        invalidates: { type: string }

    ChartDecisionFork:
      type: object
      description: Decision fork map (break/hold/fakeout/rejection/chop/invalidation) + next 1–3 candle expectations, with a downgrade signal when expected behaviour is already failing. Likelihoods are not predictions. The chart never executes from this.
      required: [populated, pivotPrice, pivotKind, branches, expectations, downgrade, downgradeReason, note]
      properties:
        populated: { type: boolean }
        pivotPrice: { type: ["number", "null"] }
        pivotKind: { type: ["string", "null"], enum: [support, resistance, null] }
        branches: { type: array, items: { $ref: "#/components/schemas/ChartForkBranch" } }
        expectations: { type: array, items: { $ref: "#/components/schemas/ChartCandleExpectation" } }
        downgrade: { type: boolean }
        downgradeReason: { type: ["string", "null"] }
        note: { type: string }

    ChartConsensusAgent:
      type: object
      description: A plain agent name + stance only — never internal keys, departments, or raw numbers.
      required: [name, stance]
      properties:
        name: { type: string }
        stance: { type: string, enum: [SUPPORT, CAUTION, CHALLENGE, NEUTRAL] }

    ChartAgentConsensus:
      type: object
      description: User-safe agent-consensus summary over the chart's own decision. ADVISORY/SHADOW ONLY — never gates a trade or the live 16-gate path, never changes liveLocked/allowOrderExecution. Honestly unpopulated when specialist agents are in shadow.
      required: [populated, headline, detail, stance, conflict, protective, influencingAgentCount, agents, cautions, note]
      properties:
        populated: { type: boolean, description: True only when specialist agents actually influenced the read }
        headline: { type: string }
        detail: { type: string }
        stance: { type: string, enum: [support, caution, mixed, neutral] }
        conflict: { type: boolean, description: True when agents both support and push back }
        protective: { type: boolean, description: True when Court governance lowered the read }
        influencingAgentCount: { type: integer }
        agents: { type: array, items: { $ref: "#/components/schemas/ChartConsensusAgent" } }
        cautions: { type: array, items: { type: string } }
        note: { type: string }

    ChartTrendlinePoint:
      type: object
      description: A single time/price anchor on the chart time scale (Unix seconds). Always a real candle time — never fabricated.
      required: [time, price]
      properties:
        time: { type: integer, description: Bar open time, Unix seconds (UTC) }
        price: { type: number }
    ChartTrendlineSegment:
      type: object
      description: One drawable straight segment derived from a detected trendline rail (display-only).
      required: [id, name, category, bias, status, dominant, start, end]
      properties:
        id: { type: string, description: Stable key; channel rails suffix the base id with ":rail" }
        name: { type: string }
        category: { type: string, enum: [support, resistance, channel, trend] }
        bias: { type: string, enum: [bullish, bearish, neutral] }
        status: { type: string, enum: [none, forming, confirmed, retesting, broken, reclaimed, exhausted, failed] }
        dominant: { type: boolean, description: True for the dominant trendline (drawn with emphasis) }
        start: { $ref: "#/components/schemas/ChartTrendlinePoint" }
        end: { $ref: "#/components/schemas/ChartTrendlinePoint" }
    ChartTrendlineMarker:
      type: object
      description: A break / retest / reclaim / false-break point on the dominant line (display-only).
      required: [time, price, kind, bias, label]
      properties:
        time: { type: integer, description: Bar open time, Unix seconds (UTC) }
        price: { type: number }
        kind: { type: string, enum: [none, break, retest, reclaim, failure, acceleration, flattening] }
        bias: { type: string, enum: [bullish, bearish, neutral] }
        label: { type: string }
    ChartTrendlineOverlay:
      type: object
      description: >
        Task #651 display-only trendline/channel overlay derived from the existing
        trendline truth verdict. Honesty fail-closed — lines/markers are populated
        only when visible (live-confirmed feed + detected geometry). NEVER a trade
        affordance and never touches any execution gate.
      required: [visible, contextOnly, insufficient, status, bias, lines, markers, note]
      properties:
        visible: { type: boolean, description: True only when geometry may be drawn (live-confirmed + has lines) }
        contextOnly: { type: boolean, description: The verdict display fold fired (feed not live-confirmed / capped) }
        insufficient: { type: boolean, description: Window too short for any trendline }
        status: { type: string, enum: [none, forming, confirmed, retesting, broken, reclaimed, exhausted, failed] }
        bias: { type: string, enum: [bullish, bearish, neutral] }
        lines: { type: array, items: { $ref: "#/components/schemas/ChartTrendlineSegment" } }
        markers: { type: array, items: { $ref: "#/components/schemas/ChartTrendlineMarker" } }
        note: { type: string, nullable: true }

    ChartIntelligenceState:
      type: object
      description: Centralized per-symbol/timeframe Chart Intelligence State built on the Level 1 Truth Layer by the Fast Brain.
      required:
        [symbol, displaySymbol, timeframe, assetClass, aiUsable, stale,
         truthState, currentCandle, latestClosedCandle, candleStats, fastFlags,
         marketUnderstanding, setupState, decisionState, decisionReasoning,
         decisionFork, agentConsensus, marketSentences, trendlineOverlay,
         speedState, lastUpdated,
         chartTruthScore, chartReadScore, gateOutput, brokerAlignment]
      properties:
        symbol: { type: string }
        displaySymbol: { type: string }
        timeframe: { type: string, enum: [M1, M2, M3, M4, M5, M6, M10, M12, M15, M20, M30, H1, H2, H3, H4, H6, H8, H12, D1, W1, MN1] }
        assetClass: { type: string, enum: [synthetic, forex, metals, indices, crypto, stocks, unknown] }
        aiUsable: { type: boolean, description: Mirrors the truth layer — true only when the feed is clean }
        stale: { type: boolean, description: True when the underlying feed is stale/dirty }
        truthState: { $ref: "#/components/schemas/ChartFeedStatus" }
        currentCandle:
          oneOf:
            - $ref: "#/components/schemas/ChartCandle"
            - type: "null"
        latestClosedCandle:
          oneOf:
            - $ref: "#/components/schemas/ChartCandle"
            - type: "null"
        candleStats: { $ref: "#/components/schemas/ChartCandleStats" }
        fastFlags: { $ref: "#/components/schemas/ChartFastFlags" }
        marketUnderstanding: { $ref: "#/components/schemas/ChartMarketUnderstanding" }
        setupState: { $ref: "#/components/schemas/ChartSetupState" }
        decisionState: { $ref: "#/components/schemas/ChartDecisionState" }
        decisionReasoning: { $ref: "#/components/schemas/ChartDecisionReasoning" }
        decisionFork: { $ref: "#/components/schemas/ChartDecisionFork" }
        agentConsensus: { $ref: "#/components/schemas/ChartAgentConsensus" }
        marketSentences: { $ref: "#/components/schemas/ChartMarketSentences" }
        trendlineOverlay:
          description: Task #651 display-only trendline/channel overlay (fail-closed honesty; never a trade affordance).
          $ref: "#/components/schemas/ChartTrendlineOverlay"
        speedState: { $ref: "#/components/schemas/ChartSpeedState" }
        lastUpdated: { type: string, description: ISO 8601 timestamp this state was assembled }
        chartTruthScore:
          description: Phase 3 weighted Chart Truth Score (data quality / freshness / mirror / render).
          $ref: "#/components/schemas/ChartTruthScore"
        chartReadScore:
          description: Phase 3 Chart Read Score (setup readability / tradability).
          $ref: "#/components/schemas/ChartReadScore"
        gateOutput:
          description: Phase 3 hard gate output — which chart-based actions are currently allowed.
          $ref: "#/components/schemas/ChartGateOutput"
        brokerAlignment:
          description: >
            Phase 3 broker price alignment. Uses noBrokerAlignment placeholder in the cached
            intelligence path; Phase 4 route-level enrichment supplies live per-user broker data.
          $ref: "#/components/schemas/BrokerPriceAlignment"

