        readOnlyMode: { type: boolean }
        allowOrderExecution: { type: boolean }

    ChartDecisionReceiptListResponse:
      type: object
      required: [receipts, safetyMode, liveLocked, readOnlyMode, allowOrderExecution]
      properties:
        receipts:
          type: array
          items: { $ref: "#/components/schemas/ChartDecisionReceiptView" }
        safetyMode: { type: string, enum: [paper_only] }
        liveLocked: { type: boolean }
        readOnlyMode: { type: boolean }
        allowOrderExecution: { type: boolean }

    ChartDecisionReceiptDetailResponse:
      type: object
