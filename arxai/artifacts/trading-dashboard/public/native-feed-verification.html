<!doctype html><meta charset="utf-8"><title>ARX native feed verification</title><style>body{font:18px system-ui;background:#101622;color:#e4edff;padding:40px}button,a{padding:12px}</style><h1>ARX native feed verification</h1><p>43 markets: native bid/ask, M1/M5/H1 charts, heat map, calendar. Read-only.</p><button id="start">Start verification</button><a id="download" hidden>Download verification evidence</a><p id="status">Ready</p><script>const symbols=['V75','V75_1S','V100','V50','V50_1S','V25_1S','V10','BOOM1000','CRASH1000','BOOM500','CRASH500','JUMP10','JUMP25','JUMP50','JUMP75','JUMP100','BOOM300','CRASH300','EURUSD','GBPUSD','USDJPY','USDCHF','USDCAD','AUDUSD','NZDUSD','EURJPY','EURGBP','EURAUD','EURCAD','GBPJPY','GBPAUD','GBPCAD','AUDJPY','CADJPY','CHFJPY','XAUUSD','XAGUSD','DXY','SPX500','GER30','US30','BTCUSD','ETHUSD'];
const result={startedAt:null,completedAt:null,responses:[]};
const status=document.querySelector('#status');
function save(){const a=document.querySelector('#download');if(a.href)URL.revokeObjectURL(a.href);a.href=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'}));a.download='arx-native-feed-verification-20261105.json';a.hidden=false;}
async function req(path,round){const startedAt=new Date().toISOString();try{const r=await fetch('/api'+path,{credentials:'include',cache:'no-store',signal:AbortSignal.timeout(45000)});const data=await r.json();result.responses.push({round,path,startedAt,receivedAt:new Date().toISOString(),status:r.status,data});}catch(e){result.responses.push({round,path,startedAt,error:String(e)});}save();status.textContent='Round '+round+' — '+result.responses.length+' responses';}
document.querySelector('#start').onclick=async()=>{document.querySelector('#start').disabled=true;result.startedAt=new Date().toISOString();for(let round=1;round<=3;round++){for(let offset=0;offset<symbols.length;offset+=4)await Promise.all(symbols.slice(offset,offset+4).map(s=>req('/data/quote?symbol='+s,round)));if(round===1){for(const s of symbols)await Promise.all(['M1','M5','H1'].map(tf=>req('/chart/candles?symbol='+s+'&timeframe='+tf+'&limit=200',round)));}for(const p of ['/market-heat?timeframe=M5','/market-heat/diagnostics','/news/calendar/envelope?days=7','/admin/market-data/economic-calendar'])await req(p,round);if(round<3)await new Promise(r=>setTimeout(r,10000));}result.completedAt=new Date().toISOString();save();status.textContent='COMPLETE: '+result.responses.length+' real responses';};
</script>
