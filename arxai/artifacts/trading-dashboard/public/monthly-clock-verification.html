<!doctype html><meta charset="utf-8"><title>ARX monthly calendar verification</title><style>body{font:18px system-ui;background:#101622;color:#e4edff;padding:40px}button,a{padding:12px}</style><h1>ARX monthly calendar verification</h1><p>Native monthly freshness and unchanged intraday controls across 43 markets. Original candle timestamps preserved.</p><button id="start">Start verification</button><a id="download" hidden>Download evidence</a><p id="status">Ready</p><script>const symbols=['V75','V75_1S','V100','V50','V50_1S','V25_1S','V10','BOOM1000','CRASH1000','BOOM500','CRASH500','JUMP10','JUMP25','JUMP50','JUMP75','JUMP100','BOOM300','CRASH300','EURUSD','GBPUSD','USDJPY','USDCHF','USDCAD','AUDUSD','NZDUSD','EURJPY','EURGBP','EURAUD','EURCAD','GBPJPY','GBPAUD','GBPCAD','AUDJPY','CADJPY','CHFJPY','XAUUSD','XAGUSD','DXY','SPX500','GER30','US30','BTCUSD','ETHUSD'];
async function req(path,body){const startedAt=new Date().toISOString();try{const r=await fetch('/api'+path,{credentials:'include',cache:'no-store',signal:AbortSignal.timeout(45000),...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const data=await r.json();return {path,startedAt,receivedAt:new Date().toISOString(),status:r.status,data};}catch(e){return {path,startedAt,receivedAt:new Date().toISOString(),error:String(e)};}}

const result={startedAt:null,completedAt:null,responses:[]};const status=document.querySelector('#status');
document.querySelector('#start').onclick=async()=>{document.querySelector('#start').disabled=true;result.startedAt=new Date().toISOString();for(let i=0;i<symbols.length;i+=4){for(const timeframe of ['MN1','M1'])result.responses.push(...await Promise.all(symbols.slice(i,i+4).map(s=>req('/chart/candles?symbol='+s+'&timeframe='+timeframe+'&limit=200'))));result.responses.push(...await Promise.all(symbols.slice(i,i+4).map(s=>req('/data/quote?symbol='+s))));status.textContent='Verified response capture '+Math.min(i+4,symbols.length)+'/43 markets';}result.completedAt=new Date().toISOString();const a=document.querySelector('#download');a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='arx-monthly-clock-verification-20261105.json';a.hidden=false;const monthly=result.responses.filter(r=>r.path.includes('timeframe=MN1'));const lagErrors=monthly.filter(r=>{const c=r.data?.candles?.filter(c=>c.isFinal&&!c.isForming).at(-1);if(!c)return true;const a=new Date(c.openTime),b=new Date(r.receivedAt),gap=(b.getUTCFullYear()-a.getUTCFullYear())*12+b.getUTCMonth()-a.getUTCMonth();return r.data.feedStatus.trailingIntervals!==gap;});status.textContent='COMPLETE: '+monthly.length+' monthly charts; '+lagErrors.length+' calendar-lag mismatches. Exact native price comparisons evaluated separately. Trading disabled.';};
</script>
