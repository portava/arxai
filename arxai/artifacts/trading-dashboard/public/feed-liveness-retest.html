<!doctype html><meta charset="utf-8"><title>ARX feed liveness verification</title><style>body{font:18px system-ui;background:#101622;color:#e4edff;padding:40px}button,a{padding:12px}</style><h1>ARX feed liveness verification</h1><p>43 markets × 21 timeframes, repeated beyond the five-minute expiry window. Original candle timestamps retained. Trading disabled.</p><button id="start">Start verification</button><a id="download" hidden>Download evidence</a><a id="frozen" hidden>Download frozen prospective baseline</a><p id="status">Ready</p><script>const symbols=['V75','V75_1S','V100','V50','V50_1S','V25_1S','V10','BOOM1000','CRASH1000','BOOM500','CRASH500','JUMP10','JUMP25','JUMP50','JUMP75','JUMP100','BOOM300','CRASH300','EURUSD','GBPUSD','USDJPY','USDCHF','USDCAD','AUDUSD','NZDUSD','EURJPY','EURGBP','EURAUD','EURCAD','GBPJPY','GBPAUD','GBPCAD','AUDJPY','CADJPY','CHFJPY','XAUUSD','XAGUSD','DXY','SPX500','GER30','US30','BTCUSD','ETHUSD'];
const tfs=['M1','M2','M3','M4','M5','M6','M10','M12','M15','M20','M30','H1','H2','H3','H4','H6','H8','H12','D1','W1','MN1'];
async function req(path,body){const startedAt=new Date().toISOString();try{const r=await fetch('/api'+path,{credentials:'include',cache:'no-store',signal:AbortSignal.timeout(45000),...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const data=await r.json();return {path,startedAt,receivedAt:new Date().toISOString(),status:r.status,data};}catch(e){return {path,startedAt,receivedAt:new Date().toISOString(),error:String(e)};}}

const result={startedAt:null,completedAt:null,rounds:[]};const status=document.querySelector('#status');
function save(){const a=document.querySelector('#download');if(a.href)URL.revokeObjectURL(a.href);a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='arx-feed-liveness-retest-20261105.json';a.hidden=false;}
document.querySelector('#start').onclick=async()=>{document.querySelector('#start').disabled=true;result.startedAt=new Date().toISOString();try{
result.prospective??={version:1,protocol:{timeframe:'M1',horizonMs:300000,description:'Prospective 5-minute direction diagnostic after native re-observation repair. Freeze original actual readings; anchor next full M1 open after complete receipt. Evaluate five exact subsequent closed bars from the same source. Abstentions and invalid/inactive reads separate. No trade-win or confidence-calibration claim.'},startedAt:new Date().toISOString(),baseline:[],outcomes:[],errors:[]};
const audit=result.prospective;
for(const symbol of symbols){if(audit.baseline.some(x=>x.symbol===symbol))continue;const q='?symbol='+symbol+'&timeframe=M1';const paths={chart:'/chart/candles'+q+'&limit=200',truth:'/me/market/truth/'+symbol+'?tf=M1',intelligence:'/me/chart/intelligence'+q+'&limit=200',edge:'/me/market-edge'+q,timing:'/me/timing-brain/'+symbol+'?timeframe=M1',quote:'/data/quote?symbol='+symbol,selected:'/market-scanner/selected-market'+q+'&refresh=1'};const responses=Object.fromEntries(await Promise.all(Object.entries(paths).map(async([k,p])=>[k,await req(p)])));responses.readChart=await req('/me/assistant/read-chart',{symbol,timeframe:'M1'});const observedAt=new Date().toISOString();audit.baseline.push({symbol,observedAt,anchorMs:Math.ceil(Date.parse(observedAt)/60000)*60000,responses});status.textContent='Frozen post-repair M1 '+audit.baseline.length+'/43';save();}
if(!result.frozenProspective)result.frozenProspective=structuredClone({...audit,outcomes:[]});
const frozenLink=document.querySelector('#frozen');frozenLink.href=URL.createObjectURL(new Blob([JSON.stringify(result.frozenProspective)],{type:'application/json'}));frozenLink.download='arx-post-liveness-truth-frozen-20261105.json';frozenLink.hidden=false;save();

for(let round=1;round<=2;round++){
const out={round,startedAt:new Date().toISOString(),matrix:[],quotes:[]};result.rounds.push(out);const jobs=symbols.flatMap(symbol=>tfs.map(timeframe=>({symbol,timeframe})));let cursor=0;
await Promise.all(Array.from({length:4},async()=>{while(cursor<jobs.length){const {symbol,timeframe}=jobs[cursor++];const r=await req('/chart/candles?symbol='+symbol+'&timeframe='+timeframe+'&limit=200');if(r.data?.candles){const raw=r.data,closed=raw.candles.filter(b=>b.isFinal&&!b.isForming);r.fullClosedCount=closed.length;r.fullResponseSha256=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(JSON.stringify(raw)))),x=>x.toString(16).padStart(2,'0')).join('');r.data={...raw,candles:closed.length<=10?closed:[...closed.slice(0,5),...closed.slice(-5)]};}out.matrix.push({symbol,timeframe,response:r});status.textContent='Round '+round+': '+out.matrix.length+'/903 series';}}));
for(let i=0;i<symbols.length;i+=4)out.quotes.push(...await Promise.all(symbols.slice(i,i+4).map(s=>req('/data/quote?symbol='+s))));out.completedAt=new Date().toISOString();save();
if(round===1){const due=Date.now()+330000;while(Date.now()<due){status.textContent='First round saved. Waiting beyond five-minute provider expiry: '+Math.ceil((due-Date.now())/1000)+' seconds';await new Promise(r=>setTimeout(r,Math.min(10000,due-Date.now())));}}
}
result.baseline=[];result.protocol={timeframe:'M15'};
for(const symbol of symbols){const q='?symbol='+symbol+'&timeframe=M15';const paths={chart:'/chart/candles'+q+'&limit=200',truth:'/me/market/truth/'+symbol+'?tf=M15',intelligence:'/me/chart/intelligence'+q+'&limit=200',edge:'/me/market-edge'+q,timing:'/me/timing-brain/'+symbol+'?timeframe=M15',selected:'/market-scanner/selected-market'+q+'&refresh=1'};const responses=Object.fromEntries(await Promise.all(Object.entries(paths).map(async([k,p])=>[k,await req(p)])));responses.readChart=await req('/me/assistant/read-chart',{symbol,timeframe:'M15'});result.baseline.push({symbol,timeframe:'M15',observedAt:new Date().toISOString(),responses});status.textContent='Post-expiry M15 surfaces '+result.baseline.length+'/43';}save();
for(const original of audit.baseline){if(audit.outcomes.some(x=>x.symbol===original.symbol))continue;const due=original.anchorMs+audit.protocol.horizonMs+90000;while(Date.now()<due){status.textContent='Waiting for fixed post-repair M1 outcome windows';await new Promise(r=>setTimeout(r,Math.min(10000,due-Date.now())));}const chart=await req('/chart/candles?symbol='+original.symbol+'&timeframe=M1&limit=200');audit.outcomes.push({symbol:original.symbol,receivedAt:new Date().toISOString(),chart});status.textContent='Post-repair outcomes '+audit.outcomes.length+'/43';save();}audit.completedAt=new Date().toISOString();

result.completedAt=new Date().toISOString();save();const all=result.rounds.flatMap(x=>x.matrix);const fallbacks=all.filter(x=>x.response.data?.feedStatus?.notLiveReason==='stored_history').length;const missing=all.filter(x=>x.response.status!==200||!x.response.data?.candles?.length).length;const native=all.filter(x=>x.response.data?.candles?.every(c=>!!c.brokerSymbol)).length;status.textContent='COMPLETE: '+all.length+' chart reads; '+fallbacks+' stored fallbacks; '+missing+' missing/error; '+native+' with native identity. Price and arithmetic comparisons are evaluated separately.';
}catch(e){status.textContent='Error '+e;save();}};
</script>
