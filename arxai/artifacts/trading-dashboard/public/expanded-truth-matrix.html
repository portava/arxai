<!doctype html><meta charset="utf-8"><title>ARX complete timeframe truth matrix</title><style>body{font:18px system-ui;background:#101622;color:#e4edff;padding:40px}button,a{padding:12px}</style><h1>ARX complete timeframe truth matrix</h1><p>43 markets ×21 timeframes. Closed-candle samples, M15 truth/Smart Chart/Eleanor, native bid/ask, heat map and calendar. Trading disabled.</p><button id="check-session">Check session</button><button id="start">Start or resume verification</button><a id="download" hidden>Download verification evidence</a><a id="frozen" hidden>Download frozen post-repair M1 baseline</a><p id="status">Ready</p><script>const symbols=['V75','V75_1S','V100','V50','V50_1S','V25_1S','V10','BOOM1000','CRASH1000','BOOM500','CRASH500','JUMP10','JUMP25','JUMP50','JUMP75','JUMP100','BOOM300','CRASH300','EURUSD','GBPUSD','USDJPY','USDCHF','USDCAD','AUDUSD','NZDUSD','EURJPY','EURGBP','EURAUD','EURCAD','GBPJPY','GBPAUD','GBPCAD','AUDJPY','CADJPY','CHFJPY','XAUUSD','XAGUSD','DXY','SPX500','GER30','US30','BTCUSD','ETHUSD'];
const tfs=['M1','M2','M3','M4','M5','M6','M10','M12','M15','M20','M30','H1','H2','H3','H4','H6','H8','H12','D1','W1','MN1'];
let db;const result={protocol:{timeframe:'M15',description:'Read-only 43-market x21-timeframe coverage, first/last5 exact broker candle samples per series, all43 M15 surface arithmetic, quote and macro reads. Sample coverage is explicit; no forecast or trade-win claim.'},startedAt:null,completedAt:null,matrix:[],baseline:[],responses:[]};
const status=document.querySelector('#status');
async function req(path,body){const startedAt=new Date().toISOString();try{const r=await fetch('/api'+path,{credentials:'include',cache:'no-store',signal:AbortSignal.timeout(45000),...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const data=await r.json();return {path,startedAt,receivedAt:new Date().toISOString(),status:r.status,data};}catch(e){return {path,startedAt,receivedAt:new Date().toISOString(),error:String(e)};}}
async function save(download=false){const t=db.transaction('runs','readwrite');t.objectStore('runs').put(structuredClone(result),'current');await new Promise((r,j)=>{t.oncomplete=r;t.onerror=j});if(download){const a=document.querySelector('#download');if(a.href)URL.revokeObjectURL(a.href);a.href=URL.createObjectURL(new Blob([JSON.stringify(result)],{type:'application/json'}));a.download='arx-expanded-truth-matrix-20261105.json';a.hidden=false;}}
document.querySelector('#start').onclick=async()=>{document.querySelector('#start').disabled=true;try{db=await new Promise((r,j)=>{const q=indexedDB.open('arx-expanded-truth-matrix-20261105',1);q.onupgradeneeded=()=>q.result.createObjectStore('runs');q.onsuccess=()=>r(q.result);q.onerror=j;});const prior=await new Promise((r,j)=>{const q=db.transaction('runs').objectStore('runs').get('current');q.onsuccess=()=>r(q.result);q.onerror=j;});if(prior)Object.assign(result,prior);result.startedAt??=new Date().toISOString();
const sessionCheck=await req('/me/market/truth/V75?tf=M1');if(sessionCheck.status!==200)throw new Error('Authenticated truth preflight failed: HTTP '+sessionCheck.status);
result.prospective??={version:1,protocol:{timeframe:'M1',horizonMs:300000,description:'Prospective 5-minute direction diagnostic after repairs. Freeze original actual readings; anchor next full M1 open after complete receipt. Evaluate five exact subsequent closed bars from the same source. Abstentions and invalid/inactive reads separate. No trade-win or confidence-calibration claim.'},startedAt:new Date().toISOString(),baseline:[],outcomes:[],errors:[]};
const audit=result.prospective;
for(const symbol of symbols){if(audit.baseline.some(x=>x.symbol===symbol))continue;const q='?symbol='+symbol+'&timeframe=M1';const paths={chart:'/chart/candles'+q+'&limit=200',truth:'/me/market/truth/'+symbol+'?tf=M1',intelligence:'/me/chart/intelligence'+q+'&limit=200',edge:'/me/market-edge'+q,timing:'/me/timing-brain/'+symbol+'?timeframe=M1',quote:'/data/quote?symbol='+symbol,selected:'/market-scanner/selected-market'+q+'&refresh=1'};const responses=Object.fromEntries(await Promise.all(Object.entries(paths).map(async([k,p])=>[k,await req(p)])));responses.readChart=await req('/me/assistant/read-chart',{symbol,timeframe:'M1'});const observedAt=new Date().toISOString();audit.baseline.push({symbol,observedAt,anchorMs:Math.ceil(Date.parse(observedAt)/60000)*60000,responses});status.textContent='Frozen post-repair M1 '+audit.baseline.length+'/43';await save();}
if(!result.frozenProspective)result.frozenProspective=structuredClone({...audit,outcomes:[]});
const frozenLink=document.querySelector('#frozen');frozenLink.href=URL.createObjectURL(new Blob([JSON.stringify(result.frozenProspective)],{type:'application/json'}));frozenLink.download='arx-post-repair-truth-frozen-20261105.json';frozenLink.hidden=false;await save();
const jobs=symbols.flatMap(symbol=>tfs.map(timeframe=>({symbol,timeframe}))).filter(j=>!result.matrix.some(x=>x.symbol===j.symbol&&x.timeframe===j.timeframe));let cursor=0;
await Promise.all(Array.from({length:4},async()=>{while(cursor<jobs.length){const {symbol,timeframe}=jobs[cursor++];const r=await req('/chart/candles?symbol='+symbol+'&timeframe='+timeframe+'&limit=200');const raw=r.data;if(raw&&Array.isArray(raw.candles)){const bytes=new TextEncoder().encode(JSON.stringify(raw));const digest=await crypto.subtle.digest('SHA-256',bytes);r.fullResponseSha256=Array.from(new Uint8Array(digest),x=>x.toString(16).padStart(2,'0')).join('');r.fullCandleCount=raw.candles.length;const closed=raw.candles.filter(b=>b.isFinal===true&&!b.isForming);r.fullClosedCount=closed.length;const chosen=closed.length<=10?closed:[...closed.slice(0,5),...closed.slice(-5)];r.data={...raw,candles:chosen};r.samplePolicy='All closed bars if<=10; otherwise first5 and last5 closed bars. Forming bars omitted from price samples.';}result.matrix.push({symbol,timeframe,response:r});status.textContent='Series '+result.matrix.length+'/903';if(result.matrix.length%25===0)await save();}}));await save();
for(const symbol of symbols){if(result.baseline.some(x=>x.symbol===symbol))continue;const q='?symbol='+symbol+'&timeframe=M15';const paths={chart:'/chart/candles'+q+'&limit=200',truth:'/me/market/truth/'+symbol+'?tf=M15',intelligence:'/me/chart/intelligence'+q+'&limit=200',edge:'/me/market-edge'+q,timing:'/me/timing-brain/'+symbol+'?timeframe=M15',selected:'/market-scanner/selected-market'+q+'&refresh=1'};const responses=Object.fromEntries(await Promise.all(Object.entries(paths).map(async([k,p])=>[k,await req(p)])));responses.readChart=await req('/me/assistant/read-chart',{symbol,timeframe:'M15'});result.baseline.push({symbol,timeframe:'M15',observedAt:new Date().toISOString(),responses});status.textContent='M15 surfaces '+result.baseline.length+'/43';await save();}
for(let round=1;round<=3;round++){for(let i=0;i<symbols.length;i+=4){const batch=symbols.slice(i,i+4).filter(s=>!result.responses.some(x=>x.round===round&&x.path==='/data/quote?symbol='+s));for(const r of await Promise.all(batch.map(s=>req('/data/quote?symbol='+s))))result.responses.push({round,...r});}for(const path of ['/market-heat?timeframe=M15','/market-heat?timeframe=M5','/market-heat/diagnostics','/news/calendar/envelope?days=7','/economic-calendar/events?daysAhead=7'])if(!result.responses.some(x=>x.round===round&&x.path===path))result.responses.push({round,...await req(path)});status.textContent='Quote/macro round '+round;await save();if(round<3)await new Promise(r=>setTimeout(r,10000));}
for(const original of audit.baseline){if(audit.outcomes.some(x=>x.symbol===original.symbol))continue;const due=original.anchorMs+audit.protocol.horizonMs+90000;while(Date.now()<due){status.textContent='Waiting for fixed post-repair M1 outcome windows';await new Promise(r=>setTimeout(r,Math.min(10000,due-Date.now())));}const chart=await req('/chart/candles?symbol='+original.symbol+'&timeframe=M1&limit=200');audit.outcomes.push({symbol:original.symbol,receivedAt:new Date().toISOString(),chart});status.textContent='Post-repair outcomes '+audit.outcomes.length+'/43';await save();}audit.completedAt=new Date().toISOString();
result.completedAt=new Date().toISOString();await save(true);status.textContent='COMPLETE: '+result.matrix.length+' series, '+result.baseline.length+' M15 surface sets, '+result.responses.length+' quote/macro reads';
}catch(e){status.textContent='Error '+String(e);await save(true);}};

document.querySelector('#check-session').onclick=async()=>{const r=await req('/me/market/truth/V75?tf=M1');status.textContent='Authenticated truth preflight HTTP '+r.status;};
</script>
