<!doctype html><meta charset="utf-8"><title>ARX native-feed prospective truth audit</title><h1>ARX native-feed prospective truth audit</h1><p>Read-only: 43 markets, frozen decisions, five-minute future outcomes. Trading remains disabled.</p><button id="start">Start or resume prospective audit</button><p id="status">Ready</p><a id="download" hidden>Download evidence</a><pre id="log"></pre><script>const symbols=['V75','V75_1S','V100','V50','V50_1S','V25_1S','V10','BOOM1000','CRASH1000','BOOM500','CRASH500','JUMP10','JUMP25','JUMP50','JUMP75','JUMP100','BOOM300','CRASH300','EURUSD','GBPUSD','USDJPY','USDCHF','USDCAD','AUDUSD','NZDUSD','EURJPY','EURGBP','EURAUD','EURCAD','GBPJPY','GBPAUD','GBPCAD','AUDJPY','CADJPY','CHFJPY','XAUUSD','XAGUSD','DXY','SPX500','GER30','US30','BTCUSD','ETHUSD'];
const audit={version:1,protocol:{timeframe:'M1',horizonMs:300000,description:'Prospective 5-minute direction test of actual Truth bias and Eleanor scanner direction; abstentions separate; same-source, closed-bar evaluation only; no trading; no hindsight tuning. Outcome clock begins after the complete original read has been received. Next full M1 open after receipt is the anchor; five subsequent complete M1 bars are required. Both-hit TP/SL is ambiguous, never a win. Confidence is not assumed to be a win probability.'},startedAt:null,baseline:[],outcomes:[],errors:[]};
let db;const status=document.querySelector('#status');const log=s=>{status.textContent=s;document.querySelector('#log').textContent+=s+'\n'};
async function save(){const tx=db.transaction('runs','readwrite');tx.objectStore('runs').put(structuredClone(audit),'current');await new Promise((r,j)=>{tx.oncomplete=r;tx.onerror=j});const a=document.querySelector('#download');if(a.href)URL.revokeObjectURL(a.href);a.href=URL.createObjectURL(new Blob([JSON.stringify(audit,null,2)],{type:'application/json'}));a.download='arx-prospective-truth-native-20261105.json';a.hidden=false;}
async function request(path,body){const beganAt=new Date().toISOString();try{const r=await fetch('/api'+path,{credentials:'include',cache:'no-store',signal:AbortSignal.timeout(45000),...(body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{})});const data=await r.json();return {path,beganAt,receivedAt:new Date().toISOString(),status:r.status,data}}catch(e){return {path,beganAt,receivedAt:new Date().toISOString(),error:String(e)}}}
async function start(){document.querySelector('#start').disabled=true;db=await new Promise((r,j)=>{const q=indexedDB.open('arx-prospective-truth-native-20261105',1);q.onupgradeneeded=()=>q.result.createObjectStore('runs');q.onsuccess=()=>r(q.result);q.onerror=j});const prior=await new Promise((r,j)=>{const q=db.transaction('runs').objectStore('runs').get('current');q.onsuccess=()=>r(q.result);q.onerror=j});if(prior)Object.assign(audit,prior);audit.startedAt??=new Date().toISOString();
for(const symbol of symbols){if(audit.baseline.some(x=>x.symbol===symbol))continue;const q='?symbol='+symbol+'&timeframe=M1';const paths={chart:'/chart/candles'+q+'&limit=200',truth:'/me/market/truth/'+symbol+'?tf=M1',intelligence:'/me/chart/intelligence'+q+'&limit=200',edge:'/me/market-edge'+q,timing:'/me/timing-brain/'+symbol+'?timeframe=M1'};paths.selected='/market-scanner/selected-market'+q+'&refresh=1';const responses=Object.fromEntries(await Promise.all(Object.entries(paths).map(async([k,p])=>[k,await request(p)])));responses.readChart=await request('/me/assistant/read-chart',{symbol,timeframe:'M1'});const observedAt=new Date().toISOString();audit.baseline.push({symbol,observedAt,anchorMs:Math.ceil(Date.parse(observedAt)/60000)*60000,responses});await save();log('Frozen '+symbol+' '+audit.baseline.length+'/'+symbols.length);}
log('All baseline decisions frozen. Waiting for each 5-minute outcome window.');
for(const original of audit.baseline){if(audit.outcomes.some(x=>x.symbol===original.symbol))continue;const due=original.anchorMs+audit.protocol.horizonMs+12000;while(Date.now()<due){await new Promise(r=>setTimeout(r,Math.min(10000,due-Date.now())))}const chart=await request('/chart/candles?symbol='+original.symbol+'&timeframe=M1&limit=200');audit.outcomes.push({symbol:original.symbol,receivedAt:new Date().toISOString(),chart});await save();log('Outcome observed '+original.symbol+' '+audit.outcomes.length+'/'+symbols.length);}
audit.completedAt=new Date().toISOString();await save();log('COMPLETE: immutable baseline and later market evidence saved. Download for evaluation.');}
document.querySelector('#start').onclick=()=>start().catch(e=>{audit.errors.push(String(e));log('Error '+e);save()});
</script>
