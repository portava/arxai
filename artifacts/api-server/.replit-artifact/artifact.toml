kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "bash ../../scripts/run-arx-api.sh"

[services.production]

[services.production.build]
args = ["bash", "scripts/build-arx-production.sh", "api"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["bash", "scripts/run-arx-production.sh"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
