# Read-only smoke check: bash scripts/run-arx-web.sh --preview-smoke (shared router only).
kind = "web"
previewPath = "/"
title = "ARX AI"
version = "1.0.0"
id = "artifacts/trading-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24210

[services.development]
run = "bash ../../scripts/run-arx-web.sh"

[services.production]
build = [ "pnpm", "--dir", "arxai", "--filter", "@workspace/trading-dashboard", "run", "build" ]
publicDir = "arxai/artifacts/trading-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24210"
BASE_PATH = "/"
