<style>
:root{--brand:#b5552f;--brand-d:#8e3f20;--cream:#faf6f1;--ink:#2b211c;--muted:#7a6a60;--line:#eadfd5;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:"Noto Sans KR","Noto Sans JP","Noto Sans SC",system-ui,sans-serif;line-height:1.6}
html[lang=ja] body{font-family:"Noto Sans JP",system-ui,sans-serif}
html[lang=zh] body{font-family:"Noto Sans SC",system-ui,sans-serif}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:10;background:rgba(250,246,241,.95);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.logo{font-family:"Playfair Display",serif;font-size:26px;color:var(--brand);text-decoration:none;letter-spacing:2px}
.links{display:flex;gap:20px}
.links a{text-decoration:none;font-size:15px}
.links a:hover{color:var(--brand)}
.langs{display:flex;gap:4px}
.langs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
.langs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.hero{position:relative;min-height:78vh;display:flex;align-items:flex-end;color:#fff;background:#3a2a22 url(images/salon.jpg) center/cover}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(40,20,10,.75))}
.hero .wrap{position:relative;padding-bottom:64px}
.hero h1{font-family:"Playfair Display",serif;font-size:clamp(36px,7vw,68px);margin:0;line-height:1.1}
.hero p{font-size:clamp(16px,2.2vw,20px);max-width:620px;margin:14px 0 26px}
.btn{display:inline-block;background:var(--brand);color:#fff;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:700}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:transparent;border:2px solid #fff;margin-left:8px}
section{padding:72px 0}
h2{font-size:clamp(26px,4vw,36px);margin:0 0 8px;color:var(--brand-d)}
.sub{color:var(--muted);margin:0 0 36px}
.grid{display:grid;gap:20px}
.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card img{aspect-ratio:4/3;object-fit:cover;width:100%}
.card .b{padding:18px 20px}
.card h3{margin:0 0 6px;font-size:19px}
.card p{margin:0;color:var(--muted);font-size:15px}
.price-list{background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px 24px}
.price-list h3{margin:22px 0 6px;color:var(--brand);font-size:18px}
.row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.row small{display:block;color:var(--muted)}
.row .p{font-weight:700;white-space:nowrap;color:var(--brand-d)}
.row .old{text-decoration:line-through;color:var(--muted);font-weight:400;margin-right:6px}
.prices{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.note{color:var(--muted);font-size:14px;margin-top:16px}
.gallery{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.gallery img{aspect-ratio:1;object-fit:cover;border-radius:12px;width:100%}
.ba{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:560px;margin:28px auto 0}
.ba figure{margin:0;position:relative}
.ba img{aspect-ratio:3/4;object-fit:cover;border-radius:12px}
.ba figcaption{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.6);color:#fff;font-size:13px;padding:3px 10px;border-radius:999px}
.alt{background:#fff;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.contact{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.info p{margin:0 0 14px}
.info b{display:block;color:var(--brand-d)}
.contact img{border-radius:16px}
footer{background:var(--ink);color:#d9cfc7;padding:28px 0;font-size:14px;text-align:center}
@media(max-width:820px){.links{display:none}.btn.ghost{margin:10px 0 0}}
</style>

function setLang(l){
  if(!T[l])l="en";
  document.documentElement.lang=l;
  document.querySelectorAll("[data-i]").forEach(e=>{e.textContent=T[l][e.dataset.i]??T.en[e.dataset.i]});
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));
  try{localStorage.setItem("suzy-lang",l)}catch(e){}
}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
